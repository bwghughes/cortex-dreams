<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Not a Comet: Messier ledger, Tempel 2 comet brushing Messier 30, accidental cat">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="55%" stop-color="#101c2b"/>
      <stop offset="100%" stop-color="#1a1430"/>
    </linearGradient>
    <radialGradient id="cluster" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f4e7c3" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#c9a86c" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6b4e2e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cometCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8fff4"/>
      <stop offset="40%" stop-color="#7dffa8"/>
      <stop offset="100%" stop-color="#1f6b4a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9dffc4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#9dffc4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3e6c8"/>
      <stop offset="100%" stop-color="#d8c39a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <!-- sky -->
  <rect width="960" height="540" fill="url(#sky)"/>

  <!-- faint stars -->
  <g fill="#dfe7ff" opacity="0.75">
    <circle cx="80" cy="60" r="1.2"/>
    <circle cx="140" cy="110" r="0.9"/>
    <circle cx="220" cy="40" r="1.1"/>
    <circle cx="300" cy="90" r="0.8"/>
    <circle cx="380" cy="55" r="1.3"/>
    <circle cx="470" cy="120" r="0.7"/>
    <circle cx="560" cy="35" r="1.0"/>
    <circle cx="640" cy="80" r="0.9"/>
    <circle cx="720" cy="50" r="1.2"/>
    <circle cx="800" cy="100" r="0.8"/>
    <circle cx="880" cy="45" r="1.1"/>
    <circle cx="920" cy="130" r="0.7"/>
    <circle cx="60" cy="200" r="0.8"/>
    <circle cx="180" cy="170" r="1.0"/>
    <circle cx="430" cy="180" r="0.7"/>
    <circle cx="690" cy="160" r="0.9"/>
    <circle cx="850" cy="190" r="0.8"/>
  </g>

  <!-- Messier 30 globular cluster -->
  <g transform="translate(680 210)">
    <circle cx="0" cy="0" r="88" fill="url(#cluster)" filter="url(#soft)"/>
    <g fill="#ffe9b8" opacity="0.9">
      <circle cx="0" cy="0" r="2.2"/>
      <circle cx="12" cy="-8" r="1.4"/>
      <circle cx="-14" cy="6" r="1.3"/>
      <circle cx="8" cy="16" r="1.1"/>
      <circle cx="-18" cy="-12" r="1.2"/>
      <circle cx="22" cy="4" r="1.0"/>
      <circle cx="-6" cy="-20" r="1.1"/>
      <circle cx="16" cy="-22" r="0.9"/>
      <circle cx="-24" cy="14" r="0.9"/>
      <circle cx="4" cy="26" r="0.8"/>
      <circle cx="-10" cy="24" r="0.8"/>
      <circle cx="28" cy="-10" r="0.8"/>
      <circle cx="-30" cy="-4" r="0.9"/>
      <circle cx="18" cy="22" r="0.7"/>
      <circle cx="-20" cy="-24" r="0.7"/>
      <circle cx="32" cy="12" r="0.7"/>
      <circle cx="-8" cy="8" r="1.0"/>
      <circle cx="6" cy="-14" r="0.9"/>
    </g>
    <text x="0" y="108" text-anchor="middle" fill="#c9b48a" font-family="Georgia, serif" font-size="15" letter-spacing="1">M30 — still not a comet</text>
  </g>

  <!-- Tempel 2 comet -->
  <g transform="translate(290 175)">
    <ellipse cx="-70" cy="0" rx="110" ry="14" fill="url(#tail)" transform="rotate(-18)"/>
    <circle cx="0" cy="0" r="22" fill="url(#cometCore)" filter="url(#soft)"/>
    <circle cx="0" cy="0" r="5" fill="#f4fff8"/>
    <text x="-10" y="48" fill="#9dffc4" font-family="Georgia, serif" font-size="14">10P/Tempel 2</text>
    <text x="-10" y="66" fill="#7aa88f" font-family="Georgia, serif" font-size="12">the actual visitor</text>
  </g>

  <!-- Messier ledger / paper -->
  <g transform="translate(70 300)">
    <rect x="0" y="0" width="250" height="180" rx="6" fill="url(#paper)" stroke="#a8895a" stroke-width="2"/>
    <rect x="14" y="18" width="170" height="8" rx="2" fill="#8b6b3e" opacity="0.55"/>
    <rect x="14" y="38" width="210" height="6" rx="2" fill="#8b6b3e" opacity="0.35"/>
    <rect x="14" y="54" width="198" height="6" rx="2" fill="#8b6b3e" opacity="0.35"/>
    <rect x="14" y="70" width="186" height="6" rx="2" fill="#8b6b3e" opacity="0.35"/>
    <text x="14" y="108" fill="#5a3f22" font-family="Georgia, serif" font-size="18" font-style="italic">“Still not a comet.”</text>
    <text x="14" y="132" fill="#6d5230" font-family="Georgia, serif" font-size="13">He writes it down anyway.</text>
    <text x="14" y="158" fill="#6d5230" font-family="Georgia, serif" font-size="12">110 refusals become the map.</text>
  </g>

  <!-- accidental cat silhouette -->
  <g transform="translate(820 390)" fill="#d7c4a0" opacity="0.92">
    <ellipse cx="0" cy="20" rx="34" ry="18"/>
    <circle cx="-22" cy="0" r="14"/>
    <polygon points="-30,-12 -34,-28 -22,-10"/>
    <polygon points="-14,-12 -10,-28 -18,-10"/>
    <ellipse cx="28" cy="28" rx="10" ry="5" transform="rotate(20 28 28)"/>
    <circle cx="-26" cy="-2" r="1.6" fill="#1a1430"/>
    <path d="M-36 4 Q-48 10 -42 18" fill="none" stroke="#d7c4a0" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="820" y="450" text-anchor="middle" fill="#b9a482" font-family="Georgia, serif" font-size="12">International Cat Day</text>
  <text x="820" y="466" text-anchor="middle" fill="#8f7a5c" font-family="Georgia, serif" font-size="11">sneaks into the frame</text>

  <!-- title -->
  <text x="48" y="56" fill="#f0e6d0" font-family="Georgia, serif" font-size="34" font-weight="700">Not a Comet</text>
  <text x="50" y="86" fill="#a99b7d" font-family="Georgia, serif" font-size="16" letter-spacing="2">MESSIER'S CATALOG OF REFUSALS · 8 AUGUST</text>

  <!-- footer -->
  <text x="48" y="520" fill="#7a6d58" font-family="Georgia, serif" font-size="13">Cortex Dream Cycle · name what is not the visitor</text>
</svg>
