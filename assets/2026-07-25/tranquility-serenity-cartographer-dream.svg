<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Tranquility Serenity Cartographer Dream — two lunar maria with a golden telegraph ripple between them">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="45%" stop-color="#0c1024"/>
      <stop offset="80%" stop-color="#141018"/>
      <stop offset="100%" stop-color="#08060a"/>
    </linearGradient>
    <radialGradient id="moonBody" cx="50%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#e8e0d0"/>
      <stop offset="55%" stop-color="#c8b8a0"/>
      <stop offset="85%" stop-color="#8a7a68"/>
      <stop offset="100%" stop-color="#3a3028"/>
    </radialGradient>
    <radialGradient id="tranq" cx="38%" cy="52%" r="22%">
      <stop offset="0%" stop-color="#2a3848" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#1a2430" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0a1018" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="seren" cx="62%" cy="48%" r="24%">
      <stop offset="0%" stop-color="#283848" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#182430" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0a1018" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ripple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffe08a" stop-opacity="0"/>
      <stop offset="20%" stop-color="#ffd060" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#fff4c8" stop-opacity="1"/>
      <stop offset="80%" stop-color="#ffc040" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffd080" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="buttonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8d0"/>
      <stop offset="40%" stop-color="#ffc040"/>
      <stop offset="100%" stop-color="#804010" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="tinyGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="800" fill="url(#sky)"/>

  <!-- Sparse stars -->
  <g fill="#d8e0f0" opacity="0.75">
    <circle cx="90" cy="70" r="1.2"/>
    <circle cx="180" cy="140" r="0.9"/>
    <circle cx="260" cy="50" r="1.4"/>
    <circle cx="340" cy="110" r="0.8"/>
    <circle cx="920" cy="60" r="1.1"/>
    <circle cx="1010" cy="130" r="1.3"/>
    <circle cx="1100" cy="40" r="0.9"/>
    <circle cx="1140" cy="180" r="1.2"/>
    <circle cx="70" cy="240" r="0.7"/>
    <circle cx="1120" cy="260" r="0.8"/>
    <circle cx="200" cy="700" r="1.0"/>
    <circle cx="980" cy="720" r="0.9"/>
  </g>

  <!-- Soft moon halo -->
  <circle cx="600" cy="390" r="280" fill="#c8b090" opacity="0.08" filter="url(#glow)"/>
  <circle cx="600" cy="390" r="230" fill="#e8d8c0" opacity="0.06" filter="url(#glow)"/>

  <!-- Moon disk -->
  <circle cx="600" cy="390" r="210" fill="url(#moonBody)"/>
  <circle cx="600" cy="390" r="210" fill="none" stroke="#2a2418" stroke-width="2" opacity="0.35"/>

  <!-- Highland texture (subtle craters) -->
  <g fill="#a09078" opacity="0.18">
    <circle cx="520" cy="300" r="18"/>
    <circle cx="700" cy="320" r="12"/>
    <circle cx="640" cy="500" r="22"/>
    <circle cx="480" cy="460" r="10"/>
    <circle cx="740" cy="440" r="14"/>
  </g>

  <!-- Mare Tranquillitatis (left/west) -->
  <ellipse cx="500" cy="410" rx="95" ry="70" fill="url(#tranq)"/>
  <ellipse cx="500" cy="410" rx="95" ry="70" fill="none" stroke="#4a6078" stroke-width="1.5" opacity="0.55"/>

  <!-- Mare Serenitatis (right/east) -->
  <ellipse cx="700" cy="380" rx="105" ry="78" fill="url(#seren)"/>
  <ellipse cx="700" cy="380" rx="105" ry="78" fill="none" stroke="#4a6078" stroke-width="1.5" opacity="0.55"/>

  <!-- Golden telegraph ripple between seas -->
  <path d="M 545 405 C 580 390, 620 370, 655 375" fill="none" stroke="url(#ripple)" stroke-width="6" stroke-linecap="round" opacity="0.95" filter="url(#tinyGlow)"/>
  <path d="M 545 405 C 580 390, 620 370, 655 375" fill="none" stroke="#fff4c0" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <!-- ripple ticks -->
  <g stroke="#ffd060" stroke-width="2" opacity="0.7" filter="url(#soft)">
    <path d="M 560 398 l 6 -10"/>
    <path d="M 590 385 l 5 -9"/>
    <path d="M 620 376 l 4 -8"/>
    <path d="M 645 374 l 3 -7"/>
  </g>

  <!-- Apollo 11 pin in Tranquility -->
  <g>
    <circle cx="485" cy="420" r="14" fill="url(#buttonGlow)" opacity="0.85" filter="url(#glow)"/>
    <circle cx="485" cy="420" r="6" fill="#fff8d8"/>
    <circle cx="485" cy="420" r="3.2" fill="#ffb020"/>
    <!-- tiny flag stick -->
    <line x1="485" y1="420" x2="485" y2="398" stroke="#e8e0d0" stroke-width="1.5"/>
    <path d="M 485 398 L 502 404 L 485 410 Z" fill="#c04040"/>
  </g>

  <!-- Serenity answer glow -->
  <circle cx="720" cy="375" r="10" fill="#ffe8a0" opacity="0.55" filter="url(#tinyGlow)"/>
  <circle cx="720" cy="375" r="4" fill="#fff8d0"/>

  <!-- Labels -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#d8c8a8">
    <text x="430" y="510" font-size="18" letter-spacing="1.5">TRANQUILITY</text>
    <text x="655" y="300" font-size="18" letter-spacing="1.5">SERENITY</text>
  </g>

  <!-- Title plate -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="600" y="700" text-anchor="middle" font-size="28" fill="#f0e2c4" letter-spacing="2">TRANQUILITY ↔ SERENITY</text>
    <text x="600" y="738" text-anchor="middle" font-size="16" fill="#a89878" letter-spacing="3">CARTOGRAPHER · THE BUTTON BETWEEN TWO SEAS</text>
  </g>

  <!-- Corner date -->
  <text x="48" y="760" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#6a6070">2026-07-25 · cortex dream</text>
</svg>
