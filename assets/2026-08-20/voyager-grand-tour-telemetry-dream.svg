<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-label="Voyager Grand Tour telemetry dream: dual probes, four outer planets, golden record, long-haul radio beam">
  <defs>
    <linearGradient id="void" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="45%" stop-color="#0b1224"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="sun" cx="12%" cy="78%" r="28%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#b45309" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="jup" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="40%" stop-color="#d97706"/>
      <stop offset="75%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>
    <radialGradient id="sat" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="55%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="ura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="60%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </radialGradient>
    <radialGradient id="nep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="55%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </radialGradient>
    <linearGradient id="probe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0"/>
      <stop offset="25%" stop-color="#fbbf24" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="960" height="640" fill="url(#void)"/>
  <rect width="960" height="640" fill="url(#sun)"/>

  <!-- stars -->
  <g fill="#e2e8f0" opacity="0.85">
    <circle cx="80" cy="60" r="1.2"/><circle cx="140" cy="110" r="0.9"/><circle cx="220" cy="40" r="1.1"/>
    <circle cx="300" cy="90" r="0.8"/><circle cx="380" cy="30" r="1.3"/><circle cx="460" cy="70" r="0.7"/>
    <circle cx="540" cy="45" r="1"/><circle cx="620" cy="95" r="0.9"/><circle cx="700" cy="35" r="1.2"/>
    <circle cx="780" cy="80" r="0.8"/><circle cx="860" cy="50" r="1.1"/><circle cx="910" cy="120" r="0.7"/>
    <circle cx="60" cy="200" r="0.8"/><circle cx="180" cy="250" r="1"/><circle cx="250" cy="180" r="0.7"/>
    <circle cx="420" cy="210" r="0.9"/><circle cx="510" cy="160" r="0.8"/><circle cx="590" cy="230" r="1.1"/>
    <circle cx="680" cy="190" r="0.7"/><circle cx="760" cy="250" r="0.9"/><circle cx="840" cy="200" r="0.8"/>
    <circle cx="900" cy="280" r="1"/><circle cx="100" cy="320" r="0.7"/><circle cx="200" cy="380" r="0.9"/>
    <circle cx="330" cy="340" r="0.8"/><circle cx="450" cy="400" r="1"/><circle cx="560" cy="360" r="0.7"/>
    <circle cx="640" cy="420" r="0.9"/><circle cx="720" cy="370" r="0.8"/><circle cx="820" cy="430" r="1.1"/>
    <circle cx="880" cy="390" r="0.7"/><circle cx="70" cy="470" r="0.9"/><circle cx="150" cy="520" r="0.8"/>
    <circle cx="280" cy="490" r="1"/><circle cx="400" cy="540" r="0.7"/><circle cx="520" cy="500" r="0.9"/>
    <circle cx="610" cy="560" r="0.8"/><circle cx="740" cy="520" r="1"/><circle cx="860" cy="570" r="0.7"/>
  </g>

  <!-- Grand Tour path -->
  <path d="M140 470 C 260 390, 340 300, 420 250 S 560 170, 640 210 S 760 300, 820 250 S 880 160, 910 120"
        fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 7" opacity="0.75"/>
  <path d="M155 490 C 275 410, 355 320, 435 270 S 575 190, 655 230 S 775 320, 835 270 S 895 180, 925 140"
        fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 8" opacity="0.45"/>

  <!-- Planets -->
  <g filter="url(#glow)">
    <!-- Jupiter -->
    <circle cx="360" cy="285" r="42" fill="url(#jup)"/>
    <ellipse cx="360" cy="275" rx="38" ry="6" fill="#fbbf24" opacity="0.35"/>
    <ellipse cx="360" cy="295" rx="36" ry="5" fill="#78350f" opacity="0.35"/>
    <circle cx="375" cy="300" r="8" fill="#b45309" opacity="0.7"/>
    <!-- Saturn -->
    <ellipse cx="560" cy="195" rx="58" ry="12" fill="none" stroke="#fde68a" stroke-width="4" opacity="0.75"/>
    <ellipse cx="560" cy="195" rx="48" ry="9" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.55"/>
    <circle cx="560" cy="195" r="28" fill="url(#sat)"/>
    <!-- Uranus -->
    <circle cx="700" cy="275" r="22" fill="url(#ura)"/>
    <ellipse cx="700" cy="275" rx="34" ry="5" fill="none" stroke="#67e8f9" stroke-width="1.5" opacity="0.55" transform="rotate(-18 700 275)"/>
    <!-- Neptune -->
    <circle cx="820" cy="235" r="20" fill="url(#nep)"/>
    <circle cx="828" cy="230" r="5" fill="#1d4ed8" opacity="0.55"/>
  </g>

  <!-- dual probes -->
  <g id="voyager2" transform="translate(640,210)" filter="url(#glow)">
    <line x1="0" y1="0" x2="-38" y2="-34" stroke="#94a3b8" stroke-width="2"/>
    <line x1="0" y1="0" x2="36" y2="-28" stroke="#94a3b8" stroke-width="2"/>
    <line x1="0" y1="0" x2="8" y2="42" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="10" fill="url(#probe)"/>
    <rect x="-7" y="-7" width="14" height="14" rx="2" fill="#cbd5e1" opacity="0.9"/>
    <!-- golden record -->
    <circle cx="-16" cy="8" r="7" fill="url(#gold)" stroke="#fef08a" stroke-width="1"/>
    <circle cx="-16" cy="8" r="3.5" fill="none" stroke="#78350f" stroke-width="0.8" opacity="0.7"/>
    <!-- HGA dish -->
    <ellipse cx="18" cy="6" rx="14" ry="9" fill="none" stroke="#e2e8f0" stroke-width="2"/>
    <ellipse cx="18" cy="6" rx="8" ry="5" fill="#334155" opacity="0.55"/>
  </g>

  <g id="voyager1" transform="translate(455,255)" opacity="0.72" filter="url(#glow)">
    <line x1="0" y1="0" x2="-30" y2="-28" stroke="#94a3b8" stroke-width="1.6"/>
    <line x1="0" y1="0" x2="28" y2="-22" stroke="#94a3b8" stroke-width="1.6"/>
    <circle cx="0" cy="0" r="8" fill="url(#probe)"/>
    <circle cx="-12" cy="6" r="5" fill="url(#gold)"/>
    <ellipse cx="14" cy="5" rx="11" ry="7" fill="none" stroke="#cbd5e1" stroke-width="1.6"/>
  </g>

  <!-- long-haul telemetry beam home -->
  <path d="M655 218 C 520 280, 360 360, 170 480" fill="none" stroke="url(#beam)" stroke-width="6" opacity="0.9" filter="url(#soft)"/>
  <path d="M655 218 C 520 280, 360 360, 170 480" fill="none" stroke="#fde68a" stroke-width="1.4" opacity="0.85"/>

  <!-- Earth home station -->
  <g transform="translate(140,490)">
    <circle cx="0" cy="0" r="22" fill="#0ea5e9"/>
    <circle cx="-6" cy="-4" r="8" fill="#22c55e" opacity="0.75"/>
    <circle cx="7" cy="5" r="6" fill="#16a34a" opacity="0.65"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#7dd3fc" stroke-width="1.5" opacity="0.45"/>
    <text x="0" y="48" text-anchor="middle" fill="#94a3b8" font-family="Georgia, serif" font-size="13">Earth · still listening</text>
  </g>

  <!-- labels -->
  <g fill="#cbd5e1" font-family="Georgia, serif" font-size="13">
    <text x="360" y="345" text-anchor="middle" opacity="0.85">Jupiter</text>
    <text x="560" y="245" text-anchor="middle" opacity="0.85">Saturn</text>
    <text x="700" y="315" text-anchor="middle" opacity="0.85">Uranus</text>
    <text x="820" y="275" text-anchor="middle" opacity="0.85">Neptune</text>
  </g>

  <g fill="#f8fafc" font-family="Georgia, serif">
    <text x="48" y="52" font-size="28" font-weight="600">Voyager Grand Tour Telemetry</text>
    <text x="48" y="82" font-size="15" fill="#94a3b8">20 August 1977 · dual probes · four giants · still phoning home</text>
  </g>

  <g fill="#e2e8f0" font-family="Georgia, serif" font-size="14">
    <text x="48" y="580">After safe return: name the craft built for the tour that never comes home.</text>
    <text x="48" y="602" fill="#94a3b8">Gravity assists · golden record retention · long-haul pin · dual outbound telemetry</text>
  </g>
</svg>
