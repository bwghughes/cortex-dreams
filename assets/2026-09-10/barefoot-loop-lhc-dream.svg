<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Barefoot Loop LHC dream: left side bare feet on Roman stone, right side first proton beam circling a magnet ring, tracks joining into one September circuit">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1028"/>
      <stop offset="40%" stop-color="#241830"/>
      <stop offset="100%" stop-color="#0c0a12"/>
    </linearGradient>
    <linearGradient id="rome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4a882"/>
      <stop offset="100%" stop-color="#7a5a3a"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8b898"/>
      <stop offset="100%" stop-color="#a87858"/>
    </linearGradient>
    <linearGradient id="magnet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a6080"/>
      <stop offset="50%" stop-color="#2a3848"/>
      <stop offset="100%" stop-color="#141c28"/>
    </linearGradient>
    <radialGradient id="beamglow" cx="72%" cy="48%" r="28%">
      <stop offset="0%" stop-color="#60f0ff" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#3080c0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0c878" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#70e8ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a090ff" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="url(#sky)"/>
  <circle cx="860" cy="340" r="220" fill="url(#beamglow)"/>

  <!-- Roman stone road left -->
  <path d="M40 520 L420 480 L460 700 L20 700 Z" fill="url(#rome)" opacity="0.92"/>
  <g stroke="#5a4030" stroke-width="1.5" opacity="0.35">
    <path d="M70 560 L400 530"/>
    <path d="M90 600 L410 565"/>
    <path d="M110 640 L420 600"/>
    <path d="M60 530 L80 680"/>
    <path d="M160 520 L185 690"/>
    <path d="M280 505 L300 680"/>
    <path d="M380 490 L395 670"/>
  </g>

  <!-- Bare feet (left runner) -->
  <g fill="url(#skin)" stroke="#6a4030" stroke-width="2">
    <!-- left foot -->
    <ellipse cx="180" cy="560" rx="38" ry="18" transform="rotate(-18 180 560)"/>
    <ellipse cx="155" cy="548" rx="10" ry="14" transform="rotate(-30 155 548)"/>
    <ellipse cx="168" cy="542" rx="9" ry="13" transform="rotate(-20 168 542)"/>
    <ellipse cx="182" cy="540" rx="9" ry="12" transform="rotate(-8 182 540)"/>
    <ellipse cx="196" cy="544" rx="8" ry="11" transform="rotate(6 196 544)"/>
    <ellipse cx="208" cy="552" rx="7" ry="10" transform="rotate(18 208 552)"/>
    <!-- right foot mid-stride -->
    <ellipse cx="300" cy="530" rx="36" ry="16" transform="rotate(12 300 530)"/>
    <ellipse cx="278" cy="516" rx="9" ry="12" transform="rotate(-5 278 516)"/>
    <ellipse cx="292" cy="512" rx="8" ry="11"/>
    <ellipse cx="305" cy="512" rx="8" ry="11" transform="rotate(8 305 512)"/>
    <ellipse cx="318" cy="518" rx="7" ry="10" transform="rotate(16 318 518)"/>
    <ellipse cx="328" cy="526" rx="6" ry="9" transform="rotate(24 328 526)"/>
  </g>
  <!-- sole prints fading into particles -->
  <g fill="none" stroke="url(#track)" stroke-width="2" opacity="0.55">
    <path d="M220 590 Q280 575 340 555"/>
    <path d="M250 610 Q320 590 400 560"/>
    <path d="M280 630 Q360 605 460 560"/>
  </g>

  <!-- Particle tracks from feet toward ring -->
  <g fill="none" stroke="url(#track)" stroke-width="2.4" filter="url(#soft)">
    <path d="M330 520 C420 480 520 420 620 360"/>
    <path d="M310 545 C430 500 540 440 680 380"/>
    <path d="M290 570 C450 520 580 450 720 400"/>
  </g>
  <g fill="#90e8ff">
    <circle cx="420" cy="490" r="3.5"/>
    <circle cx="500" cy="445" r="3"/>
    <circle cx="560" cy="400" r="2.8"/>
    <circle cx="610" cy="370" r="3.2"/>
    <circle cx="650" cy="390" r="2.5"/>
    <circle cx="700" cy="360" r="3"/>
  </g>

  <!-- LHC ring -->
  <g transform="translate(860,340)">
    <circle r="160" fill="none" stroke="#3a4a5c" stroke-width="28"/>
    <circle r="160" fill="none" stroke="url(#magnet)" stroke-width="18"/>
    <!-- magnet segments -->
    <g stroke="#708090" stroke-width="3" fill="none">
      <path d="M0 -160 A160 160 0 0 1 113 -113"/>
      <path d="M113 -113 A160 160 0 0 1 160 0"/>
      <path d="M160 0 A160 160 0 0 1 113 113"/>
      <path d="M113 113 A160 160 0 0 1 0 160"/>
      <path d="M0 160 A160 160 0 0 1 -113 113"/>
      <path d="M-113 113 A160 160 0 0 1 -160 0"/>
      <path d="M-160 0 A160 160 0 0 1 -113 -113"/>
      <path d="M-113 -113 A160 160 0 0 1 0 -160"/>
    </g>
    <!-- first beam arc -->
    <circle r="160" fill="none" stroke="#70f0ff" stroke-width="4" stroke-dasharray="40 280" stroke-linecap="round" transform="rotate(-40)" opacity="0.95"/>
    <circle r="160" fill="none" stroke="#c0a0ff" stroke-width="2" stroke-dasharray="12 320" stroke-linecap="round" transform="rotate(80)" opacity="0.7"/>
    <!-- beam head -->
    <circle cx="122" cy="-103" r="8" fill="#e8ffff" opacity="0.95"/>
    <circle cx="122" cy="-103" r="16" fill="#60e0ff" opacity="0.25"/>
    <!-- inner vacuum suggestion -->
    <circle r="128" fill="none" stroke="#203040" stroke-width="2" opacity="0.6"/>
    <text x="0" y="8" text-anchor="middle" fill="#a8c0d8" font-family="Georgia, serif" font-size="18" opacity="0.85">first beam</text>
  </g>

  <!-- titles -->
  <text x="48" y="64" fill="#f0e6d4" font-family="Georgia, serif" font-size="34" font-weight="600">Barefoot Loop</text>
  <text x="48" y="102" fill="#b8a890" font-family="Georgia, serif" font-size="18">10 September · Bikila 1960 · LHC 2008</text>
  <text x="48" y="138" fill="#8090a8" font-family="ui-monospace, monospace" font-size="14">feet become particles · one circuit · two scales</text>

  <text x="48" y="680" fill="#908070" font-family="Georgia, serif" font-size="16" font-style="italic">after the moth is taped, close the ring barefoot</text>
  <text x="860" y="680" text-anchor="middle" fill="#708090" font-family="ui-monospace, monospace" font-size="13">cortex dream · 2026-09-10</text>
</svg>
