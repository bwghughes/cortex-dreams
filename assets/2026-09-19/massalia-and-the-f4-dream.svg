<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Massalia and the F-4 Dream</title>
  <desc id="desc">A calm asteroid keeps a quiet orbit while an F-4 interceptor fades its instruments as it approaches a bright object — proximity as the private-AI control problem.</desc>
  <defs>
    <radialGradient id="sky" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="55%" stop-color="#0b1224"/>
      <stop offset="100%" stop-color="#05080f"/>
    </radialGradient>
    <radialGradient id="objectGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6d0" stop-opacity="1"/>
      <stop offset="35%" stop-color="#ffd27a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbitRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7ec8ff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#9ad7ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7ec8ff" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="jetBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d7e2ef"/>
      <stop offset="55%" stop-color="#8fa3b8"/>
      <stop offset="100%" stop-color="#4a5b6d"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#dce8ff" opacity="0.75">
    <circle cx="90" cy="70" r="1.5"/>
    <circle cx="180" cy="120" r="1.2"/>
    <circle cx="260" cy="48" r="1.8"/>
    <circle cx="340" cy="160" r="1.1"/>
    <circle cx="470" cy="90" r="1.4"/>
    <circle cx="620" cy="40" r="1.6"/>
    <circle cx="760" cy="110" r="1.2"/>
    <circle cx="880" cy="60" r="1.5"/>
    <circle cx="980" cy="140" r="1.1"/>
    <circle cx="1080" cy="80" r="1.7"/>
    <circle cx="150" cy="260" r="1.2"/>
    <circle cx="310" cy="300" r="1.0"/>
    <circle cx="1040" cy="280" r="1.3"/>
    <circle cx="1120" cy="340" r="1.1"/>
  </g>

  <!-- Massalia orbit -->
  <ellipse cx="320" cy="360" rx="210" ry="120" fill="none" stroke="url(#orbitRing)" stroke-width="2" stroke-dasharray="6 10"/>
  <circle cx="320" cy="360" r="18" fill="#c9a36a" stroke="#f0d7a8" stroke-width="2" filter="url(#softGlow)"/>
  <circle cx="312" cy="352" r="4" fill="#8a6a3d" opacity="0.55"/>
  <circle cx="328" cy="366" r="3" fill="#6e5430" opacity="0.45"/>
  <text x="320" y="420" text-anchor="middle" fill="#b9d7ff" font-family="Georgia, serif" font-size="18" letter-spacing="1">MASSALIA</text>
  <text x="320" y="444" text-anchor="middle" fill="#7f97b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">keeps time at range</text>

  <!-- bright object -->
  <g transform="translate(860 250)" filter="url(#softGlow)">
    <circle r="90" fill="url(#objectGlow)"/>
    <circle r="22" fill="#fff8e8"/>
    <circle r="8" fill="#ffffff"/>
  </g>
  <text x="860" y="360" text-anchor="middle" fill="#ffd9a0" font-family="Georgia, serif" font-size="16" letter-spacing="1">THE LIGHT</text>

  <!-- 25 nm danger arc -->
  <path d="M 700 250 Q 780 320 860 360" fill="none" stroke="#ff6b5a" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.7"/>
  <text x="730" y="300" fill="#ff8f82" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">25 nm</text>

  <!-- F-4 silhouette approaching -->
  <g transform="translate(640 430) rotate(-18)" opacity="0.92">
    <path d="M0 0 L120 -8 L145 0 L120 8 Z" fill="url(#jetBody)"/>
    <path d="M40 -6 L70 -28 L78 -26 L55 -4 Z" fill="#9eb0c2"/>
    <path d="M40 6 L70 28 L78 26 L55 4 Z" fill="#6f8296"/>
    <path d="M18 -3 L28 -18 L34 -16 L24 -2 Z" fill="#a9bacb"/>
    <path d="M18 3 L28 18 L34 16 L24 2 Z" fill="#7a8fa3"/>
    <circle cx="95" cy="0" r="3" fill="#ff5a4a" opacity="0.85"/>
    <!-- dying instrument needles -->
    <g transform="translate(-30 -40)">
      <rect x="0" y="0" width="54" height="34" rx="4" fill="#101820" stroke="#4d5f72" stroke-width="1.5"/>
      <line x1="10" y1="17" x2="28" y2="8" stroke="#ff6b5a" stroke-width="2" opacity="0.35"/>
      <line x1="27" y1="17" x2="42" y2="24" stroke="#ff6b5a" stroke-width="2" opacity="0.2"/>
      <text x="27" y="48" text-anchor="middle" fill="#ff8f82" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">UHF / WPN / EJECT</text>
    </g>
  </g>
  <text x="640" y="510" text-anchor="middle" fill="#c7d6ea" font-family="Georgia, serif" font-size="18" letter-spacing="1">F-4</text>
  <text x="640" y="534" text-anchor="middle" fill="#7f97b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">instruments fail on approach</text>

  <!-- title block -->
  <g transform="translate(60 600)">
    <text x="0" y="0" fill="#e8f0ff" font-family="Georgia, serif" font-size="34">Massalia &amp; the F-4</text>
    <text x="0" y="34" fill="#9bb0cc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">calm orbit · interceptor blackout · name the range before you chase the light</text>
    <text x="0" y="62" fill="#6f86a6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Cortex Dream · 2026-09-19</text>
  </g>
</svg>
