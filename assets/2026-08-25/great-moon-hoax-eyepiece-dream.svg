<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Great Moon Hoax Eyepiece Dream</title>
  <desc id="desc">A brass-rimmed telescope eyepiece aimed at a moon that holds both printed bat-people fiction and real pale light; a newspaper stack sold every copy while a small reveal button keeps the instrument under your finger.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1c"/>
      <stop offset="45%" stop-color="#12182c"/>
      <stop offset="100%" stop-color="#1a1424"/>
    </linearGradient>
    <radialGradient id="moonCore" cx="48%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#f4efe4"/>
      <stop offset="40%" stop-color="#d8c8a8"/>
      <stop offset="75%" stop-color="#8a7a68"/>
      <stop offset="100%" stop-color="#3a3040"/>
    </radialGradient>
    <radialGradient id="eyepieceGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffe8b0" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#c09040" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#201008" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="printGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#a8c8ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0d090"/>
      <stop offset="45%" stop-color="#c09040"/>
      <stop offset="100%" stop-color="#6a4018"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2e8d4"/>
      <stop offset="100%" stop-color="#c8b898"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="tiny" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
    <clipPath id="lensClip">
      <circle cx="480" cy="275" r="118"/>
    </clipPath>
  </defs>

  <rect width="960" height="640" fill="url(#sky)"/>

  <!-- faint stars -->
  <g fill="#d8e0ff" opacity="0.5">
    <circle cx="70" cy="60" r="1.1"/>
    <circle cx="150" cy="110" r="0.8"/>
    <circle cx="230" cy="45" r="1.0"/>
    <circle cx="320" cy="90" r="0.7"/>
    <circle cx="700" cy="55" r="1.2"/>
    <circle cx="790" cy="100" r="0.8"/>
    <circle cx="870" cy="40" r="1.1"/>
    <circle cx="910" cy="150" r="0.7"/>
    <circle cx="50" cy="210" r="0.8"/>
    <circle cx="920" cy="260" r="0.9"/>
  </g>

  <!-- newspaper stack (printed sky) -->
  <g transform="translate(95,390)">
    <ellipse cx="90" cy="110" rx="110" ry="18" fill="#000" opacity="0.25"/>
    <rect x="10" y="20" width="160" height="100" rx="4" fill="url(#paper)" stroke="#8a7048" stroke-width="1.5" transform="rotate(-6 90 70)"/>
    <rect x="18" y="12" width="160" height="100" rx="4" fill="url(#paper)" stroke="#8a7048" stroke-width="1.5" transform="rotate(-2 98 62)"/>
    <rect x="26" y="4" width="160" height="100" rx="4" fill="url(#paper)" stroke="#8a7048" stroke-width="1.5"/>
    <text x="106" y="38" text-anchor="middle" fill="#5a4030" font-family="Georgia, serif" font-size="11" font-weight="700">THE SUN</text>
    <text x="106" y="56" text-anchor="middle" fill="#6a5040" font-family="Georgia, serif" font-size="9">GREAT ASTRONOMICAL</text>
    <text x="106" y="70" text-anchor="middle" fill="#6a5040" font-family="Georgia, serif" font-size="9">DISCOVERIES</text>
    <!-- tiny bat glyph on paper -->
    <g transform="translate(106,88)" fill="#4a3828" opacity="0.7">
      <ellipse cx="0" cy="0" rx="5" ry="3"/>
      <path d="M-5 0 Q-16 -10 -20 2 Q-12 0 -5 2 Z"/>
      <path d="M5 0 Q16 -10 20 2 Q12 0 5 2 Z"/>
    </g>
    <text x="106" y="130" text-anchor="middle" fill="#9a8870" font-family="Georgia, serif" font-size="12">sold every copy</text>
  </g>

  <!-- telescope body -->
  <g transform="translate(480,275)">
    <!-- outer brass rings -->
    <circle cx="0" cy="0" r="150" fill="none" stroke="url(#brass)" stroke-width="14"/>
    <circle cx="0" cy="0" r="138" fill="none" stroke="#2a2010" stroke-width="3"/>
    <circle cx="0" cy="0" r="132" fill="#0c101c" stroke="#d0a050" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="160" ry="28" fill="url(#eyepieceGlow)" filter="url(#soft)" opacity="0.55"/>
  </g>

  <!-- moon through eyepiece -->
  <g clip-path="url(#lensClip)">
    <circle cx="480" cy="275" r="118" fill="#080c18"/>
    <circle cx="480" cy="275" r="96" fill="url(#moonCore)"/>
    <!-- craters -->
    <circle cx="450" cy="250" r="14" fill="none" stroke="#6a6058" stroke-width="2" opacity="0.55"/>
    <circle cx="510" cy="290" r="10" fill="none" stroke="#6a6058" stroke-width="1.5" opacity="0.45"/>
    <circle cx="470" cy="310" r="7" fill="#5a5048" opacity="0.25"/>
    <!-- printed bats (hoax) swimming in the glass -->
    <g fill="#2a2030" opacity="0.55" filter="url(#tiny)">
      <g transform="translate(430,230)">
        <ellipse cx="0" cy="0" rx="7" ry="4"/>
        <path d="M-7 0 Q-18 -12 -24 2 Q-14 0 -7 3 Z"/>
        <path d="M7 0 Q18 -12 24 2 Q14 0 7 3 Z"/>
      </g>
      <g transform="translate(520,240)">
        <ellipse cx="0" cy="0" rx="6" ry="3.5"/>
        <path d="M-6 0 Q-15 -10 -20 2 Q-12 0 -6 2.5 Z"/>
        <path d="M6 0 Q15 -10 20 2 Q12 0 6 2.5 Z"/>
      </g>
      <g transform="translate(455,300) scale(0.8)">
        <ellipse cx="0" cy="0" rx="6" ry="3.5"/>
        <path d="M-6 0 Q-15 -10 -20 2 Q-12 0 -6 2.5 Z"/>
        <path d="M6 0 Q15 -10 20 2 Q12 0 6 2.5 Z"/>
      </g>
    </g>
    <!-- tiny temple silhouette -->
    <g transform="translate(505,255)" fill="#3a3040" opacity="0.5">
      <rect x="-8" y="-4" width="16" height="10"/>
      <polygon points="-10,-4 0,-14 10,-4"/>
      <rect x="-2" y="-18" width="4" height="6"/>
    </g>
    <!-- unicorn silhouettes -->
    <g fill="#4a4050" opacity="0.4">
      <ellipse cx="440" cy="275" rx="9" ry="5"/>
      <line x1="448" y1="270" x2="456" y2="262" stroke="#4a4050" stroke-width="1.5"/>
      <ellipse cx="535" cy="305" rx="8" ry="4.5"/>
      <line x1="542" y1="301" x2="550" y2="294" stroke="#4a4050" stroke-width="1.4"/>
    </g>
  </g>

  <!-- brass rim highlight -->
  <circle cx="480" cy="275" r="118" fill="none" stroke="#f0d090" stroke-width="3" opacity="0.85"/>
  <circle cx="480" cy="275" r="124" fill="none" stroke="#6a4018" stroke-width="2" opacity="0.6"/>

  <!-- real sky whisper (Voyager / Neptune) -->
  <g opacity="0.7">
    <circle cx="780" cy="180" r="18" fill="#4a6a9a" opacity="0.55"/>
    <circle cx="780" cy="180" r="28" fill="none" stroke="#7a9ac8" stroke-width="1.5" opacity="0.5" stroke-dasharray="3 4"/>
    <text x="780" y="220" text-anchor="middle" fill="#8aa0c0" font-family="Georgia, serif" font-size="12">Neptune 1989</text>
    <text x="780" y="236" text-anchor="middle" fill="#6a7898" font-family="Georgia, serif" font-size="10">real glass, last planet then</text>
  </g>

  <!-- reveal button -->
  <g transform="translate(480,500)">
    <ellipse cx="0" cy="0" rx="58" ry="24" fill="url(#eyepieceGlow)" filter="url(#soft)"/>
    <rect x="-52" y="-16" width="104" height="32" rx="16" fill="#2a1810" stroke="#e0b060" stroke-width="2"/>
    <circle cx="0" cy="0" r="10" fill="#f0c060" stroke="#fff0c0" stroke-width="1.5"/>
    <text x="0" y="42" text-anchor="middle" fill="#d8c8a0" font-family="Georgia, serif" font-size="13">reveal</text>
  </g>

  <!-- Caption -->
  <text x="480" y="58" text-anchor="middle" fill="#e8e0f0" font-family="Georgia, serif" font-size="22">Great Moon Hoax Eyepiece</text>
  <text x="480" y="84" text-anchor="middle" fill="#9a90b0" font-family="Georgia, serif" font-size="14">25 August 1835 · printed bats · owned glass · belief is cheap</text>

  <!-- Footer -->
  <text x="480" y="600" text-anchor="middle" fill="#6a6880" font-family="Georgia, serif" font-size="12">the form looked trustworthy · the cure is the instrument under your finger</text>
</svg>
