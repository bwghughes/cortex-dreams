<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc" width="1200" height="700">
  <title id="title">Ghost Platform Control Plane</title>
  <desc id="desc">A night railway platform with rails, a policy switchboard, and an ember light.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070817"/>
      <stop offset="0.55" stop-color="#101936"/>
      <stop offset="1" stop-color="#061012"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ff7d0" stop-opacity="0.1"/>
      <stop offset="0.5" stop-color="#e9f7ff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffbf66" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="700" fill="url(#sky)"/>
  <g opacity="0.45">
    <circle cx="112" cy="95" r="2" fill="#d9f7ff"/>
    <circle cx="280" cy="58" r="1.6" fill="#d9f7ff"/>
    <circle cx="522" cy="122" r="1.8" fill="#d9f7ff"/>
    <circle cx="787" cy="75" r="1.5" fill="#d9f7ff"/>
    <circle cx="1042" cy="142" r="2" fill="#d9f7ff"/>
  </g>
  <g transform="translate(70 210)">
    <polygon points="0,310 780,205 1060,310 250,420" fill="#10151d" stroke="#2b3c4b" stroke-width="3"/>
    <line x1="80" y1="360" x2="755" y2="230" stroke="url(#rail)" stroke-width="10" filter="url(#glow)"/>
    <line x1="225" y1="398" x2="830" y2="238" stroke="url(#rail)" stroke-width="8" filter="url(#glow)"/>
    <g stroke="#283543" stroke-width="4" opacity="0.85">
      <line x1="175" y1="345" x2="260" y2="382"/>
      <line x1="310" y1="320" x2="398" y2="358"/>
      <line x1="455" y1="291" x2="548" y2="331"/>
      <line x1="610" y1="263" x2="708" y2="305"/>
    </g>
    <rect x="126" y="110" width="480" height="78" rx="10" fill="#111827" stroke="#6cf1d0" stroke-width="3" filter="url(#glow)"/>
    <text x="155" y="160" fill="#dffcff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="32">Matsuhidai / Dispatch</text>
    <path d="M0 210 H650" stroke="#24334d" stroke-width="10"/>
    <g fill="#172338" stroke="#5c7899" stroke-width="3">
      <rect x="705" y="10" width="285" height="230" rx="18"/>
      <rect x="735" y="44" width="225" height="42" rx="8" fill="#071018"/>
      <rect x="735" y="104" width="225" height="42" rx="8" fill="#071018"/>
      <rect x="735" y="164" width="225" height="42" rx="8" fill="#071018"/>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#c8ffe9">
      <text x="753" y="73">local: allow</text>
      <text x="753" y="133">cloud: attest</text>
      <text x="753" y="193">fog: ask human</text>
    </g>
    <g filter="url(#glow)">
      <circle cx="930" cy="54" r="10" fill="#63ffc8"/>
      <circle cx="925" cy="114" r="10" fill="#ffd166"/>
      <circle cx="924" cy="174" r="10" fill="#ff6b6b"/>
      <circle cx="635" cy="292" r="13" fill="#ffbf66"/>
    </g>
  </g>
  <text x="80" y="620" fill="#f7eed7" font-family="Georgia, serif" font-size="34">private AI needs a dispatcher, not a throne</text>
  <text x="82" y="654" fill="#8eb9c6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">cortex-dream-cycle-2026-07-04-ghost-platform-control-plane</text>
</svg>
