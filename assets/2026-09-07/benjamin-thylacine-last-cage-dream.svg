<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Benjamin thylacine last cage dream: striped marsupial wolf alone in a sunlit zoo cage, keepers gone, electronic eye watching from outside">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1208"/>
      <stop offset="40%" stop-color="#5a3a18"/>
      <stop offset="70%" stop-color="#c4782a"/>
      <stop offset="100%" stop-color="#2a180c"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe8a0" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#ff9a30" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c45810" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a6a6a"/>
      <stop offset="50%" stop-color="#3a3a3a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4a878"/>
      <stop offset="55%" stop-color="#8a6a40"/>
      <stop offset="100%" stop-color="#4a3418"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1c10"/>
      <stop offset="100%" stop-color="#0a0804"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a5a48"/>
      <stop offset="100%" stop-color="#2a2018"/>
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe8a0" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ff6a20" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="720" fill="url(#sky)"/>
  <!-- sun left on -->
  <circle cx="980" cy="120" r="160" fill="url(#sun)" filter="url(#glow)"/>
  <circle cx="980" cy="120" r="48" fill="#ffe8b0" opacity="0.95"/>

  <!-- distant island ghost (what was lost) -->
  <ellipse cx="180" cy="210" rx="90" ry="28" fill="#1a2a18" opacity="0.35"/>
  <path d="M110 210 Q140 150 180 175 Q220 145 250 210 Z" fill="#243828" opacity="0.4"/>
  <text x="180" y="250" text-anchor="middle" fill="#a8c090" font-family="Georgia, serif" font-size="14" opacity="0.55">island that was</text>

  <!-- concrete floor -->
  <rect x="260" y="480" width="680" height="160" fill="url(#floor)" rx="4"/>
  <g stroke="#1a1410" stroke-width="1" opacity="0.25">
    <line x1="260" y1="520" x2="940" y2="520"/>
    <line x1="260" y1="560" x2="940" y2="560"/>
    <line x1="260" y1="600" x2="940" y2="600"/>
    <line x1="340" y1="480" x2="340" y2="640"/>
    <line x1="420" y1="480" x2="420" y2="640"/>
    <line x1="500" y1="480" x2="500" y2="640"/>
    <line x1="580" y1="480" x2="580" y2="640"/>
    <line x1="660" y1="480" x2="660" y2="640"/>
    <line x1="740" y1="480" x2="740" y2="640"/>
    <line x1="820" y1="480" x2="820" y2="640"/>
    <line x1="900" y1="480" x2="900" y2="640"/>
  </g>
  <text x="600" y="670" text-anchor="middle" fill="#8a7a68" font-family="Georgia, serif" font-size="13" opacity="0.7">12 metres of concrete</text>

  <!-- cage frame -->
  <rect x="280" y="160" width="640" height="360" fill="none" stroke="url(#cage)" stroke-width="14" rx="6"/>
  <rect x="280" y="160" width="640" height="360" fill="#0a0a0a" opacity="0.15"/>
  <!-- bars -->
  <g stroke="#2a2a2a" stroke-width="10" opacity="0.92">
    <line x1="340" y1="168" x2="340" y2="512"/>
    <line x1="400" y1="168" x2="400" y2="512"/>
    <line x1="460" y1="168" x2="460" y2="512"/>
    <line x1="520" y1="168" x2="520" y2="512"/>
    <line x1="580" y1="168" x2="580" y2="512"/>
    <line x1="640" y1="168" x2="640" y2="512"/>
    <line x1="700" y1="168" x2="700" y2="512"/>
    <line x1="760" y1="168" x2="760" y2="512"/>
    <line x1="820" y1="168" x2="820" y2="512"/>
    <line x1="880" y1="168" x2="880" y2="512"/>
  </g>
  <!-- top/bottom rail highlight -->
  <rect x="280" y="160" width="640" height="18" fill="#8a8a8a" opacity="0.35"/>
  <rect x="280" y="502" width="640" height="18" fill="#4a4a4a" opacity="0.5"/>

  <!-- thylacine body -->
  <g filter="url(#soft)">
    <!-- body -->
    <ellipse cx="600" cy="400" rx="150" ry="55" fill="url(#fur)"/>
    <!-- hind -->
    <ellipse cx="720" cy="410" rx="55" ry="48" fill="#7a5a30"/>
    <!-- neck/head -->
    <ellipse cx="470" cy="370" rx="70" ry="42" fill="url(#fur)"/>
    <ellipse cx="430" cy="355" rx="48" ry="36" fill="#b09060"/>
    <!-- snout -->
    <ellipse cx="390" cy="360" rx="28" ry="18" fill="#9a7850"/>
    <!-- ear -->
    <path d="M455 325 L470 290 L490 330 Z" fill="#6a4a28"/>
    <path d="M430 328 L440 298 L458 332 Z" fill="#8a6a40"/>
    <!-- eye -->
    <circle cx="420" cy="348" r="7" fill="#1a1008"/>
    <circle cx="422" cy="346" r="2.5" fill="#ffe8a0"/>
    <!-- jaw open 120 suggestion -->
    <path d="M370 365 Q385 390 410 375" fill="none" stroke="#3a2810" stroke-width="3" stroke-linecap="round"/>
    <path d="M375 368 Q390 395 415 378" fill="none" stroke="#2a1c0c" stroke-width="2" opacity="0.7"/>
    <!-- legs -->
    <path d="M520 440 L510 500 L535 500 L540 445 Z" fill="#5a4020"/>
    <path d="M580 445 L575 505 L600 505 L605 448 Z" fill="#6a4a28"/>
    <path d="M650 445 L660 505 L685 505 L675 448 Z" fill="#5a4020"/>
    <path d="M710 430 L730 500 L755 498 L735 428 Z" fill="#6a4a28"/>
    <!-- tail -->
    <path d="M760 400 Q820 380 860 420 Q880 440 870 450 Q840 430 800 420 Q770 415 760 410 Z" fill="#7a5a30"/>
    <!-- stripes -->
    <g fill="url(#stripe)" opacity="0.85">
      <path d="M560 370 Q570 400 565 430 Q555 400 560 370 Z"/>
      <path d="M590 365 Q602 400 595 435 Q585 400 590 365 Z"/>
      <path d="M620 368 Q632 402 625 432 Q615 400 620 368 Z"/>
      <path d="M650 372 Q662 405 655 430 Q645 400 650 372 Z"/>
      <path d="M680 378 Q692 408 685 428 Q675 405 680 378 Z"/>
      <path d="M545 375 Q552 395 548 415 Q540 395 545 375 Z"/>
    </g>
  </g>

  <!-- sun beams through bars (exposure) -->
  <g stroke="#ffc060" stroke-width="2" opacity="0.22">
    <line x1="900" y1="140" x2="500" y2="480"/>
    <line x1="940" y1="150" x2="560" y2="500"/>
    <line x1="980" y1="160" x2="620" y2="510"/>
    <line x1="1020" y1="180" x2="700" y2="500"/>
  </g>
  <text x="980" y="290" text-anchor="middle" fill="#ffd080" font-family="Georgia, serif" font-size="15" opacity="0.75">sun left on</text>

  <!-- electronic eye outside (Farnsworth twin) -->
  <g transform="translate(1040,480)">
    <rect x="-40" y="-30" width="80" height="60" rx="8" fill="#1a2430" stroke="#4a6a80" stroke-width="3"/>
    <circle cx="0" cy="0" r="18" fill="#0a1018" stroke="#6a90a8" stroke-width="2"/>
    <circle cx="0" cy="0" r="10" fill="url(#eyeGlow)"/>
    <circle cx="0" cy="0" r="4" fill="#a8e0ff"/>
    <text x="0" y="48" text-anchor="middle" fill="#7a9ab0" font-family="Georgia, serif" font-size="12">the other eye</text>
  </g>

  <!-- title block -->
  <text x="600" y="50" text-anchor="middle" fill="#f0e0c0" font-family="Georgia, serif" font-size="28" font-weight="bold">Benjamin · Last Cage</text>
  <text x="600" y="82" text-anchor="middle" fill="#c4a878" font-family="Georgia, serif" font-size="16">7 September 1936 — last of kind, keepers gone, sun still burning</text>
  <text x="600" y="110" text-anchor="middle" fill="#a89070" font-family="Georgia, serif" font-size="13" opacity="0.8">after one keel comes home · name the last living pin before the cage kills it</text>

  <!-- corner labels -->
  <text x="40" y="700" fill="#8a7060" font-family="Georgia, serif" font-size="12" opacity="0.6">cortex dream · 2026-09-07</text>
  <text x="1160" y="700" text-anchor="end" fill="#8a7060" font-family="Georgia, serif" font-size="12" opacity="0.6">shade the specimen</text>
</svg>
