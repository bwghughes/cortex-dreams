<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-label="Helium line spectroscope dream: dual observers, solar corona, rogue yellow line at 587.6 nm">
  <defs>
    <radialGradient id="sunCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6c8"/>
      <stop offset="35%" stop-color="#ffd36a"/>
      <stop offset="70%" stop-color="#ff9a2e"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>
    <radialGradient id="coronaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9a8" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0b1220" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071018"/>
      <stop offset="55%" stop-color="#12233a"/>
      <stop offset="100%" stop-color="#1b334f"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="18%" stop-color="#22d3ee"/>
      <stop offset="36%" stop-color="#4ade80"/>
      <stop offset="52%" stop-color="#facc15"/>
      <stop offset="58%" stop-color="#fde68a"/>
      <stop offset="64%" stop-color="#f59e0b"/>
      <stop offset="78%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- night sky -->
  <rect width="960" height="640" fill="url(#sky)"/>
  <g fill="#dbeafe" opacity="0.55">
    <circle cx="80" cy="70" r="1.4"/>
    <circle cx="140" cy="120" r="1.1"/>
    <circle cx="220" cy="48" r="1.3"/>
    <circle cx="310" cy="95" r="1.0"/>
    <circle cx="860" cy="64" r="1.5"/>
    <circle cx="900" cy="130" r="1.1"/>
    <circle cx="780" cy="40" r="1.2"/>
    <circle cx="700" cy="88" r="1.0"/>
    <circle cx="40" cy="200" r="1.0"/>
    <circle cx="920" cy="220" r="1.2"/>
  </g>

  <!-- dual continents suggestion -->
  <path d="M70 520 C120 470, 180 490, 230 530 C190 560, 120 560, 70 520 Z" fill="#0f2740" opacity="0.85"/>
  <path d="M730 505 C790 460, 860 475, 910 525 C860 565, 780 555, 730 505 Z" fill="#0f2740" opacity="0.85"/>
  <text x="120" y="575" fill="#93c5fd" font-family="Georgia, serif" font-size="14" opacity="0.85">Janssen · India</text>
  <text x="780" y="575" fill="#93c5fd" font-family="Georgia, serif" font-size="14" opacity="0.85" text-anchor="middle">Lockyer · England</text>

  <!-- corona + sun -->
  <circle cx="480" cy="250" r="170" fill="url(#coronaGlow)" filter="url(#soft)"/>
  <g opacity="0.55" stroke="#fde68a" stroke-width="2" fill="none">
    <path d="M480 90 C520 140, 560 150, 610 120"/>
    <path d="M480 90 C440 140, 400 150, 350 120"/>
    <path d="M320 250 C360 230, 380 210, 360 160"/>
    <path d="M640 250 C600 230, 580 210, 600 160"/>
    <path d="M360 360 C400 320, 430 330, 450 380"/>
    <path d="M600 360 C560 320, 530 330, 510 380"/>
  </g>
  <circle cx="480" cy="250" r="78" fill="url(#sunCore)" filter="url(#glow)"/>
  <circle cx="480" cy="250" r="78" fill="none" stroke="#fff7d6" stroke-width="2" opacity="0.5"/>

  <!-- dual spectroscopes as small telescopes -->
  <g transform="translate(160 430)">
    <rect x="0" y="0" width="86" height="18" rx="4" fill="#334155" stroke="#94a3b8"/>
    <polygon points="86,2 118,9 86,16" fill="#64748b"/>
    <circle cx="-6" cy="9" r="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <line x1="40" y1="-24" x2="120" y2="-90" stroke="#fde68a" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.8"/>
  </g>
  <g transform="translate(720 430)">
    <rect x="0" y="0" width="86" height="18" rx="4" fill="#334155" stroke="#94a3b8"/>
    <polygon points="0,2 -32,9 0,16" fill="#64748b"/>
    <circle cx="92" cy="9" r="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <line x1="40" y1="-24" x2="-40" y2="-90" stroke="#fde68a" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.8"/>
  </g>

  <!-- spectrum bar -->
  <rect x="140" y="430" width="680" height="36" rx="8" fill="url(#spectrum)" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- known sodium pair suggestion -->
  <rect x="470" y="430" width="3" height="36" fill="#0f172a" opacity="0.55"/>
  <rect x="478" y="430" width="3" height="36" fill="#0f172a" opacity="0.45"/>
  <!-- rogue helium D3 -->
  <rect x="512" y="422" width="6" height="52" rx="2" fill="#fef08a" filter="url(#glow)"/>
  <rect x="512" y="422" width="6" height="52" rx="2" fill="#facc15" opacity="0.95"/>

  <!-- callouts -->
  <g font-family="Georgia, serif" fill="#f8fafc">
    <text x="480" y="48" text-anchor="middle" font-size="28" letter-spacing="0.5">Helium Line Spectroscope</text>
    <text x="480" y="78" text-anchor="middle" font-size="15" fill="#93c5fd">18 August 1868 · two continents · one yellow refusal</text>
    <text x="525" y="410" font-size="13" fill="#fde68a">D3 · 587.6 nm · matches nothing on Earth</text>
    <text x="480" y="500" text-anchor="middle" font-size="16" fill="#e2e8f0">Name the line. Bottle later.</text>
    <text x="480" y="528" text-anchor="middle" font-size="13" fill="#94a3b8">MLX 0.32.1 · Ollama 0.32.14 · Open WebUI force-upgrade · Screen Sharing corona</text>
  </g>
</svg>
