<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Verda Stelo Switchboard Dream — green Esperanto star pulling rival greetings into one shared tongue">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#030508"/>
      <stop offset="40%" stop-color="#0a1220"/>
      <stop offset="75%" stop-color="#10181c"/>
      <stop offset="100%" stop-color="#060a0c"/>
    </linearGradient>
    <radialGradient id="starCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8ffc8"/>
      <stop offset="35%" stop-color="#7dff4a"/>
      <stop offset="70%" stop-color="#2f9e28"/>
      <stop offset="100%" stop-color="#0a3a12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8ff70" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#3cb832" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0a2810" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wireA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ec8ff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#7ec8ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7dff4a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="wireB" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffc070" stop-opacity="0"/>
      <stop offset="40%" stop-color="#ffc070" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7dff4a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="wireC" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#d0a0ff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#d0a0ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7dff4a" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="tinyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- babel night -->
  <rect width="1200" height="800" fill="url(#sky)"/>

  <!-- faint constellation dust -->
  <g fill="#c8d8ff" opacity="0.55">
    <circle cx="90" cy="70" r="1.2"/>
    <circle cx="180" cy="140" r="0.9"/>
    <circle cx="260" cy="55" r="1.4"/>
    <circle cx="340" cy="190" r="0.8"/>
    <circle cx="980" cy="90" r="1.1"/>
    <circle cx="1080" cy="160" r="1.3"/>
    <circle cx="920" cy="220" r="0.7"/>
    <circle cx="150" cy="680" r="1.0"/>
    <circle cx="1050" cy="700" r="1.2"/>
    <circle cx="700" cy="60" r="0.8"/>
    <circle cx="520" cy="740" r="1.0"/>
    <circle cx="430" cy="90" r="0.7"/>
  </g>

  <!-- switchboard wires into the star -->
  <g stroke-width="1.6" fill="none" opacity="0.9">
    <path d="M140 180 C 280 220, 380 300, 600 400" stroke="url(#wireA)" filter="url(#soft)"/>
    <path d="M160 520 C 300 480, 420 430, 600 400" stroke="url(#wireA)" filter="url(#soft)"/>
    <path d="M1060 170 C 920 230, 780 310, 600 400" stroke="url(#wireB)" filter="url(#soft)"/>
    <path d="M1080 560 C 930 500, 760 430, 600 400" stroke="url(#wireB)" filter="url(#soft)"/>
    <path d="M600 120 C 600 220, 600 300, 600 400" stroke="url(#wireC)" filter="url(#soft)"/>
    <path d="M280 700 C 380 600, 480 480, 600 400" stroke="url(#wireA)" opacity="0.7" filter="url(#soft)"/>
    <path d="M920 720 C 820 600, 700 480, 600 400" stroke="url(#wireB)" opacity="0.7" filter="url(#soft)"/>
  </g>

  <!-- outer glow -->
  <circle cx="600" cy="400" r="210" fill="url(#starGlow)" filter="url(#glow)" opacity="0.85"/>
  <circle cx="600" cy="400" r="150" fill="url(#starCore)" opacity="0.55"/>

  <!-- la verda stelo (5-point) -->
  <g transform="translate(600 400)" filter="url(#tinyGlow)">
    <polygon points="0,-110 31,-34 112,-34 47,14 72,95 0,45 -72,95 -47,14 -112,-34 -31,-34"
             fill="#6fe84a" stroke="#d8ffb0" stroke-width="3" opacity="0.98"/>
    <polygon points="0,-70 20,-22 72,-22 30,9 46,60 0,28 -46,60 -30,9 -72,-22 -20,-22"
             fill="#c8ff90" opacity="0.55"/>
    <circle cx="0" cy="0" r="18" fill="#f4ffe0" opacity="0.9"/>
  </g>

  <!-- rival greetings drifting in -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#d7e6ff" opacity="0.88">
    <text x="95" y="170">hello</text>
    <text x="95" y="510">你好</text>
    <text x="1000" y="160">shalom</text>
    <text x="1000" y="555">jambo</text>
    <text x="560" y="100">hola</text>
    <text x="250" y="720">bonjour</text>
    <text x="880" y="735">namaste</text>
  </g>

  <!-- shared tongue pulled to the star -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#b8ff8a" font-weight="bold">
    <text x="600" y="560" text-anchor="middle" opacity="0.95">Saluton</text>
    <text x="600" y="600" text-anchor="middle" font-size="20" fill="#8fdc6a" opacity="0.9">Paco · Homaro · Espero</text>
  </g>

  <!-- title plate -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#e8f0ff">
    <text x="60" y="50" font-size="28" opacity="0.95">Verda Stelo Switchboard Dream</text>
    <text x="60" y="82" font-size="16" fill="#8fb89a" opacity="0.9">constructed handshake · shared protocol · green-star translation</text>
  </g>

  <text x="1140" y="770" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#6a8070" opacity="0.85">2026-07-26 · Esperanto Day</text>
</svg>
