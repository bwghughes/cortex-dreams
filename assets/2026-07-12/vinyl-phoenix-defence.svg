<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" width="960" height="540">
  <title id="title">Vinyl Phoenix Defence</title>
  <desc id="desc">A crate of vinyl at second base becomes a neon phoenix over a defence-trust boundary map.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#1a1030"/>
      <stop offset="100%" stop-color="#2a0f1f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#ff4d8d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0b1020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7cf7ff"/>
      <stop offset="50%" stop-color="#ff6ad5"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#sky)"/>
  <circle cx="480" cy="220" r="220" fill="url(#glow)"/>

  <!-- diamond / second base -->
  <g opacity="0.9">
    <path d="M480 430 L620 360 L480 290 L340 360 Z" fill="none" stroke="#7cf7ff" stroke-width="2" opacity="0.55"/>
    <rect x="456" y="348" width="48" height="24" rx="3" fill="#d7e3ff" opacity="0.85"/>
    <text x="480" y="365" text-anchor="middle" font-family="Menlo, monospace" font-size="10" fill="#0b1020">2B</text>
  </g>

  <!-- crate -->
  <g transform="translate(410,300)">
    <rect x="0" y="20" width="140" height="70" rx="4" fill="#3a2418" stroke="#ffb347" stroke-width="2"/>
    <path d="M0 30 L70 0 L140 30" fill="#5a3824" stroke="#ffb347" stroke-width="2"/>
    <line x1="10" y1="45" x2="130" y2="45" stroke="#ff6ad5" stroke-width="1" opacity="0.6"/>
    <line x1="10" y1="58" x2="130" y2="58" stroke="#7cf7ff" stroke-width="1" opacity="0.5"/>
    <line x1="10" y1="71" x2="130" y2="71" stroke="#ffd166" stroke-width="1" opacity="0.5"/>
    <!-- vinyl discs -->
    <circle cx="35" cy="18" r="14" fill="#111" stroke="#ff6ad5" stroke-width="2"/>
    <circle cx="35" cy="18" r="3" fill="#ffd166"/>
    <circle cx="70" cy="10" r="14" fill="#111" stroke="#7cf7ff" stroke-width="2"/>
    <circle cx="70" cy="10" r="3" fill="#ffd166"/>
    <circle cx="105" cy="18" r="14" fill="#111" stroke="#ffb347" stroke-width="2"/>
    <circle cx="105" cy="18" r="3" fill="#ffd166"/>
  </g>

  <!-- phoenix -->
  <g transform="translate(480,190)">
    <path d="M0 40 C -40 10, -120 -10, -170 -40 C -120 -20, -70 -30, -20 -10 C -50 -50, -30 -100, 0 -130 C 30 -100, 50 -50, 20 -10 C 70 -30, 120 -20, 170 -40 C 120 -10, 40 10, 0 40 Z"
          fill="url(#wing)" opacity="0.9" filter="url(#soft)"/>
    <path d="M0 40 C -40 10, -120 -10, -170 -40 C -120 -20, -70 -30, -20 -10 C -50 -50, -30 -100, 0 -130 C 30 -100, 50 -50, 20 -10 C 70 -30, 120 -20, 170 -40 C 120 -10, 40 10, 0 40 Z"
          fill="none" stroke="#fff6" stroke-width="1.5"/>
    <ellipse cx="0" cy="-20" rx="18" ry="28" fill="#fff8e7"/>
    <circle cx="0" cy="-55" r="12" fill="#fff8e7"/>
    <path d="M0 -67 L8 -82 L0 -76 L-8 -82 Z" fill="#ff6ad5"/>
    <circle cx="-4" cy="-57" r="2" fill="#0b1020"/>
    <circle cx="4" cy="-57" r="2" fill="#0b1020"/>
    <!-- groove glyphs -->
    <text x="-150" y="-55" font-family="Menlo, monospace" font-size="11" fill="#7cf7ff">RIOT → RITUAL</text>
    <text x="70" y="-55" font-family="Menlo, monospace" font-size="11" fill="#ffd166">SCALE → CUSTODY</text>
  </g>

  <!-- scoreboard / slogans -->
  <g>
    <rect x="40" y="36" width="300" height="86" rx="8" fill="#10182c" stroke="#7cf7ff" stroke-width="1.5" opacity="0.92"/>
    <text x="58" y="64" font-family="Menlo, monospace" font-size="14" fill="#7cf7ff">CORTEX DREAM · 2026-07-12</text>
    <text x="58" y="88" font-family="Georgia, serif" font-size="18" fill="#fff6e8">Vinyl Phoenix Defence</text>
    <text x="58" y="108" font-family="Menlo, monospace" font-size="12" fill="#ff6ad5">demolition is a violent edit</text>
  </g>

  <g>
    <rect x="620" y="36" width="300" height="86" rx="8" fill="#10182c" stroke="#ffb347" stroke-width="1.5" opacity="0.92"/>
    <text x="638" y="64" font-family="Menlo, monospace" font-size="14" fill="#ffb347">HOME TEAM WIRED</text>
    <text x="638" y="88" font-family="Georgia, serif" font-size="18" fill="#fff6e8">Mentor360 arena</text>
    <text x="638" y="108" font-family="Menlo, monospace" font-size="12" fill="#7cf7ff">don’t fight in the crate</text>
  </g>

  <!-- bottom boundary strip -->
  <rect x="0" y="480" width="960" height="60" fill="#070b16" opacity="0.9"/>
  <text x="40" y="515" font-family="Menlo, monospace" font-size="13" fill="#d7e3ff">private chat path  ·  anonymised org insight  ·  private deploy  ·  CE+/ISO evidence  ·  service-language fit</text>
</svg>
