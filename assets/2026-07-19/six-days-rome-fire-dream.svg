<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-label="Six Days Rome Fire Dream — six nights of distributed flame over a city skyline, ghost fiddle silhouette">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0614"/>
      <stop offset="55%" stop-color="#1a0a18"/>
      <stop offset="100%" stop-color="#3a140c"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ff6a1a"/>
      <stop offset="45%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#ffe9a8"/>
    </linearGradient>
    <linearGradient id="smoke" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2a1a16" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#8a7a72" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#ff8a2a" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#c43a10" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Night sky -->
  <rect width="960" height="640" fill="url(#sky)"/>
  <ellipse cx="480" cy="520" rx="420" ry="180" fill="url(#glow)"/>

  <!-- Stars -->
  <g fill="#f5e6c8" opacity="0.55">
    <circle cx="80" cy="60" r="1.4"/>
    <circle cx="160" cy="110" r="1.1"/>
    <circle cx="240" cy="40" r="1.3"/>
    <circle cx="340" cy="90" r="1.0"/>
    <circle cx="520" cy="50" r="1.5"/>
    <circle cx="640" cy="85" r="1.1"/>
    <circle cx="760" cy="45" r="1.4"/>
    <circle cx="860" cy="100" r="1.2"/>
    <circle cx="900" cy="30" r="1.0"/>
  </g>

  <!-- Smoke plumes -->
  <g filter="url(#soft)" opacity="0.7">
    <path d="M180 420 C160 360, 140 300, 170 240 C200 180, 150 140, 180 90" stroke="url(#smoke)" stroke-width="28" fill="none"/>
    <path d="M420 400 C400 330, 430 280, 400 220 C370 160, 420 120, 390 70" stroke="url(#smoke)" stroke-width="34" fill="none"/>
    <path d="M680 410 C700 350, 660 300, 690 240 C720 180, 670 140, 700 85" stroke="url(#smoke)" stroke-width="30" fill="none"/>
  </g>

  <!-- City silhouette / districts -->
  <g fill="#12080c">
    <path d="M40 520 L40 440 L90 440 L90 380 L130 380 L130 460 L180 460 L180 350 L230 350 L230 420 L280 420 L280 300 L340 300 L340 390 L390 390 L390 330 L450 330 L450 280 L510 280 L510 360 L560 360 L560 310 L620 310 L620 400 L680 400 L680 270 L740 270 L740 380 L800 380 L800 340 L860 340 L860 430 L920 430 L920 520 Z"/>
  </g>
  <g fill="#1c0d12" opacity="0.9">
    <rect x="70" y="455" width="14" height="18" rx="1"/>
    <rect x="200" y="430" width="12" height="16" rx="1"/>
    <rect x="300" y="360" width="16" height="20" rx="1"/>
    <rect x="470" y="320" width="14" height="18" rx="1"/>
    <rect x="590" y="350" width="12" height="16" rx="1"/>
    <rect x="700" y="320" width="16" height="22" rx="1"/>
    <rect x="820" y="390" width="12" height="16" rx="1"/>
  </g>

  <!-- Six night flames (districts) -->
  <g>
    <!-- Night 1 -->
    <path d="M120 470 C110 430, 130 400, 120 360 C145 390, 150 430, 140 470 Z" fill="url(#ember)" opacity="0.95"/>
    <!-- Night 2 -->
    <path d="M250 480 C235 430, 260 390, 245 340 C275 380, 285 430, 270 480 Z" fill="url(#ember)" opacity="0.9"/>
    <!-- Night 3 -->
    <path d="M380 470 C365 415, 395 370, 375 310 C410 360, 420 420, 400 470 Z" fill="url(#ember)" opacity="0.95"/>
    <!-- Night 4 -->
    <path d="M510 460 C495 405, 525 360, 505 295 C545 350, 555 410, 530 460 Z" fill="url(#ember)" opacity="0.92"/>
    <!-- Night 5 -->
    <path d="M640 475 C625 425, 655 385, 635 330 C670 375, 680 430, 660 475 Z" fill="url(#ember)" opacity="0.9"/>
    <!-- Night 6 -->
    <path d="M780 470 C765 415, 795 370, 775 305 C815 360, 825 420, 800 470 Z" fill="url(#ember)" opacity="0.95"/>
  </g>

  <!-- Sparks -->
  <g fill="#ffe7a0">
    <circle cx="150" cy="300" r="2.2" opacity="0.85"/>
    <circle cx="280" cy="270" r="1.8" opacity="0.7"/>
    <circle cx="410" cy="250" r="2.4" opacity="0.8"/>
    <circle cx="540" cy="230" r="1.6" opacity="0.75"/>
    <circle cx="670" cy="260" r="2.0" opacity="0.8"/>
    <circle cx="800" cy="240" r="1.7" opacity="0.7"/>
    <circle cx="200" cy="220" r="1.4" opacity="0.55"/>
    <circle cx="600" cy="190" r="1.5" opacity="0.6"/>
    <circle cx="730" cy="210" r="1.3" opacity="0.5"/>
  </g>

  <!-- Ghost fiddle silhouette (wrong instrument / durable myth) -->
  <g transform="translate(760,120) rotate(-18)" opacity="0.72">
    <ellipse cx="0" cy="70" rx="22" ry="34" fill="none" stroke="#d8c4a0" stroke-width="3"/>
    <ellipse cx="0" cy="20" rx="16" ry="24" fill="none" stroke="#d8c4a0" stroke-width="3"/>
    <rect x="-3" y="-55" width="6" height="45" rx="2" fill="#d8c4a0"/>
    <rect x="-14" y="-62" width="28" height="8" rx="2" fill="#d8c4a0"/>
    <circle cx="-10" cy="20" r="3" fill="#0b0614"/>
    <circle cx="10" cy="20" r="3" fill="#0b0614"/>
    <path d="M-18 70 Q0 95 18 70" fill="none" stroke="#d8c4a0" stroke-width="2.5"/>
    <!-- bow -->
    <line x1="40" y1="-40" x2="55" y2="90" stroke="#c4b090" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Six night markers -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#f0d7a8" opacity="0.85">
    <text x="108" y="545">I</text>
    <text x="240" y="555">II</text>
    <text x="368" y="545">III</text>
    <text x="498" y="535">IV</text>
    <text x="628" y="550">V</text>
    <text x="768" y="545">VI</text>
  </g>

  <!-- Title block -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#f7e7c8">
    <text x="48" y="58" font-size="28" font-weight="700">Six Days · Rome Fire Dream</text>
    <text x="48" y="88" font-size="15" opacity="0.8">conduct the wind · keep a district ledger · ignore the wrong fiddle</text>
  </g>

  <!-- Ground ash line -->
  <path d="M0 520 Q240 505 480 520 T960 515 L960 640 L0 640 Z" fill="#0a0508" opacity="0.85"/>
  <text x="48" y="600" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#c9a882" opacity="0.75">19 July 64 · multi-session skyline · myth outruns the instrument</text>
</svg>
