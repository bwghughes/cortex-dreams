<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Sailing Stones Playa Trails Dream</title>
  <desc id="desc">Racetrack Playa at night: dark stones leave long trails across cracked clay under thin ice panels and a desert wind — motion nobody watches, ledger the clay keeps.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2338"/>
      <stop offset="55%" stop-color="#121826"/>
      <stop offset="100%" stop-color="#0a0e16"/>
    </linearGradient>
    <linearGradient id="playa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a342c"/>
      <stop offset="40%" stop-color="#2a241c"/>
      <stop offset="100%" stop-color="#1a1612"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9eefc" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#9ec9e8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6a8aaa" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c4a574" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#e8d2a8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c4a574" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- night sky -->
  <rect width="960" height="540" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#e8eef8" opacity="0.75">
    <circle cx="80" cy="40" r="1.2"/><circle cx="140" cy="70" r="0.9"/><circle cx="220" cy="30" r="1.1"/>
    <circle cx="310" cy="55" r="0.8"/><circle cx="400" cy="25" r="1.3"/><circle cx="480" cy="60" r="0.7"/>
    <circle cx="560" cy="35" r="1.0"/><circle cx="650" cy="50" r="0.9"/><circle cx="740" cy="28" r="1.2"/>
    <circle cx="820" cy="65" r="0.8"/><circle cx="900" cy="40" r="1.1"/><circle cx="180" cy="95" r="0.7"/>
    <circle cx="520" cy="90" r="0.6"/><circle cx="860" cy="100" r="0.9"/>
  </g>

  <!-- distant mountains -->
  <path d="M0 210 L120 150 L200 190 L320 130 L420 175 L540 125 L660 170 L780 140 L900 165 L960 155 L960 230 L0 230 Z"
        fill="#151b28" opacity="0.95"/>
  <path d="M0 230 L960 230 L960 250 L0 250 Z" fill="#1c2230"/>

  <!-- playa floor -->
  <rect x="0" y="250" width="960" height="290" fill="url(#playa)"/>

  <!-- cracked clay grid (subtle) -->
  <g stroke="#4a4034" stroke-width="0.8" opacity="0.35" fill="none">
    <path d="M40 280 Q180 300 320 285 T620 295 T920 280"/>
    <path d="M20 340 Q200 360 400 345 T800 355 T940 340"/>
    <path d="M60 400 Q240 420 460 405 T860 415"/>
    <path d="M30 460 Q220 475 450 465 T900 470"/>
    <path d="M120 260 L140 500"/><path d="M280 255 L300 510"/><path d="M450 250 L470 520"/>
    <path d="M620 255 L640 515"/><path d="M780 250 L800 505"/><path d="M900 260 L910 500"/>
  </g>

  <!-- thin ice panels (sails) -->
  <g opacity="0.7" filter="url(#soft)">
    <polygon points="180,320 260,305 300,335 210,350" fill="url(#ice)" stroke="#cfe8f8" stroke-width="0.6" opacity="0.85"/>
    <polygon points="420,300 510,288 545,320 450,335" fill="url(#ice)" stroke="#cfe8f8" stroke-width="0.6" opacity="0.75"/>
    <polygon points="640,330 720,315 760,348 670,360" fill="url(#ice)" stroke="#cfe8f8" stroke-width="0.6" opacity="0.8"/>
    <polygon points="300,390 380,378 410,405 320,418" fill="url(#ice)" stroke="#cfe8f8" stroke-width="0.5" opacity="0.55"/>
  </g>

  <!-- wind arrows (subtle) -->
  <g stroke="#9eb6d0" stroke-width="1.5" fill="none" opacity="0.45" stroke-linecap="round">
    <path d="M70 300 C110 292, 140 292, 180 300" marker-end="none"/>
    <path d="M175 298 L185 300 L175 302" stroke-width="1.2"/>
    <path d="M520 275 C560 268, 600 268, 640 276"/>
    <path d="M635 274 L645 276 L635 278" stroke-width="1.2"/>
    <path d="M760 310 C800 302, 840 304, 880 312"/>
    <path d="M875 310 L885 312 L875 314" stroke-width="1.2"/>
  </g>
  <text x="70" y="288" fill="#9eb6d0" font-family="Georgia, serif" font-size="11" opacity="0.55">wind</text>

  <!-- trails (the clay ledger) -->
  <g stroke="url(#trail)" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M160 360 C220 358, 300 350, 390 348"/>
    <path d="M250 430 C330 422, 430 418, 540 412"/>
    <path d="M480 370 C560 365, 650 360, 740 352"/>
    <path d="M600 455 C680 448, 760 442, 850 430"/>
    <path d="M100 480 C180 472, 280 468, 370 460"/>
  </g>
  <!-- trail shadows / deeper grooves -->
  <g stroke="#1a1410" stroke-width="1.2" fill="none" opacity="0.35" stroke-linecap="round">
    <path d="M160 362 C220 360, 300 352, 390 350"/>
    <path d="M250 432 C330 424, 430 420, 540 414"/>
    <path d="M480 372 C560 367, 650 362, 740 354"/>
    <path d="M600 457 C680 450, 760 444, 850 432"/>
    <path d="M100 482 C180 474, 280 470, 370 462"/>
  </g>

  <!-- sailing stones -->
  <g filter="url(#glow)">
    <!-- stone 1 -->
    <ellipse cx="400" cy="346" rx="16" ry="11" fill="#2a2620"/>
    <ellipse cx="396" cy="343" rx="10" ry="6" fill="#4a443a" opacity="0.7"/>
    <ellipse cx="404" cy="348" rx="5" ry="3" fill="#1a1612" opacity="0.5"/>
    <!-- stone 2 -->
    <ellipse cx="548" cy="410" rx="20" ry="13" fill="#2c2822"/>
    <ellipse cx="542" cy="406" rx="12" ry="7" fill="#524a3e" opacity="0.7"/>
    <!-- stone 3 -->
    <ellipse cx="748" cy="350" rx="14" ry="10" fill="#26221c"/>
    <ellipse cx="744" cy="347" rx="8" ry="5" fill="#463e34" opacity="0.75"/>
    <!-- stone 4 -->
    <ellipse cx="858" cy="428" rx="18" ry="12" fill="#2a241e"/>
    <ellipse cx="852" cy="424" rx="11" ry="6" fill="#4e463c" opacity="0.7"/>
    <!-- stone 5 -->
    <ellipse cx="378" cy="458" rx="15" ry="10" fill="#28241e"/>
    <ellipse cx="374" cy="455" rx="9" ry="5" fill="#4a4238" opacity="0.7"/>
  </g>

  <!-- thin ice rim highlights on stones -->
  <g fill="none" stroke="#d0e8f8" stroke-width="1" opacity="0.35">
    <ellipse cx="400" cy="346" rx="17" ry="12"/>
    <ellipse cx="548" cy="410" rx="21" ry="14"/>
    <ellipse cx="748" cy="350" rx="15" ry="11"/>
  </g>

  <!-- moon thin crescent -->
  <g transform="translate(860,70)">
    <circle r="22" fill="#dfe8f4" opacity="0.9"/>
    <circle cx="8" cy="-2" r="20" fill="#121826"/>
  </g>

  <!-- caption -->
  <text x="48" y="520" fill="#c8b896" font-family="Georgia, serif" font-size="18" letter-spacing="0.5">Sailing Stones · the clay keeps the score</text>
  <text x="48" y="50" fill="#8a9bb0" font-family="Georgia, serif" font-size="13" opacity="0.7">14 August · Racetrack Playa</text>
</svg>
