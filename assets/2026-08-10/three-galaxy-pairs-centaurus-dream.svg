<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Three Galaxy Pairs in Centaurus: polar-ring ghost, false friends by velocity, active merger">
  <defs>
    <linearGradient id="void" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07061a"/>
      <stop offset="55%" stop-color="#12103a"/>
      <stop offset="100%" stop-color="#1a0f28"/>
    </linearGradient>
    <radialGradient id="clusterGlow" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#6b4cff" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#2a1a60" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#07061a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="galCoreA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4d0"/>
      <stop offset="40%" stop-color="#ffd27a"/>
      <stop offset="100%" stop-color="#ff8a3a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="galCoreB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8f0ff"/>
      <stop offset="45%" stop-color="#9ec0ff"/>
      <stop offset="100%" stop-color="#5a7ad0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="galCoreC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe8ff"/>
      <stop offset="40%" stop-color="#d28cff"/>
      <stop offset="100%" stop-color="#7a3ab0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ad7ff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#3aa0ff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#1a60c8" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="mergeFire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6a3a" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffd060" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ff6a3a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="tiny" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- deep cluster void -->
  <rect width="960" height="540" fill="url(#void)"/>
  <ellipse cx="480" cy="260" rx="420" ry="220" fill="url(#clusterGlow)"/>

  <!-- faint background galaxies / stars -->
  <g opacity="0.55" filter="url(#tiny)">
    <circle cx="70" cy="60" r="1.2" fill="#c8d4ff"/>
    <circle cx="140" cy="110" r="0.9" fill="#fff"/>
    <circle cx="220" cy="40" r="1.1" fill="#b0c0ff"/>
    <circle cx="310" cy="90" r="0.8" fill="#fff"/>
    <circle cx="880" cy="70" r="1.3" fill="#d0e0ff"/>
    <circle cx="820" cy="130" r="0.9" fill="#fff"/>
    <circle cx="740" cy="50" r="1.0" fill="#a8b8ff"/>
    <circle cx="90" cy="480" r="1.1" fill="#fff"/>
    <circle cx="180" cy="500" r="0.8" fill="#c0d0ff"/>
    <circle cx="860" cy="470" r="1.2" fill="#fff"/>
    <circle cx="780" cy="510" r="0.9" fill="#b8c8ff"/>
    <circle cx="480" cy="30" r="1.0" fill="#fff"/>
    <circle cx="520" cy="80" r="0.7" fill="#d8e4ff"/>
    <circle cx="400" cy="500" r="0.9" fill="#fff"/>
  </g>

  <!-- PAIR 1: polar-ring ghost (left) -->
  <g transform="translate(170,250)">
    <!-- residual host disk -->
    <ellipse cx="0" cy="0" rx="78" ry="28" fill="#2a2048" opacity="0.9"/>
    <ellipse cx="0" cy="0" rx="60" ry="20" fill="url(#galCoreA)" opacity="0.85" filter="url(#soft)"/>
    <circle cx="0" cy="0" r="10" fill="#fff6d8"/>
    <!-- polar ring (leftover partner stars) -->
    <ellipse cx="0" cy="0" rx="22" ry="92" fill="none" stroke="url(#ringBlue)" stroke-width="10" opacity="0.85" transform="rotate(-12)"/>
    <ellipse cx="0" cy="0" rx="18" ry="86" fill="none" stroke="#a8ecff" stroke-width="2.5" opacity="0.7" transform="rotate(-12)"/>
    <!-- ring sparkles -->
    <circle cx="8" cy="-78" r="2.2" fill="#c8f4ff"/>
    <circle cx="-10" cy="74" r="1.8" fill="#9ad8ff"/>
    <circle cx="14" cy="40" r="1.4" fill="#fff"/>
    <text x="0" y="125" text-anchor="middle" fill="#9ad0ff" font-family="Georgia, serif" font-size="15" letter-spacing="1">POLAR-RING</text>
    <text x="0" y="144" text-anchor="middle" fill="#6a90c0" font-family="Georgia, serif" font-size="12">kept the partner's stars</text>
  </g>

  <!-- PAIR 2: false friends (center) — close on sky, arrows of relative velocity -->
  <g transform="translate(480,230)">
    <ellipse cx="-42" cy="8" rx="48" ry="22" fill="#243050" opacity="0.95" transform="rotate(-18)"/>
    <ellipse cx="-42" cy="8" rx="36" ry="15" fill="url(#galCoreB)" opacity="0.9" transform="rotate(-18)" filter="url(#soft)"/>
    <circle cx="-42" cy="8" r="7" fill="#eef4ff"/>
    <ellipse cx="48" cy="-10" rx="42" ry="18" fill="#2a2848" opacity="0.95" transform="rotate(22)"/>
    <ellipse cx="48" cy="-10" rx="30" ry="12" fill="url(#galCoreA)" opacity="0.85" transform="rotate(22)" filter="url(#soft)"/>
    <circle cx="48" cy="-10" r="6" fill="#fff0d0"/>
    <!-- dashed "looks paired" ring -->
    <ellipse cx="4" cy="0" rx="110" ry="55" fill="none" stroke="#7a88b0" stroke-width="1.5" stroke-dasharray="6 7" opacity="0.55"/>
    <!-- relative velocity arrows (they are not dancing) -->
    <path d="M -70,-30 L -95,-55" stroke="#ff8a7a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <path d="M 75,20 L 105,48" stroke="#ff8a7a" stroke-width="2.5" fill="none"/>
    <polygon points="-98,-58 -86,-52 -95,-46" fill="#ff8a7a"/>
    <polygon points="108,52 96,46 105,40" fill="#ff8a7a"/>
    <text x="0" y="95" text-anchor="middle" fill="#ffb0a0" font-family="Georgia, serif" font-size="15" letter-spacing="1">FALSE FRIENDS</text>
    <text x="0" y="114" text-anchor="middle" fill="#b07068" font-family="Georgia, serif" font-size="12">close on the sky · different velocities</text>
  </g>

  <!-- PAIR 3: active merger (right) -->
  <g transform="translate(790,255)">
    <!-- tidal bridges / shared fire -->
    <path d="M -55,-10 C -20,-40 20,-40 55,-8" fill="none" stroke="url(#mergeFire)" stroke-width="14" opacity="0.55" filter="url(#glow)"/>
    <path d="M -50,15 C -15,40 18,38 52,12" fill="none" stroke="#ff9a50" stroke-width="8" opacity="0.45" filter="url(#soft)"/>
    <ellipse cx="-38" cy="0" rx="46" ry="24" fill="#3a1840" opacity="0.95" transform="rotate(28)"/>
    <ellipse cx="-38" cy="0" rx="34" ry="16" fill="url(#galCoreC)" opacity="0.9" transform="rotate(28)" filter="url(#soft)"/>
    <circle cx="-38" cy="0" r="8" fill="#ffe8ff"/>
    <ellipse cx="40" cy="4" rx="50" ry="22" fill="#402018" opacity="0.95" transform="rotate(-24)"/>
    <ellipse cx="40" cy="4" rx="36" ry="14" fill="url(#galCoreA)" opacity="0.9" transform="rotate(-24)" filter="url(#soft)"/>
    <circle cx="40" cy="4" r="8" fill="#fff2d0"/>
    <!-- collision sparks -->
    <circle cx="0" cy="-8" r="3" fill="#fff6a0"/>
    <circle cx="8" cy="10" r="2" fill="#ffd070"/>
    <circle cx="-12" cy="6" r="1.6" fill="#fff"/>
    <text x="0" y="120" text-anchor="middle" fill="#ffc090" font-family="Georgia, serif" font-size="15" letter-spacing="1">ACTIVE MERGER</text>
    <text x="0" y="139" text-anchor="middle" fill="#b07850" font-family="Georgia, serif" font-size="12">one body · long clock</text>
  </g>

  <!-- title plate -->
  <g>
    <rect x="48" y="18" width="420" height="54" rx="8" fill="#0c0a22" opacity="0.72"/>
    <text x="68" y="42" fill="#e8e4ff" font-family="Georgia, serif" font-size="22" font-weight="600">Three Galaxy Pairs · Centaurus</text>
    <text x="68" y="60" fill="#8a84b8" font-family="Georgia, serif" font-size="13">name the relationship status before you call it a partnership</text>
  </g>

  <!-- footer -->
  <text x="480" y="520" text-anchor="middle" fill="#5a5480" font-family="Georgia, serif" font-size="12" letter-spacing="2">CORTEX DREAM · 2026-08-10 · THREE STATUSES · ONE CLUSTER</text>
</svg>
