<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Voyager golden record dream: gold disc in deep space, stylus for strangers, light-lag ping toward a pale Earth">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="45%" stop-color="#0a1228"/>
      <stop offset="100%" stop-color="#1a0a18"/>
    </linearGradient>
    <radialGradient id="nebula" cx="70%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#3a1a58" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#1a2858" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#050814" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe7a0"/>
      <stop offset="35%" stop-color="#e8c050"/>
      <stop offset="70%" stop-color="#c4922a"/>
      <stop offset="100%" stop-color="#7a5418"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3c8"/>
      <stop offset="100%" stop-color="#8a6020"/>
    </linearGradient>
    <radialGradient id="discGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe08a" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#c9a040" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#050814" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ad0ff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#7ad0ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffe08a" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect width="1200" height="720" fill="url(#nebula)"/>

  <!-- stars -->
  <g fill="#dfe9ff" opacity="0.85">
    <circle cx="80" cy="70" r="1.4"/>
    <circle cx="160" cy="140" r="1.1"/>
    <circle cx="240" cy="50" r="1.8"/>
    <circle cx="320" cy="180" r="1.2"/>
    <circle cx="420" cy="90" r="1.5"/>
    <circle cx="520" cy="40" r="1.1"/>
    <circle cx="610" cy="120" r="1.3"/>
    <circle cx="720" cy="60" r="1.6"/>
    <circle cx="820" cy="150" r="1.2"/>
    <circle cx="910" cy="35" r="1.4"/>
    <circle cx="1000" cy="110" r="1.1"/>
    <circle cx="1080" cy="70" r="1.7"/>
    <circle cx="1140" cy="200" r="1.2"/>
    <circle cx="90" cy="260" r="1.1"/>
    <circle cx="180" cy="320" r="1.4"/>
    <circle cx="70" cy="480" r="1.2"/>
    <circle cx="150" cy="560" r="1.5"/>
    <circle cx="250" cy="640" r="1.1"/>
    <circle cx="980" cy="520" r="1.3"/>
    <circle cx="1080" cy="600" r="1.6"/>
    <circle cx="1150" cy="480" r="1.2"/>
    <circle cx="860" cy="640" r="1.4"/>
  </g>

  <!-- pale earth / blue pixel -->
  <g transform="translate(160 520)" filter="url(#glow)">
    <circle cx="0" cy="0" r="28" fill="#1a4a78" opacity="0.9"/>
    <circle cx="-6" cy="-4" r="10" fill="#2f7a4a" opacity="0.55"/>
    <circle cx="8" cy="6" r="7" fill="#3a8a58" opacity="0.4"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#7ad0ff" stroke-width="1.5" opacity="0.7"/>
    <text x="0" y="52" text-anchor="middle" fill="#9ec8e8" font-family="Georgia, serif" font-size="14" letter-spacing="1">EARTH · ~23h lag</text>
  </g>

  <!-- radio ghost beam -->
  <path d="M190 500 C 360 420, 520 360, 700 330" fill="none" stroke="url(#beam)" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <g fill="#7ad0ff" opacity="0.7">
    <circle cx="280" cy="455" r="3"/>
    <circle cx="400" cy="400" r="2.4"/>
    <circle cx="520" cy="360" r="2.8"/>
    <circle cx="620" cy="340" r="2.2"/>
  </g>
  <text x="360" y="430" fill="#8ec8ee" font-family="ui-monospace, Menlo, monospace" font-size="12" opacity="0.85">PING · already yesterday</text>

  <!-- golden record -->
  <g transform="translate(780 340)">
    <circle cx="0" cy="0" r="210" fill="url(#discGlow)" opacity="0.9"/>
    <circle cx="0" cy="0" r="168" fill="#1a1208" stroke="url(#goldEdge)" stroke-width="10"/>
    <circle cx="0" cy="0" r="158" fill="url(#gold)" opacity="0.95"/>
    <!-- grooves -->
    <g fill="none" stroke="#7a5418" stroke-opacity="0.35" stroke-width="1.2">
      <circle cx="0" cy="0" r="148"/>
      <circle cx="0" cy="0" r="136"/>
      <circle cx="0" cy="0" r="124"/>
      <circle cx="0" cy="0" r="112"/>
      <circle cx="0" cy="0" r="100"/>
      <circle cx="0" cy="0" r="88"/>
      <circle cx="0" cy="0" r="76"/>
      <circle cx="0" cy="0" r="64"/>
      <circle cx="0" cy="0" r="52"/>
    </g>
    <!-- cover diagram ghosts -->
    <g fill="none" stroke="#5a3a10" stroke-width="1.4" opacity="0.55">
      <circle cx="-40" cy="-30" r="18"/>
      <path d="M-55 -30 h-22 M-62 -38 v16"/>
      <path d="M20 -50 l30 18 l-12 22 z"/>
      <path d="M-10 40 h50 M15 40 v28"/>
      <circle cx="55" cy="10" r="10"/>
    </g>
    <!-- center label -->
    <circle cx="0" cy="0" r="28" fill="#2a1a08" stroke="#f0d080" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="#f5e0a0"/>
    <!-- stylus -->
    <g transform="rotate(-28)" filter="url(#soft)">
      <rect x="20" y="-6" width="150" height="10" rx="3" fill="#c8d0d8"/>
      <rect x="160" y="-10" width="18" height="18" rx="2" fill="#e8c050"/>
      <path d="M178 -2 l22 8 l-22 8 z" fill="#f5e0a0"/>
    </g>
    <text x="0" y="205" text-anchor="middle" fill="#f0d080" font-family="Georgia, serif" font-size="20" letter-spacing="2">GOLDEN RECORD</text>
    <text x="0" y="228" text-anchor="middle" fill="#a89060" font-family="ui-monospace, Menlo, monospace" font-size="12">stylus for strangers · curated, not raw</text>
  </g>

  <!-- probe silhouette -->
  <g transform="translate(980 150)" opacity="0.9">
    <rect x="-8" y="0" width="16" height="70" rx="3" fill="#9aa8b8"/>
    <rect x="-36" y="8" width="72" height="8" rx="2" fill="#c0c8d0"/>
    <polygon points="0,-18 -14,8 14,8" fill="#d8e0e8"/>
    <circle cx="0" cy="78" r="10" fill="url(#gold)" opacity="0.95"/>
    <text x="0" y="110" text-anchor="middle" fill="#9ec0d8" font-family="ui-monospace, Menlo, monospace" font-size="11">VOYAGER 1</text>
    <text x="0" y="126" text-anchor="middle" fill="#6a88a0" font-family="ui-monospace, Menlo, monospace" font-size="10">~171 AU</text>
  </g>

  <!-- title block -->
  <g font-family="Georgia, serif" fill="#e8eef8">
    <text x="48" y="64" font-size="34" letter-spacing="1">Voyager Golden Record Dream</text>
    <text x="48" y="96" font-size="16" fill="#9eb0c8">5 September 1977 → 2026-09-05 · bottle of gold in the dark</text>
  </g>

  <!-- caption chips -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="13">
    <rect x="48" y="640" width="210" height="36" rx="8" fill="#121a2a" stroke="#3a5070"/>
    <text x="153" y="663" text-anchor="middle" fill="#c8d8f0">stable pin = disc that ships</text>
    <rect x="278" y="640" width="230" height="36" rx="8" fill="#121a2a" stroke="#3a5070"/>
    <text x="393" y="663" text-anchor="middle" fill="#c8d8f0">many tongues · one craft</text>
    <rect x="528" y="640" width="250" height="36" rx="8" fill="#121a2a" stroke="#3a5070"/>
    <text x="653" y="663" text-anchor="middle" fill="#c8d8f0">encode ≠ dump · name the lag</text>
  </g>
</svg>
