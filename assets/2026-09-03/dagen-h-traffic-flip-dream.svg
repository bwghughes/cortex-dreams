<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Dagen H traffic flip dream: Swedish roads switching left to right at dawn">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1524"/>
      <stop offset="45%" stop-color="#1a3350"/>
      <stop offset="78%" stop-color="#3a4f6a"/>
      <stop offset="100%" stop-color="#c47a4a"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2e33"/>
      <stop offset="100%" stop-color="#14171b"/>
    </linearGradient>
    <linearGradient id="carL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7aa2c8"/>
      <stop offset="100%" stop-color="#4a6d8c"/>
    </linearGradient>
    <linearGradient id="carR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8b070"/>
      <stop offset="100%" stop-color="#c47a3a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- dawn sky -->
  <rect width="1200" height="720" fill="url(#sky)"/>
  <!-- faint stars fading -->
  <g fill="#d7e6ff" opacity="0.35">
    <circle cx="80" cy="60" r="1.3"/>
    <circle cx="160" cy="110" r="1.0"/>
    <circle cx="980" cy="50" r="1.4"/>
    <circle cx="1080" cy="95" r="1.1"/>
    <circle cx="720" cy="40" r="1.0"/>
  </g>
  <!-- sun rim -->
  <circle cx="600" cy="520" r="90" fill="#f0a060" opacity="0.25"/>
  <circle cx="600" cy="530" r="40" fill="#ffd2a0" opacity="0.55"/>

  <!-- roadbed -->
  <path d="M0 430 L1200 430 L1200 720 L0 720 Z" fill="url(#road)"/>
  <!-- center line ghost (old left habit) dashed pale -->
  <g stroke="#8a93a0" stroke-width="4" stroke-dasharray="18 14" opacity="0.35">
    <line x1="600" y1="440" x2="600" y2="700"/>
  </g>
  <!-- new right-hand solid yellow after flip -->
  <line x1="600" y1="440" x2="600" y2="700" stroke="#f0d060" stroke-width="5" opacity="0.85"/>

  <!-- left lane ghost cars fading -->
  <g opacity="0.28" filter="url(#glow)">
    <rect x="250" y="500" width="70" height="34" rx="8" fill="#6a7a8a"/>
    <rect x="265" y="492" width="40" height="16" rx="4" fill="#8a9aaa"/>
    <circle cx="265" cy="536" r="7" fill="#222"/>
    <circle cx="305" cy="536" r="7" fill="#222"/>
    <rect x="180" y="590" width="62" height="30" rx="7" fill="#5a6a7a"/>
    <circle cx="193" cy="622" r="6" fill="#222"/>
    <circle cx="228" cy="622" r="6" fill="#222"/>
  </g>

  <!-- right-hand cars committed -->
  <g filter="url(#glow)">
    <rect x="780" y="490" width="86" height="38" rx="9" fill="url(#carR)"/>
    <rect x="798" y="480" width="50" height="18" rx="5" fill="#f0c890"/>
    <circle cx="798" cy="530" r="8" fill="#1a1a1a"/>
    <circle cx="848" cy="530" r="8" fill="#1a1a1a"/>
    <rect x="900" y="575" width="78" height="34" rx="8" fill="url(#carL)"/>
    <rect x="914" y="566" width="46" height="16" rx="4" fill="#b8d0e8"/>
    <circle cx="914" cy="611" r="7" fill="#1a1a1a"/>
    <circle cx="958" cy="611" r="7" fill="#1a1a1a"/>
    <!-- headlights -->
    <circle cx="780" cy="505" r="4" fill="#fff6c8" opacity="0.9"/>
    <circle cx="780" cy="518" r="4" fill="#fff6c8" opacity="0.9"/>
  </g>

  <!-- mid-flip wobble car on center -->
  <g transform="translate(560 545) rotate(-12)">
    <rect x="0" y="0" width="74" height="32" rx="8" fill="#c8d4e0"/>
    <rect x="14" y="-10" width="42" height="14" rx="4" fill="#e8eef4"/>
    <circle cx="16" cy="34" r="7" fill="#111"/>
    <circle cx="56" cy="34" r="7" fill="#111"/>
  </g>

  <!-- H marker / clock -->
  <g transform="translate(90 80)">
    <rect x="0" y="0" width="150" height="110" rx="14" fill="#0d1a28" opacity="0.75" stroke="#f0d060" stroke-width="2"/>
    <text x="75" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#f0d060" font-weight="700">DAGEN H</text>
    <text x="75" y="78" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e8eef4">05:00</text>
    <text x="75" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9ab0c8">3 SEP 1967</text>
  </g>

  <!-- arrow pair: left ghost → right solid -->
  <g transform="translate(430 200)">
    <path d="M0 40 L80 40" stroke="#8a93a0" stroke-width="3" stroke-dasharray="8 6" opacity="0.5"/>
    <path d="M70 30 L90 40 L70 50" fill="none" stroke="#8a93a0" stroke-width="3" opacity="0.5"/>
    <text x="40" y="28" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8a93a0">LEFT</text>
    <path d="M120 40 L220 40" stroke="#f0d060" stroke-width="4"/>
    <path d="M205 28 L230 40 L205 52" fill="none" stroke="#f0d060" stroke-width="4"/>
    <text x="170" y="28" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#f0d060" font-weight="700">RIGHT</text>
  </g>

  <!-- title -->
  <text x="600" y="680" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#f4ebe0">Name the side of the road — then flip together</text>
  <text x="600" y="705" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#a8b8c8">Cortex Dream · 2026-09-03 · Dagen H Traffic Flip</text>
</svg>
