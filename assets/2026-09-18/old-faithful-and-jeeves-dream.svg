<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Old Faithful and Jeeves: geyser and valet on one calendar square">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#1a2740"/>
      <stop offset="100%" stop-color="#2a3a52"/>
    </linearGradient>
    <linearGradient id="steam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f4d7a4" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#c9d8e8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e8f0f8" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2f22"/>
      <stop offset="100%" stop-color="#1a140e"/>
    </linearGradient>
    <linearGradient id="tray" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8e4d8"/>
      <stop offset="100%" stop-color="#b8b09a"/>
    </linearGradient>
    <radialGradient id="pool" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#6ec8c0"/>
      <stop offset="70%" stop-color="#2a6a68"/>
      <stop offset="100%" stop-color="#143838"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <g fill="#d7e6ff" opacity="0.45">
    <circle cx="80" cy="55" r="1.3"/>
    <circle cx="180" cy="100" r="1.0"/>
    <circle cx="320" cy="40" r="1.5"/>
    <circle cx="460" cy="85" r="1.1"/>
    <circle cx="620" cy="30" r="1.6"/>
    <circle cx="780" cy="70" r="1.0"/>
    <circle cx="940" cy="50" r="1.4"/>
    <circle cx="1080" cy="95" r="1.2"/>
  </g>

  <text x="600" y="44" text-anchor="middle" fill="#9eb6c9" font-family="Georgia, serif" font-size="18" letter-spacing="3">18 SEPTEMBER · OLD FAITHFUL &amp; JEEVES</text>
  <text x="600" y="72" text-anchor="middle" fill="#7a91a8" font-family="Georgia, serif" font-size="14">1870 steam · 1915 starch · one square · two reliabilities</text>

  <!-- left: geyser basin -->
  <ellipse cx="340" cy="620" rx="180" ry="48" fill="url(#pool)" opacity="0.9"/>
  <ellipse cx="340" cy="610" rx="140" ry="28" fill="#8fdad2" opacity="0.35"/>
  <path d="M300 560 C290 480 310 360 340 220 C370 360 390 480 380 560 Z" fill="url(#steam)"/>
  <path d="M320 560 C315 500 325 400 340 280 C355 400 365 500 360 560 Z" fill="#f8f4ea" opacity="0.35"/>
  <ellipse cx="340" cy="560" rx="42" ry="14" fill="#1a3a38"/>
  <text x="340" y="690" text-anchor="middle" fill="#c9b896" font-family="Georgia, serif" font-size="16">OLD FAITHFUL</text>
  <text x="340" y="712" text-anchor="middle" fill="#8a7a60" font-family="Georgia, serif" font-size="12">erupts on schedule</text>

  <!-- right: valet silhouette with tray -->
  <g transform="translate(780,430)">
    <!-- legs -->
    <rect x="-18" y="110" width="14" height="90" rx="3" fill="#1a1a22"/>
    <rect x="8" y="110" width="14" height="90" rx="3" fill="#1a1a22"/>
    <!-- body / tails -->
    <path d="M-28 20 L-22 110 L22 110 L28 20 Z" fill="#1e2430"/>
    <path d="M-34 30 L-40 120 L-22 110 L-18 30 Z" fill="#12161e"/>
    <path d="M34 30 L40 120 L22 110 L18 30 Z" fill="#12161e"/>
    <!-- shirt front -->
    <rect x="-10" y="28" width="20" height="70" fill="#e8e4dc"/>
    <line x1="0" y1="35" x2="0" y2="90" stroke="#b8b0a4" stroke-width="1"/>
    <!-- arms holding tray -->
    <path d="M-28 40 C-60 55 -70 70 -55 78" fill="none" stroke="#2a303c" stroke-width="10" stroke-linecap="round"/>
    <path d="M28 40 C55 50 70 55 78 48" fill="none" stroke="#2a303c" stroke-width="10" stroke-linecap="round"/>
    <!-- silver tray -->
    <ellipse cx="78" cy="42" rx="48" ry="10" fill="url(#tray)"/>
    <ellipse cx="78" cy="40" rx="42" ry="7" fill="#f4f0e6" opacity="0.7"/>
    <circle cx="68" cy="36" r="6" fill="#c0a060"/>
    <rect x="82" y="28" width="10" height="16" rx="2" fill="#d8d0c0"/>
    <!-- head -->
    <ellipse cx="0" cy="0" rx="22" ry="26" fill="#d4b896"/>
    <path d="M-18 -8 C-10 -28 10 -28 18 -8" fill="#1a1a22"/>
    <ellipse cx="-8" cy="2" rx="2" ry="2.5" fill="#2a1a12"/>
    <ellipse cx="8" cy="2" rx="2" ry="2.5" fill="#2a1a12"/>
    <path d="M-6 14 Q0 18 6 14" fill="none" stroke="#2a1a12" stroke-width="1.5"/>
  </g>
  <text x="860" y="690" text-anchor="middle" fill="#c9b896" font-family="Georgia, serif" font-size="16">JEEVES</text>
  <text x="860" y="712" text-anchor="middle" fill="#8a7a60" font-family="Georgia, serif" font-size="12">arrives when needed</text>

  <!-- center calendar square -->
  <rect x="520" y="300" width="160" height="160" rx="8" fill="#f0e2c4" stroke="#c4a86a" stroke-width="3"/>
  <text x="600" y="340" text-anchor="middle" fill="#6a5430" font-family="Georgia, serif" font-size="13" letter-spacing="2">18 SEP</text>
  <text x="600" y="390" text-anchor="middle" fill="#3a2a14" font-family="Georgia, serif" font-size="42" font-weight="bold">18</text>
  <text x="600" y="430" text-anchor="middle" fill="#6a5430" font-family="Georgia, serif" font-size="12">steam ↔ starch</text>

  <!-- ground band -->
  <path d="M0 740 Q300 700 600 730 T1200 720 L1200 800 L0 800 Z" fill="url(#ground)" opacity="0.85"/>

  <text x="600" y="770" text-anchor="middle" fill="#9a8a70" font-family="Georgia, serif" font-size="13">reliability is a kind of humour when the timing is slightly absurd</text>
</svg>
