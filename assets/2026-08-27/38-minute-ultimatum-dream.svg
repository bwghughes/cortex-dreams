<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-label="38-Minute Ultimatum Dream: harbor clock, gunboats, smoking palace, flag swap">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="55%" stop-color="#3d4f6f"/>
      <stop offset="100%" stop-color="#6b7a8f"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e4d5c"/>
      <stop offset="100%" stop-color="#0d2a33"/>
    </linearGradient>
    <linearGradient id="smoke" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#c4a574" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#8a7a6a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8a7a6a" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- sky + sea -->
  <rect width="960" height="640" fill="url(#sky)"/>
  <rect y="380" width="960" height="260" fill="url(#sea)"/>

  <!-- faint tide lines -->
  <g stroke="#9ec9d4" stroke-opacity="0.25" stroke-width="1.5" fill="none">
    <path d="M0 420 Q120 410 240 422 T480 418 T720 425 T960 415"/>
    <path d="M0 455 Q150 445 300 458 T600 450 T960 460"/>
    <path d="M0 500 Q180 490 360 505 T720 498 T960 510"/>
  </g>

  <!-- distant hills / shore -->
  <path d="M0 390 L80 360 L160 380 L260 350 L360 375 L480 340 L600 370 L720 345 L840 365 L960 350 L960 390 Z" fill="#2a3548" opacity="0.85"/>

  <!-- palace block (pre-rubble silhouette + smoking crown) -->
  <g transform="translate(620,210)">
    <rect x="0" y="40" width="160" height="140" fill="#4a3f35"/>
    <rect x="20" y="20" width="40" height="40" fill="#5c5044"/>
    <rect x="100" y="10" width="40" height="50" fill="#5c5044"/>
    <polygon points="0,40 80,0 160,40" fill="#3a322a"/>
    <!-- windows -->
    <g fill="#1a1520">
      <rect x="18" y="70" width="18" height="28"/>
      <rect x="50" y="70" width="18" height="28"/>
      <rect x="92" y="70" width="18" height="28"/>
      <rect x="124" y="70" width="18" height="28"/>
      <rect x="18" y="120" width="18" height="28"/>
      <rect x="50" y="120" width="18" height="28"/>
      <rect x="92" y="120" width="18" height="28"/>
      <rect x="124" y="120" width="18" height="28"/>
    </g>
    <!-- smoke plumes -->
    <ellipse cx="40" cy="-10" rx="28" ry="50" fill="url(#smoke)" filter="url(#soft)"/>
    <ellipse cx="95" cy="-30" rx="36" ry="70" fill="url(#smoke)" filter="url(#soft)"/>
    <ellipse cx="130" cy="-5" rx="22" ry="42" fill="url(#smoke)" filter="url(#soft)"/>
  </g>

  <!-- British gunboats (asymmetric force) -->
  <g transform="translate(90,400)">
    <!-- boat 1 -->
    <path d="M0 40 L20 20 L140 20 L160 40 L150 55 L10 55 Z" fill="#1a1f28"/>
    <rect x="55" y="-5" width="8" height="30" fill="#2c3340"/>
    <path d="M63 -5 L95 -25 L63 -20 Z" fill="#c9c4b8"/>
    <circle cx="40" cy="28" r="6" fill="#8b7355"/>
    <circle cx="110" cy="28" r="6" fill="#8b7355"/>
    <!-- muzzle flash -->
    <path d="M160 28 L195 18 L185 30 L198 38 Z" fill="#f0c060" opacity="0.85"/>
  </g>
  <g transform="translate(250,430)">
    <!-- boat 2 -->
    <path d="M0 35 L18 18 L120 18 L138 35 L128 48 L10 48 Z" fill="#222833"/>
    <rect x="48" y="0" width="7" height="24" fill="#2c3340"/>
    <path d="M55 0 L82 -18 L55 -12 Z" fill="#b8b3a6"/>
    <circle cx="35" cy="26" r="5" fill="#8b7355"/>
    <circle cx="95" cy="26" r="5" fill="#8b7355"/>
    <path d="M138 26 L168 20 L160 28 L170 34 Z" fill="#e8b050" opacity="0.75"/>
  </g>
  <g transform="translate(160,470)">
    <!-- boat 3 smaller -->
    <path d="M0 28 L14 14 L95 14 L108 28 L100 38 L8 38 Z" fill="#1c222c"/>
    <rect x="40" y="2" width="6" height="18" fill="#2c3340"/>
    <path d="M46 2 L68 -12 L46 -8 Z" fill="#a8a396"/>
  </g>

  <!-- harbor clock / ultimatum dial (left) -->
  <g transform="translate(120,120)">
    <circle cx="0" cy="0" r="88" fill="#0f141c" stroke="#c9a84c" stroke-width="4"/>
    <circle cx="0" cy="0" r="78" fill="#1a2230" stroke="#6b5a3a" stroke-width="2"/>
    <!-- tick marks -->
    <g stroke="#c9a84c" stroke-width="2">
      <line x1="0" y1="-70" x2="0" y2="-60"/>
      <line x1="0" y1="60" x2="0" y2="70"/>
      <line x1="-70" y1="0" x2="-60" y2="0"/>
      <line x1="60" y1="0" x2="70" y2="0"/>
      <line x1="-49" y1="-49" x2="-42" y2="-42"/>
      <line x1="49" y1="-49" x2="42" y2="-42"/>
      <line x1="-49" y1="49" x2="-42" y2="42"/>
      <line x1="49" y1="49" x2="42" y2="42"/>
    </g>
    <!-- 38-minute arc (almost a half-hour wedge) -->
    <path d="M0 0 L0 -68 A68 68 0 0 1 64 -22 Z" fill="#e07a3a" opacity="0.55"/>
    <!-- hands: start 09:02-ish feel, short engagement -->
    <line x1="0" y1="0" x2="8" y2="-48" stroke="#f2e6c9" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="42" y2="-18" stroke="#c9a84c" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="5" fill="#c9a84c"/>
    <!-- labels -->
    <text x="0" y="28" text-anchor="middle" fill="#f2e6c9" font-family="Georgia, serif" font-size="13" letter-spacing="1">09:02 → 09:40</text>
    <text x="0" y="48" text-anchor="middle" fill="#c9a84c" font-family="Georgia, serif" font-size="16" font-weight="700">38 MIN</text>
  </g>

  <!-- two flags swapping on a short pole (right of clock, near shore) -->
  <g transform="translate(420,300)">
    <line x1="0" y1="0" x2="0" y2="90" stroke="#2a2a2a" stroke-width="4"/>
    <!-- old flag falling -->
    <g transform="translate(-2,8) rotate(-25)">
      <rect x="0" y="0" width="54" height="32" fill="#5a1a1a"/>
      <text x="27" y="22" text-anchor="middle" fill="#e8d5a3" font-size="9" font-family="Georgia, serif">OLD</text>
    </g>
    <!-- new flag rising -->
    <g transform="translate(2,5) rotate(12)">
      <rect x="0" y="0" width="56" height="34" fill="#1a3a6b"/>
      <text x="28" y="22" text-anchor="middle" fill="#e8d5a3" font-size="9" font-family="Georgia, serif">NEW</text>
    </g>
  </g>

  <!-- title plate -->
  <g transform="translate(480,575)">
    <rect x="-280" y="-28" width="560" height="56" rx="8" fill="#0f141c" opacity="0.72"/>
    <text x="0" y="-2" text-anchor="middle" fill="#f2e6c9" font-family="Georgia, serif" font-size="20">38-Minute Ultimatum · Harbor Clock</text>
    <text x="0" y="22" text-anchor="middle" fill="#c9a84c" font-family="Georgia, serif" font-size="13">Asymmetric force · flag changes · tides keep counting</text>
  </g>
</svg>
