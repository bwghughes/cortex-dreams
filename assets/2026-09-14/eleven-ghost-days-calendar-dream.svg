<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Eleven Ghost Days dream: left a torn calendar jumping from 2 September to 14 September with eleven spectral day-numerals drifting, right a gold ring around living 14 while continuous-update gears rewrite the page and holdback ghosts linger">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e16"/>
      <stop offset="50%" stop-color="#121824"/>
      <stop offset="100%" stop-color="#06080c"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2230"/>
      <stop offset="100%" stop-color="#0c1018"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe2a0"/>
      <stop offset="55%" stop-color="#d4a84a"/>
      <stop offset="100%" stop-color="#8a6a28"/>
    </linearGradient>
    <linearGradient id="ghost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ab0d0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#4a6078" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="tear" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff8860" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#ffd080" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#88c8ff" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="ringglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd878" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffd878" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>

  <!-- starfield -->
  <g fill="#c8d4e8" opacity="0.55">
    <circle cx="90" cy="70" r="1.2"/><circle cx="180" cy="40" r="0.9"/><circle cx="260" cy="95" r="1.1"/>
    <circle cx="520" cy="55" r="1.0"/><circle cx="700" cy="35" r="1.3"/><circle cx="880" cy="80" r="0.8"/>
    <circle cx="1040" cy="50" r="1.1"/><circle cx="1120" cy="110" r="0.9"/><circle cx="430" cy="650" r="1.0"/>
    <circle cx="980" cy="640" r="1.2"/><circle cx="60" cy="600" r="0.8"/><circle cx="760" cy="680" r="1.0"/>
  </g>

  <!-- LEFT: torn calendar / old 2 watching -->
  <rect x="48" y="70" width="500" height="540" rx="20" fill="url(#panel)" stroke="#2a3648" stroke-width="1.5"/>
  <text x="298" y="115" text-anchor="middle" fill="#8aa0b8" font-family="Georgia, serif" font-size="18" letter-spacing="2">BRITAIN · 1752</text>

  <!-- calendar sheet -->
  <rect x="110" y="150" width="360" height="400" rx="8" fill="#1e2838" stroke="#3a4a60" stroke-width="1.5"/>
  <rect x="110" y="150" width="360" height="48" rx="8" fill="#2a3448"/>
  <text x="290" y="182" text-anchor="middle" fill="#c8d4e8" font-family="Georgia, serif" font-size="20">SEPTEMBER</text>

  <!-- old 2 left edge -->
  <g opacity="0.75">
    <rect x="130" y="230" width="70" height="70" rx="6" fill="#15202c" stroke="#5a7088" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="165" y="275" text-anchor="middle" fill="#8aa0b8" font-family="Georgia, serif" font-size="36">2</text>
  </g>

  <!-- tear / jump line -->
  <path d="M220 265 C280 200, 340 330, 400 250" fill="none" stroke="url(#tear)" stroke-width="3" filter="url(#soft)"/>
  <path d="M230 280 L250 250 L270 290 L290 240 L310 300 L330 255 L350 285 L370 245 L390 270" fill="none" stroke="#ffb070" stroke-width="1.5" opacity="0.7"/>

  <!-- living 14 gold ring -->
  <circle cx="430" cy="280" r="48" fill="url(#ringglow)"/>
  <circle cx="430" cy="280" r="36" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <circle cx="430" cy="280" r="28" fill="#1a2030"/>
  <text x="430" y="292" text-anchor="middle" fill="#ffe2a0" font-family="Georgia, serif" font-size="34" font-weight="700">14</text>

  <!-- ghost day numerals drifting -->
  <g fill="url(#ghost)" font-family="Georgia, serif" font-size="22" opacity="0.7">
    <text x="150" y="360" transform="rotate(-12 150 360)">3</text>
    <text x="210" y="390" transform="rotate(8 210 390)">4</text>
    <text x="270" y="350" transform="rotate(-6 270 350)">5</text>
    <text x="330" y="400" transform="rotate(14 330 400)">6</text>
    <text x="180" y="450" transform="rotate(-18 180 450)">7</text>
    <text x="250" y="480" transform="rotate(5 250 480)">8</text>
    <text x="320" y="460" transform="rotate(-10 320 460)">9</text>
    <text x="390" y="420" transform="rotate(11 390 420)">10</text>
    <text x="420" y="490" transform="rotate(-7 420 490)">11</text>
    <text x="360" y="530" transform="rotate(9 360 530)">12</text>
    <text x="200" y="530" transform="rotate(-4 200 530)">13</text>
  </g>

  <text x="298" y="575" text-anchor="middle" fill="#6a8098" font-family="Georgia, serif" font-size="14" font-style="italic">Give us our eleven days</text>

  <!-- RIGHT: GA page / holdback ghosts / continuous gears -->
  <rect x="652" y="70" width="500" height="540" rx="20" fill="url(#panel)" stroke="#2a3648" stroke-width="1.5"/>
  <text x="902" y="115" text-anchor="middle" fill="#8aa0b8" font-family="Georgia, serif" font-size="18" letter-spacing="2">OS 27 · GA PAGE</text>

  <!-- GA feature list -->
  <rect x="700" y="150" width="400" height="280" rx="8" fill="#1e2838" stroke="#3a4a60" stroke-width="1.5"/>
  <text x="720" y="185" fill="#a8e0b0" font-family="ui-monospace, monospace" font-size="15">✓ Siri AI English — shipped</text>
  <text x="720" y="215" fill="#a8e0b0" font-family="ui-monospace, monospace" font-size="15">✓ Personal context — live</text>
  <text x="720" y="245" fill="#a8e0b0" font-family="ui-monospace, monospace" font-size="15">✓ App actions — eligible silicon</text>
  <text x="720" y="285" fill="#7a90a8" font-family="ui-monospace, monospace" font-size="15" opacity="0.55">◌ Messages Suggestions — ghost</text>
  <text x="720" y="315" fill="#7a90a8" font-family="ui-monospace, monospace" font-size="15" opacity="0.55">◌ Passwords fix-with-a-tap — ghost</text>
  <text x="720" y="345" fill="#7a90a8" font-family="ui-monospace, monospace" font-size="15" opacity="0.45">◌ EU DMA skip — not this cut</text>
  <text x="720" y="385" fill="#c8b070" font-family="ui-monospace, monospace" font-size="14">… future software update …</text>
  <text x="720" y="410" fill="#88a0c0" font-family="ui-monospace, monospace" font-size="13" opacity="0.8">private: model-delegation almanac</text>

  <!-- continuous-update gears -->
  <g transform="translate(760,500)" opacity="0.9">
    <circle cx="0" cy="0" r="42" fill="none" stroke="#5a7088" stroke-width="3"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#3a4a60" stroke-width="2"/>
    <g stroke="#8aa0b8" stroke-width="3">
      <line x1="0" y1="-42" x2="0" y2="-52"/><line x1="0" y1="42" x2="0" y2="52"/>
      <line x1="-42" y1="0" x2="-52" y2="0"/><line x1="42" y1="0" x2="52" y2="0"/>
      <line x1="-30" y1="-30" x2="-37" y2="-37"/><line x1="30" y1="30" x2="37" y2="37"/>
      <line x1="30" y1="-30" x2="37" y2="-37"/><line x1="-30" y1="30" x2="-37" y2="37"/>
    </g>
    <text x="0" y="5" text-anchor="middle" fill="#a0b4c8" font-family="ui-monospace, monospace" font-size="11">PATCH</text>
  </g>
  <g transform="translate(880,520)" opacity="0.85">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#5a7088" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#3a4a60" stroke-width="1.5"/>
    <g stroke="#8aa0b8" stroke-width="2.5">
      <line x1="0" y1="-30" x2="0" y2="-38"/><line x1="0" y1="30" x2="0" y2="38"/>
      <line x1="-30" y1="0" x2="-38" y2="0"/><line x1="30" y1="0" x2="38" y2="0"/>
    </g>
    <text x="0" y="4" text-anchor="middle" fill="#a0b4c8" font-family="ui-monospace, monospace" font-size="9">RSR</text>
  </g>
  <g transform="translate(1000,500)" opacity="0.8">
    <circle cx="0" cy="0" r="36" fill="none" stroke="#5a7088" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#3a4a60" stroke-width="1.5"/>
    <g stroke="#8aa0b8" stroke-width="2.5">
      <line x1="0" y1="-36" x2="0" y2="-44"/><line x1="0" y1="36" x2="0" y2="44"/>
      <line x1="-36" y1="0" x2="-44" y2="0"/><line x1="36" y1="0" x2="44" y2="0"/>
      <line x1="-25" y1="-25" x2="-31" y2="-31"/><line x1="25" y1="25" x2="31" y2="31"/>
    </g>
    <text x="0" y="4" text-anchor="middle" fill="#a0b4c8" font-family="ui-monospace, monospace" font-size="10">DDM</text>
  </g>

  <text x="902" y="585" text-anchor="middle" fill="#6a8098" font-family="Georgia, serif" font-size="14" font-style="italic">name the ghost days</text>

  <!-- bridge title -->
  <text x="600" y="40" text-anchor="middle" fill="#d8e0ec" font-family="Georgia, serif" font-size="22" letter-spacing="1">ELEVEN GHOST DAYS · LEGISLATED ABSENCE</text>
  <text x="600" y="695" text-anchor="middle" fill="#5a7088" font-family="Georgia, serif" font-size="13">Cortex Dream Cycle · 2026-09-14 · absence is a shape that keeps moving</text>
</svg>
