<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Six Moons of Saturn: Titan weather, Enceladus geysers, Mimas secret ocean, quiet siblings under one ringed gravity">
  <defs>
    <linearGradient id="void" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050412"/>
      <stop offset="55%" stop-color="#100e28"/>
      <stop offset="100%" stop-color="#1a1420"/>
    </linearGradient>
    <radialGradient id="saturnGlow" cx="50%" cy="52%" r="48%">
      <stop offset="0%" stop-color="#f0c878" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#c88840" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#050412" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonWarm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6d8"/>
      <stop offset="45%" stop-color="#e0b060"/>
      <stop offset="100%" stop-color="#a06020" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonIce" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0f8ff"/>
      <stop offset="40%" stop-color="#a8d0f0"/>
      <stop offset="100%" stop-color="#406890" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonScar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8e0d0"/>
      <stop offset="50%" stop-color="#908070"/>
      <stop offset="100%" stop-color="#403830" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0d090" stop-opacity="0.15"/>
      <stop offset="35%" stop-color="#f8e0a8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#fff4c8" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#f8e0a8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f0d090" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="geyser" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#a8e8ff" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#70c0ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4080c0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titanHaze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb060" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c06020" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- void -->
  <rect width="960" height="540" fill="url(#void)"/>
  <!-- stars -->
  <g fill="#e8e8ff" opacity="0.7">
    <circle cx="48" cy="42" r="1.1"/><circle cx="120" cy="88" r="0.8"/>
    <circle cx="200" cy="36" r="1.3"/><circle cx="280" cy="70" r="0.7"/>
    <circle cx="360" cy="28" r="1.0"/><circle cx="440" cy="95" r="0.9"/>
    <circle cx="520" cy="40" r="1.2"/><circle cx="600" cy="78" r="0.7"/>
    <circle cx="680" cy="32" r="1.1"/><circle cx="760" cy="90" r="0.8"/>
    <circle cx="840" cy="48" r="1.0"/><circle cx="910" cy="72" r="0.9"/>
    <circle cx="70" cy="480" r="0.8"/><circle cx="160" cy="510" r="1.0"/>
    <circle cx="300" cy="495" r="0.7"/><circle cx="720" cy="505" r="0.9"/>
    <circle cx="880" cy="470" r="1.1"/><circle cx="950" cy="500" r="0.7"/>
  </g>

  <ellipse cx="480" cy="300" rx="320" ry="200" fill="url(#saturnGlow)" filter="url(#glow)"/>

  <!-- rings (behind planet left/right, in front bottom arc) -->
  <ellipse cx="480" cy="300" rx="290" ry="72" fill="none" stroke="url(#ringGold)" stroke-width="18" opacity="0.35"/>
  <ellipse cx="480" cy="300" rx="250" ry="62" fill="none" stroke="url(#ringGold)" stroke-width="10" opacity="0.55"/>
  <ellipse cx="480" cy="300" rx="220" ry="54" fill="none" stroke="url(#ringGold)" stroke-width="6" opacity="0.7"/>

  <!-- Saturn body -->
  <circle cx="480" cy="300" r="88" fill="#c88840"/>
  <ellipse cx="480" cy="278" rx="86" ry="22" fill="#e0a858" opacity="0.45"/>
  <ellipse cx="480" cy="300" rx="86" ry="18" fill="#a86830" opacity="0.35"/>
  <ellipse cx="480" cy="322" rx="82" ry="16" fill="#f0c878" opacity="0.25"/>
  <circle cx="480" cy="300" r="88" fill="none" stroke="#f8d898" stroke-width="1.5" opacity="0.4"/>

  <!-- front ring arc -->
  <path d="M190,300 A290,72 0 0,0 770,300" fill="none" stroke="url(#ringGold)" stroke-width="14" opacity="0.9"/>
  <path d="M230,300 A250,62 0 0,0 730,300" fill="none" stroke="url(#ringGold)" stroke-width="7" opacity="0.75"/>

  <!-- six moons -->
  <!-- Titan - largest, hazy orange -->
  <g transform="translate(170,175)">
    <circle cx="0" cy="0" r="34" fill="url(#moonWarm)" filter="url(#soft)"/>
    <circle cx="0" cy="0" r="26" fill="#d88840"/>
    <ellipse cx="0" cy="-4" rx="24" ry="14" fill="url(#titanHaze)"/>
    <ellipse cx="-6" cy="8" rx="10" ry="5" fill="#406080" opacity="0.55"/>
    <ellipse cx="8" cy="12" rx="7" ry="3.5" fill="#305070" opacity="0.45"/>
    <text x="0" y="48" text-anchor="middle" fill="#f0d0a0" font-family="Georgia, serif" font-size="13">Titan</text>
    <text x="0" y="64" text-anchor="middle" fill="#a89070" font-family="Georgia, serif" font-size="10">weather lakes</text>
  </g>

  <!-- Enceladus - ice + geyser -->
  <g transform="translate(300,120)">
    <rect x="-4" y="-48" width="8" height="42" fill="url(#geyser)" filter="url(#soft)"/>
    <circle cx="0" cy="0" r="18" fill="url(#moonIce)" filter="url(#soft)"/>
    <circle cx="0" cy="0" r="14" fill="#d8f0ff"/>
    <path d="M-6,6 Q0,2 6,8" fill="none" stroke="#70a0c0" stroke-width="1.2"/>
    <path d="M-4,-2 Q2,-6 5,2" fill="none" stroke="#90c0e0" stroke-width="1"/>
    <text x="0" y="36" text-anchor="middle" fill="#c0e0f8" font-family="Georgia, serif" font-size="13">Enceladus</text>
    <text x="0" y="52" text-anchor="middle" fill="#7898b0" font-family="Georgia, serif" font-size="10">geysers off-world</text>
  </g>

  <!-- Mimas - cratered Death Star -->
  <g transform="translate(660,130)">
    <circle cx="0" cy="0" r="20" fill="url(#moonScar)" filter="url(#soft)"/>
    <circle cx="0" cy="0" r="16" fill="#b0a090"/>
    <circle cx="-4" cy="-3" r="7" fill="#706050"/>
    <circle cx="-4" cy="-3" r="3.5" fill="#403830"/>
    <circle cx="8" cy="6" r="3" fill="#807060" opacity="0.8"/>
    <circle cx="5" cy="-8" r="2" fill="#807060" opacity="0.7"/>
    <circle cx="-9" cy="8" r="2.5" fill="#706050" opacity="0.75"/>
    <!-- secret ocean hint -->
    <circle cx="0" cy="2" r="5" fill="#4080c0" opacity="0.25" filter="url(#soft)"/>
    <text x="0" y="40" text-anchor="middle" fill="#d0c0a8" font-family="Georgia, serif" font-size="13">Mimas</text>
    <text x="0" y="56" text-anchor="middle" fill="#908070" font-family="Georgia, serif" font-size="10">secret ocean?</text>
  </g>

  <!-- Tethys -->
  <g transform="translate(780,220)">
    <circle cx="0" cy="0" r="15" fill="url(#moonIce)" filter="url(#soft)"/>
    <circle cx="0" cy="0" r="11" fill="#c8dce8"/>
    <text x="0" y="32" text-anchor="middle" fill="#a8c0d0" font-family="Georgia, serif" font-size="12">Tethys</text>
  </g>

  <!-- Dione -->
  <g transform="translate(750,360)">
    <circle cx="0" cy="0" r="14" fill="url(#moonIce)" filter="url(#soft)"/>
    <circle cx="0" cy="0" r="10" fill="#b8d0e0"/>
    <text x="0" y="30" text-anchor="middle" fill="#98b0c0" font-family="Georgia, serif" font-size="12">Dione</text>
  </g>

  <!-- Rhea -->
  <g transform="translate(200,380)">
    <circle cx="0" cy="0" r="16" fill="url(#moonScar)" filter="url(#soft)"/>
    <circle cx="0" cy="0" r="12" fill="#c0b8a8"/>
    <text x="0" y="34" text-anchor="middle" fill="#b0a890" font-family="Georgia, serif" font-size="12">Rhea</text>
  </g>

  <!-- title -->
  <text x="480" y="42" text-anchor="middle" fill="#f8e8c0" font-family="Georgia, serif" font-size="26" font-weight="bold">Six Moons · One Gravity</text>
  <text x="480" y="68" text-anchor="middle" fill="#a89070" font-family="Georgia, serif" font-size="14">ring-system taxonomy · name the atmosphere before the policy</text>
  <text x="480" y="520" text-anchor="middle" fill="#706050" font-family="Georgia, serif" font-size="12">293 moons and counting · don’t write one rule for the whole ring</text>
</svg>
