<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Zeppelin rigid keel dream: aluminium airship over Lake Constance">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1a2b"/>
      <stop offset="55%" stop-color="#16324f"/>
      <stop offset="100%" stop-color="#1c3d3a"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a4a55" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0d2430"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9d6e2"/>
      <stop offset="45%" stop-color="#8fa3b5"/>
      <stop offset="100%" stop-color="#5c6f80"/>
    </linearGradient>
    <linearGradient id="alum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8eef4"/>
      <stop offset="50%" stop-color="#a8b8c8"/>
      <stop offset="100%" stop-color="#d5dee8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- sky -->
  <rect width="1200" height="720" fill="url(#sky)"/>
  <!-- faint stars -->
  <g fill="#d7e6ff" opacity="0.55">
    <circle cx="90" cy="70" r="1.4"/>
    <circle cx="180" cy="120" r="1.1"/>
    <circle cx="260" cy="48" r="1.3"/>
    <circle cx="980" cy="90" r="1.5"/>
    <circle cx="1080" cy="140" r="1.1"/>
    <circle cx="880" cy="40" r="1.2"/>
    <circle cx="520" cy="60" r="1.0"/>
    <circle cx="700" cy="100" r="1.3"/>
  </g>

  <!-- distant hills -->
  <path d="M0 470 C180 430 320 500 480 455 C640 410 780 490 960 450 C1080 425 1160 460 1200 445 L1200 720 L0 720 Z" fill="#12283a" opacity="0.85"/>

  <!-- lake -->
  <path d="M0 520 C200 500 400 545 600 515 C800 485 1000 540 1200 510 L1200 720 L0 720 Z" fill="url(#lake)"/>
  <path d="M40 560 Q300 540 560 565 T1100 555" fill="none" stroke="#7ec8c4" stroke-width="1.2" opacity="0.35"/>
  <path d="M120 600 Q420 580 700 605 T1120 590" fill="none" stroke="#9ad4cf" stroke-width="0.9" opacity="0.25"/>

  <!-- patent ink blot / seal -->
  <g transform="translate(980,120)">
    <circle cx="0" cy="0" r="54" fill="#1a120c" opacity="0.55"/>
    <circle cx="0" cy="0" r="46" fill="none" stroke="#c4a574" stroke-width="2"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#c4a574" stroke-width="1" stroke-dasharray="3 4"/>
    <text x="0" y="-4" text-anchor="middle" fill="#e8d5b0" font-family="Georgia, serif" font-size="11">621,195</text>
    <text x="0" y="14" text-anchor="middle" fill="#c4a574" font-family="Georgia, serif" font-size="9">31 Aug 1895</text>
  </g>

  <!-- airship body -->
  <g transform="translate(160,210)">
    <!-- main hull ellipse -->
    <ellipse cx="420" cy="120" rx="380" ry="95" fill="url(#hull)" opacity="0.95"/>
    <!-- aluminium rib lattice -->
    <g stroke="url(#alum)" stroke-width="2.2" fill="none" opacity="0.95">
      <ellipse cx="420" cy="120" rx="372" ry="88"/>
      <!-- longitudinal spars -->
      <path d="M60 120 H780"/>
      <path d="M80 80 Q420 55 760 80"/>
      <path d="M80 160 Q420 185 760 160"/>
      <!-- ring frames -->
      <ellipse cx="140" cy="120" rx="18" ry="78"/>
      <ellipse cx="230" cy="120" rx="22" ry="86"/>
      <ellipse cx="330" cy="120" rx="24" ry="90"/>
      <ellipse cx="420" cy="120" rx="26" ry="92"/>
      <ellipse cx="510" cy="120" rx="24" ry="90"/>
      <ellipse cx="610" cy="120" rx="22" ry="86"/>
      <ellipse cx="700" cy="120" rx="18" ry="78"/>
    </g>
    <!-- hydrogen cells glow -->
    <g fill="#7ad7c8" opacity="0.18" filter="url(#soft)">
      <ellipse cx="230" cy="120" rx="40" ry="55"/>
      <ellipse cx="330" cy="120" rx="45" ry="60"/>
      <ellipse cx="420" cy="120" rx="48" ry="62"/>
      <ellipse cx="510" cy="120" rx="45" ry="60"/>
      <ellipse cx="610" cy="120" rx="40" ry="55"/>
    </g>
    <!-- nose cone -->
    <path d="M40 120 Q55 70 95 85 Q70 120 95 155 Q55 170 40 120 Z" fill="#b7c5d2"/>
    <!-- tail fins -->
    <path d="M760 120 L840 70 L825 120 L840 170 Z" fill="#9aabba" stroke="#dbe6ef" stroke-width="1.5"/>
    <path d="M740 95 L820 40 L800 95 Z" fill="#8496a6"/>
    <path d="M740 145 L820 200 L800 145 Z" fill="#8496a6"/>

    <!-- gondola -->
    <g transform="translate(360,210)">
      <rect x="0" y="0" width="130" height="42" rx="6" fill="#2a2218" stroke="#c4a574" stroke-width="1.5"/>
      <rect x="10" y="8" width="28" height="18" rx="2" fill="#7ec8c4" opacity="0.55"/>
      <rect x="48" y="8" width="28" height="18" rx="2" fill="#7ec8c4" opacity="0.45"/>
      <rect x="86" y="8" width="28" height="18" rx="2" fill="#7ec8c4" opacity="0.35"/>
      <text x="65" y="36" text-anchor="middle" fill="#e8d5b0" font-family="ui-monospace, Menlo, monospace" font-size="9">arXiv → NotebookLM</text>
      <!-- boarding pass missing badge -->
      <g transform="translate(138,-8)">
        <rect x="0" y="0" width="86" height="22" rx="4" fill="#5a1e1e" stroke="#e08a8a" stroke-width="1"/>
        <text x="43" y="15" text-anchor="middle" fill="#ffd0d0" font-family="ui-monospace, Menlo, monospace" font-size="9">AUTH WAIT</text>
      </g>
    </g>

    <!-- props -->
    <g transform="translate(300,250)">
      <circle cx="0" cy="0" r="6" fill="#dbe6ef"/>
      <g stroke="#c9d6e2" stroke-width="3" opacity="0.85">
        <line x1="-22" y1="0" x2="22" y2="0"/>
        <line x1="0" y1="-22" x2="0" y2="22" transform="rotate(25)"/>
      </g>
    </g>
    <g transform="translate(550,250)">
      <circle cx="0" cy="0" r="6" fill="#dbe6ef"/>
      <g stroke="#c9d6e2" stroke-width="3" opacity="0.85">
        <line x1="-22" y1="0" x2="22" y2="0"/>
        <line x1="0" y1="-22" x2="0" y2="22" transform="rotate(-20)"/>
      </g>
    </g>

    <!-- keel highlight line -->
    <path d="M90 175 Q420 200 750 175" fill="none" stroke="#f0c674" stroke-width="3" opacity="0.85"/>
    <text x="420" y="208" text-anchor="middle" fill="#f0c674" font-family="Georgia, serif" font-size="13" opacity="0.9">aluminium keel</text>
  </g>

  <!-- shore crates / demand without GTM -->
  <g transform="translate(70,560)">
    <rect x="0" y="0" width="48" height="36" fill="#3a2f22" stroke="#c4a574" stroke-width="1"/>
    <rect x="54" y="-8" width="48" height="44" fill="#2f3a2a" stroke="#8fba8a" stroke-width="1"/>
    <rect x="108" y="4" width="48" height="32" fill="#2a3340" stroke="#7aa0c4" stroke-width="1"/>
    <text x="78" y="-18" text-anchor="middle" fill="#d7e6ff" font-family="ui-monospace, Menlo, monospace" font-size="11">mini / Studio demand</text>
    <text x="78" y="58" text-anchor="middle" fill="#e08a8a" font-family="ui-monospace, Menlo, monospace" font-size="10">PCC NO-SALE · DGX DRIFT</text>
  </g>

  <!-- title plate -->
  <g transform="translate(40,40)">
    <rect x="0" y="0" width="420" height="78" rx="8" fill="#0a1420" opacity="0.72" stroke="#5c7a94" stroke-width="1"/>
    <text x="20" y="32" fill="#e8eef4" font-family="Georgia, serif" font-size="26">Zeppelin Rigid Keel</text>
    <text x="20" y="58" fill="#9ab0c4" font-family="ui-monospace, Menlo, monospace" font-size="13">31 Aug 1895 · gas needs bones · steer the sky</text>
  </g>

  <!-- ember strip -->
  <text x="600" y="690" text-anchor="middle" fill="#c4d0dc" font-family="Georgia, serif" font-size="14" opacity="0.85">Name the aluminium frame, not just the hydrogen.</text>
</svg>
