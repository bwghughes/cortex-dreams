<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Water Music Barge Dream — lantern-lit royal barge on the Thames at night; floating notes; Wrong Way biplane silhouette; vault lock on the stern">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060a18"/>
      <stop offset="45%" stop-color="#0c1530"/>
      <stop offset="100%" stop-color="#1a1428"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a2038"/>
      <stop offset="40%" stop-color="#0e2a42"/>
      <stop offset="100%" stop-color="#061018"/>
    </linearGradient>
    <linearGradient id="barge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="55%" stop-color="#24180e"/>
      <stop offset="100%" stop-color="#120c08"/>
    </linearGradient>
    <linearGradient id="lantern" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff2b0"/>
      <stop offset="50%" stop-color="#ffc04a"/>
      <stop offset="100%" stop-color="#d87818"/>
    </linearGradient>
    <linearGradient id="noteGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff6d0"/>
      <stop offset="50%" stop-color="#ffd36a"/>
      <stop offset="100%" stop-color="#c88820"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a8c4e0" stop-opacity="0"/>
      <stop offset="40%" stop-color="#a8c4e0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#a8c4e0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd070" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#ff9a30" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff9a30" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="blur8" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- sky -->
  <rect width="960" height="540" fill="url(#sky)"/>
  <!-- faint stars -->
  <g fill="#d8e8ff" opacity="0.55">
    <circle cx="80" cy="40" r="1.2"/>
    <circle cx="160" cy="70" r="0.9"/>
    <circle cx="240" cy="30" r="1.1"/>
    <circle cx="320" cy="90" r="0.8"/>
    <circle cx="420" cy="45" r="1.3"/>
    <circle cx="520" cy="25" r="0.9"/>
    <circle cx="620" cy="65" r="1.1"/>
    <circle cx="720" cy="35" r="0.8"/>
    <circle cx="820" cy="80" r="1.2"/>
    <circle cx="900" cy="50" r="0.9"/>
    <circle cx="100" cy="120" r="0.7"/>
    <circle cx="880" cy="110" r="0.8"/>
  </g>

  <!-- distant bank silhouette -->
  <path d="M0 250 C80 240 140 255 220 248 C300 240 360 255 440 246 C520 238 580 252 660 245 C740 238 800 250 880 242 L960 248 L960 300 L0 300 Z" fill="#0a101c" opacity="0.85"/>
  <!-- Westminster-ish spires -->
  <g fill="#080e18" opacity="0.9">
    <rect x="620" y="175" width="18" height="75"/>
    <polygon points="629,145 615,175 643,175"/>
    <rect x="655" y="195" width="12" height="55"/>
    <polygon points="661,170 652,195 670,195"/>
    <rect x="580" y="210" width="30" height="40"/>
    <rect x="700" y="205" width="40" height="45"/>
  </g>

  <!-- moon -->
  <circle cx="860" cy="90" r="28" fill="#e8f0ff" opacity="0.9"/>
  <circle cx="868" cy="84" r="22" fill="#0c1530" opacity="0.35"/>

  <!-- river body -->
  <rect y="300" width="960" height="240" fill="url(#river)"/>
  <!-- ripples -->
  <g stroke="#4a7a9a" stroke-width="1" fill="none" opacity="0.25">
    <path d="M0 340 Q120 330 240 345 T480 340 T720 350 T960 340"/>
    <path d="M0 380 Q100 370 220 385 T460 378 T700 390 T960 380"/>
    <path d="M0 430 Q140 420 280 435 T560 428 T840 440 T960 430"/>
    <path d="M0 480 Q160 470 320 485 T640 478 T960 490"/>
  </g>
  <!-- mist bands -->
  <ellipse cx="200" cy="320" rx="180" ry="18" fill="url(#mist)"/>
  <ellipse cx="700" cy="335" rx="220" ry="20" fill="url(#mist)"/>

  <!-- lantern glows reflected in water -->
  <ellipse cx="380" cy="430" rx="90" ry="18" fill="#ffb040" opacity="0.12" filter="url(#blur8)"/>
  <ellipse cx="500" cy="445" rx="70" ry="14" fill="#ffb040" opacity="0.1" filter="url(#blur8)"/>
  <ellipse cx="300" cy="450" rx="50" ry="12" fill="#ffb040" opacity="0.08" filter="url(#blur8)"/>

  <!-- floating musical notes (gold tokens) -->
  <g filter="url(#soft)">
    <g fill="url(#noteGold)" opacity="0.92">
      <!-- note heads + stems -->
      <ellipse cx="160" cy="360" rx="9" ry="7" transform="rotate(-20 160 360)"/>
      <rect x="167" y="320" width="2.5" height="42" fill="#ffd36a"/>
      <ellipse cx="230" cy="400" rx="8" ry="6" transform="rotate(-15 230 400)"/>
      <rect x="236" y="365" width="2.2" height="36" fill="#ffd36a"/>
      <ellipse cx="680" cy="370" rx="9" ry="7" transform="rotate(18 680 370)"/>
      <rect x="671" y="332" width="2.5" height="40" fill="#ffd36a"/>
      <ellipse cx="760" cy="410" rx="8" ry="6" transform="rotate(12 760 410)"/>
      <rect x="752" y="375" width="2.2" height="36" fill="#ffd36a"/>
      <ellipse cx="820" cy="350" rx="7" ry="5.5" transform="rotate(-10 820 350)"/>
      <rect x="825" y="318" width="2" height="34" fill="#ffd36a"/>
      <ellipse cx="110" cy="420" rx="7" ry="5.5" transform="rotate(25 110 420)"/>
      <rect x="115" y="388" width="2" height="32" fill="#ffd36a"/>
    </g>
    <!-- tiny beam notes -->
    <g stroke="#ffd36a" stroke-width="2" fill="none" opacity="0.7">
      <path d="M169 325 L190 318"/>
      <path d="M238 370 L255 364"/>
    </g>
  </g>

  <!-- THE BARGE -->
  <g transform="translate(200 300)">
    <!-- hull -->
    <path d="M40 90 C60 120 100 135 280 135 C460 135 500 120 520 90 L500 70 C480 85 440 95 280 95 C120 95 80 85 60 70 Z" fill="url(#barge)"/>
    <!-- deck -->
    <path d="M70 70 C90 82 140 90 280 90 C420 90 470 82 490 70 L470 55 C450 65 400 72 280 72 C160 72 110 65 90 55 Z" fill="#4a3420"/>
    <!-- gunwales -->
    <path d="M70 70 C90 82 140 90 280 90 C420 90 470 82 490 70" fill="none" stroke="#6a4a28" stroke-width="3"/>
    <!-- cabin / canopy poles -->
    <rect x="150" y="20" width="4" height="50" fill="#2a1c10"/>
    <rect x="250" y="18" width="4" height="52" fill="#2a1c10"/>
    <rect x="350" y="20" width="4" height="50" fill="#2a1c10"/>
    <path d="M145 22 Q280 0 355 22" fill="none" stroke="#c9a060" stroke-width="3" opacity="0.85"/>
    <!-- canopy cloth -->
    <path d="M148 24 Q280 6 352 24 L348 38 Q280 22 152 38 Z" fill="#8a6030" opacity="0.45"/>

    <!-- musicians as dark upright silhouettes -->
    <g fill="#0a0806" opacity="0.9">
      <ellipse cx="130" cy="58" rx="7" ry="5"/>
      <rect x="125" y="58" width="10" height="18" rx="2"/>
      <ellipse cx="165" cy="55" rx="7" ry="5"/>
      <rect x="160" y="55" width="10" height="20" rx="2"/>
      <ellipse cx="200" cy="56" rx="7" ry="5"/>
      <rect x="195" y="56" width="10" height="19" rx="2"/>
      <ellipse cx="235" cy="54" rx="7" ry="5"/>
      <rect x="230" y="54" width="10" height="21" rx="2"/>
      <ellipse cx="270" cy="55" rx="7" ry="5"/>
      <rect x="265" y="55" width="10" height="20" rx="2"/>
      <ellipse cx="305" cy="56" rx="7" ry="5"/>
      <rect x="300" y="56" width="10" height="19" rx="2"/>
      <ellipse cx="340" cy="55" rx="7" ry="5"/>
      <rect x="335" y="55" width="10" height="20" rx="2"/>
      <ellipse cx="375" cy="57" rx="7" ry="5"/>
      <rect x="370" y="57" width="10" height="18" rx="2"/>
      <ellipse cx="410" cy="56" rx="7" ry="5"/>
      <rect x="405" y="56" width="10" height="19" rx="2"/>
      <!-- a few more denser mid-cluster -->
      <ellipse cx="185" cy="60" rx="5" ry="4"/>
      <rect x="181" y="60" width="8" height="14" rx="2"/>
      <ellipse cx="290" cy="61" rx="5" ry="4"/>
      <rect x="286" y="61" width="8" height="14" rx="2"/>
      <ellipse cx="320" cy="60" rx="5" ry="4"/>
      <rect x="316" y="60" width="8" height="14" rx="2"/>
    </g>

    <!-- instruments hints (horns) -->
    <g stroke="#d4a050" stroke-width="2" fill="none" opacity="0.75">
      <path d="M140 50 Q155 42 170 50"/>
      <path d="M250 48 Q265 40 280 48"/>
      <path d="M360 50 Q375 42 390 50"/>
    </g>

    <!-- lanterns -->
    <g filter="url(#soft)">
      <circle cx="120" cy="42" r="22" fill="url(#glow)"/>
      <circle cx="120" cy="42" r="7" fill="url(#lantern)"/>
      <rect x="117" y="28" width="6" height="10" fill="#3a2818"/>
      <circle cx="280" cy="30" r="26" fill="url(#glow)"/>
      <circle cx="280" cy="30" r="8" fill="url(#lantern)"/>
      <rect x="277" y="14" width="6" height="12" fill="#3a2818"/>
      <circle cx="440" cy="42" r="22" fill="url(#glow)"/>
      <circle cx="440" cy="42" r="7" fill="url(#lantern)"/>
      <rect x="437" y="28" width="6" height="10" fill="#3a2818"/>
    </g>

    <!-- vault lock / secret seal on stern -->
    <g transform="translate(470 78)">
      <circle cx="0" cy="0" r="14" fill="#1a1410" stroke="#d4a050" stroke-width="2"/>
      <rect x="-5" y="-2" width="10" height="8" rx="1.5" fill="#d4a050"/>
      <circle cx="0" cy="-5" r="4" fill="none" stroke="#d4a050" stroke-width="2"/>
      <circle cx="0" cy="2" r="1.5" fill="#1a1410"/>
    </g>

    <!-- bow lantern reflection line -->
    <path d="M280 95 L280 130" stroke="#ffc04a" stroke-width="1.5" opacity="0.25"/>
  </g>

  <!-- Wrong Way Corrigan biplane (flying reverse / leftward) -->
  <g transform="translate(780 140) scale(-1,1)" opacity="0.85" filter="url(#soft)">
    <ellipse cx="0" cy="0" rx="28" ry="5" fill="#c8d4e8"/>
    <rect x="-6" y="-8" width="18" height="6" rx="1" fill="#a8b8d0"/>
    <ellipse cx="20" cy="-2" rx="8" ry="3" fill="#d0dce8"/>
    <rect x="-2" y="-14" width="3" height="12" fill="#90a0b8"/>
    <ellipse cx="-2" cy="-16" rx="12" ry="2.5" fill="#c8d4e8"/>
    <!-- prop arc -->
    <path d="M30 -8 Q38 0 30 8" fill="none" stroke="#e0e8f0" stroke-width="1.5" opacity="0.7"/>
    <!-- tiny trail -->
    <path d="M-30 2 Q-50 6 -70 0" fill="none" stroke="#a8c0e0" stroke-width="1" opacity="0.4" stroke-dasharray="3 4"/>
  </g>

  <!-- title plate -->
  <g transform="translate(36 470)">
    <rect x="0" y="0" width="360" height="48" rx="8" fill="#0a101c" opacity="0.72"/>
    <text x="18" y="22" fill="#ffd36a" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="bold">Water Music Barge Dream</text>
    <text x="18" y="38" fill="#a8c4e0" font-family="Georgia, 'Times New Roman', serif" font-size="11">keep the musicians on the barge · secrets off the score</text>
  </g>

  <!-- date seal -->
  <g transform="translate(820 470)">
    <rect x="0" y="0" width="110" height="48" rx="8" fill="#0a101c" opacity="0.72"/>
    <text x="16" y="22" fill="#c8d4e8" font-family="Georgia, 'Times New Roman', serif" font-size="13">17 July 1717</text>
    <text x="16" y="38" fill="#7a90a8" font-family="Georgia, 'Times New Roman', serif" font-size="11">Thames premiere</text>
  </g>
</svg>
