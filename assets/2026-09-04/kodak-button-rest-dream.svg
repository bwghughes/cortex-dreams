<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Kodak button rest dream: black box camera, shutter button, roll film ghosts, darkroom contract">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0f0a"/>
      <stop offset="45%" stop-color="#2a1810"/>
      <stop offset="100%" stop-color="#0d1a22"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c2c2e"/>
      <stop offset="55%" stop-color="#1a1a1c"/>
      <stop offset="100%" stop-color="#0e0e10"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8c878"/>
      <stop offset="50%" stop-color="#c9a04a"/>
      <stop offset="100%" stop-color="#8a6a28"/>
    </linearGradient>
    <linearGradient id="film" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a2a18"/>
      <stop offset="50%" stop-color="#5a4028"/>
      <stop offset="100%" stop-color="#2a1c10"/>
    </linearGradient>
    <linearGradient id="ghost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dffb0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2a6a48" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9fdfff" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#3a6a88" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0a1520" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="720" fill="url(#bg)"/>
  <!-- faint darkroom safelight wash -->
  <ellipse cx="980" cy="120" rx="220" ry="140" fill="#c45a2a" opacity="0.12"/>
  <ellipse cx="180" cy="560" rx="260" ry="160" fill="#1a4a3a" opacity="0.14"/>

  <!-- title strip -->
  <text x="60" y="58" fill="#e8dcc8" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="600">Kodak Button Rest</text>
  <text x="60" y="88" fill="#a89878" font-family="ui-monospace, Menlo, monospace" font-size="14">4 September 1888 · You press the button, we do the rest</text>

  <!-- black box camera body -->
  <g transform="translate(340,170)">
    <rect x="0" y="40" width="420" height="300" rx="18" fill="url(#box)" stroke="#4a4a4e" stroke-width="2"/>
    <!-- leather texture lines -->
    <g stroke="#333338" stroke-width="1" opacity="0.45">
      <line x1="24" y1="70" x2="396" y2="70"/>
      <line x1="24" y1="110" x2="396" y2="110"/>
      <line x1="24" y1="280" x2="396" y2="280"/>
    </g>
    <!-- top plate -->
    <rect x="30" y="0" width="360" height="48" rx="8" fill="#222226" stroke="#555" stroke-width="1.5"/>
    <!-- wind knob -->
    <circle cx="70" cy="24" r="16" fill="url(#brass)" stroke="#6a5020" stroke-width="1"/>
    <circle cx="70" cy="24" r="6" fill="#2a2010"/>
    <text x="98" y="28" fill="#b8a888" font-family="ui-monospace, Menlo, monospace" font-size="11">WIND</text>
    <!-- viewfinder bump -->
    <rect x="170" y="8" width="80" height="28" rx="4" fill="#121214" stroke="#666" stroke-width="1"/>
    <rect x="186" y="14" width="48" height="16" rx="2" fill="#0a2030" stroke="#3a6a88" stroke-width="1"/>

    <!-- lens barrel -->
    <circle cx="210" cy="190" r="92" fill="url(#lensGlow)"/>
    <circle cx="210" cy="190" r="78" fill="#0c0c10" stroke="#6a6a70" stroke-width="3"/>
    <circle cx="210" cy="190" r="62" fill="#101820" stroke="#8ab0c8" stroke-width="2"/>
    <circle cx="210" cy="190" r="44" fill="#061018" stroke="#c9e8ff" stroke-width="1.5" opacity="0.9"/>
    <circle cx="210" cy="190" r="18" fill="#03080c" stroke="#e8f6ff" stroke-width="1"/>
    <!-- lens glint -->
    <ellipse cx="190" cy="168" rx="14" ry="8" fill="#dff6ff" opacity="0.35" transform="rotate(-25 190 168)"/>

    <!-- THE BUTTON -->
    <g filter="url(#glow)">
      <circle cx="360" cy="120" r="34" fill="#1a0808" stroke="#e8a050" stroke-width="3"/>
      <circle cx="360" cy="120" r="24" fill="#c03028" stroke="#ffd0a0" stroke-width="2"/>
      <circle cx="360" cy="112" r="8" fill="#ff8a70" opacity="0.55"/>
    </g>
    <text x="360" y="176" text-anchor="middle" fill="#e8c898" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="700">PRESS</text>

    <!-- KODAK badge -->
    <rect x="140" y="300" width="140" height="28" rx="4" fill="#8a1a12" stroke="#c04030" stroke-width="1"/>
    <text x="210" y="320" text-anchor="middle" fill="#f0e0c8" font-family="Georgia, serif" font-size="16" font-weight="700" letter-spacing="3">KODAK</text>
  </g>

  <!-- film strip unspooling right -->
  <g transform="translate(780,210)">
    <rect x="0" y="40" width="320" height="110" rx="6" fill="url(#film)" stroke="#6a5030" stroke-width="2"/>
    <!-- sprocket holes -->
    <g fill="#0a0804">
      <rect x="12" y="48" width="10" height="14" rx="2"/><rect x="12" y="128" width="10" height="14" rx="2"/>
      <rect x="48" y="48" width="10" height="14" rx="2"/><rect x="48" y="128" width="10" height="14" rx="2"/>
      <rect x="84" y="48" width="10" height="14" rx="2"/><rect x="84" y="128" width="10" height="14" rx="2"/>
      <rect x="120" y="48" width="10" height="14" rx="2"/><rect x="120" y="128" width="10" height="14" rx="2"/>
      <rect x="156" y="48" width="10" height="14" rx="2"/><rect x="156" y="128" width="10" height="14" rx="2"/>
      <rect x="192" y="48" width="10" height="14" rx="2"/><rect x="192" y="128" width="10" height="14" rx="2"/>
      <rect x="228" y="48" width="10" height="14" rx="2"/><rect x="228" y="128" width="10" height="14" rx="2"/>
      <rect x="264" y="48" width="10" height="14" rx="2"/><rect x="264" y="128" width="10" height="14" rx="2"/>
      <rect x="298" y="48" width="10" height="14" rx="2"/><rect x="298" y="128" width="10" height="14" rx="2"/>
    </g>
    <!-- frame ghosts -->
    <g filter="url(#soft)">
      <rect x="28" y="68" width="52" height="54" rx="3" fill="url(#ghost)"/>
      <rect x="92" y="68" width="52" height="54" rx="3" fill="url(#ghost)" opacity="0.85"/>
      <rect x="156" y="68" width="52" height="54" rx="3" fill="url(#ghost)" opacity="0.7"/>
      <rect x="220" y="68" width="52" height="54" rx="3" fill="url(#ghost)" opacity="0.55"/>
      <rect x="278" y="68" width="28" height="54" rx="3" fill="url(#ghost)" opacity="0.35"/>
    </g>
    <text x="0" y="30" fill="#9a8868" font-family="ui-monospace, Menlo, monospace" font-size="12">FIRST ROLL · GHOST FRAMES</text>
  </g>

  <!-- darkroom contract card left -->
  <g transform="translate(60,420)">
    <rect x="0" y="0" width="320" height="220" rx="12" fill="#120e0a" stroke="#6a5030" stroke-width="1.5" opacity="0.95"/>
    <text x="20" y="36" fill="#e8c878" font-family="Georgia, serif" font-size="18">Darkroom contract</text>
    <text x="20" y="68" fill="#c8b898" font-family="ui-monospace, Menlo, monospace" font-size="13">YOU PRESS</text>
    <text x="20" y="92" fill="#7dffb0" font-family="ui-monospace, Menlo, monospace" font-size="13">→ shutter / production pin</text>
    <text x="20" y="124" fill="#c8b898" font-family="ui-monospace, Menlo, monospace" font-size="13">WE DO THE REST</text>
    <text x="20" y="148" fill="#7aa2c8" font-family="ui-monospace, Menlo, monospace" font-size="13">→ develop / allow-list / mTLS</text>
    <text x="20" y="180" fill="#a89878" font-family="ui-monospace, Menlo, monospace" font-size="12">Ollama GA · local pin · named chemistry</text>
    <text x="20" y="202" fill="#886848" font-family="ui-monospace, Menlo, monospace" font-size="11">remote lab can go dark · keep a local roll</text>
  </g>

  <!-- cancelled glass plates / foldables -->
  <g transform="translate(420,480)">
    <rect x="0" y="0" width="280" height="160" rx="10" fill="#1a1010" stroke="#8a4040" stroke-width="1.5" opacity="0.9"/>
    <text x="16" y="32" fill="#e88878" font-family="Georgia, serif" font-size="16">Cancelled glass plates</text>
    <text x="16" y="62" fill="#c8a0a0" font-family="ui-monospace, Menlo, monospace" font-size="12">foldable Mac concepts</text>
    <text x="16" y="86" fill="#c8a0a0" font-family="ui-monospace, Menlo, monospace" font-size="12">RC chemistry mid-exposure</text>
    <text x="16" y="110" fill="#c8a0a0" font-family="ui-monospace, Menlo, monospace" font-size="12">shard theater without contract</text>
    <text x="16" y="140" fill="#886060" font-family="ui-monospace, Menlo, monospace" font-size="11">ship the pocket camera instead</text>
  </g>

  <!-- multi-cloud outage stub -->
  <g transform="translate(740,480)">
    <rect x="0" y="0" width="380" height="160" rx="10" fill="#0a1218" stroke="#3a6a88" stroke-width="1.5" opacity="0.92"/>
    <text x="16" y="32" fill="#9fdfff" font-family="Georgia, serif" font-size="16">When the remote darkroom dies</text>
    <text x="16" y="64" fill="#a8c8d8" font-family="ui-monospace, Menlo, monospace" font-size="12">ChatGPT · Claude · Grok · 30+ min dark</text>
    <text x="16" y="92" fill="#7dffb0" font-family="ui-monospace, Menlo, monospace" font-size="13">local pin = film still in the camera</text>
    <text x="16" y="120" fill="#a89878" font-family="ui-monospace, Menlo, monospace" font-size="12">PAIR-class router = whole-request rest</text>
    <text x="16" y="144" fill="#6a8090" font-family="ui-monospace, Menlo, monospace" font-size="11">mTLS · not a miracle shard</text>
  </g>

  <!-- footer -->
  <text x="60" y="690" fill="#6a5a48" font-family="ui-monospace, Menlo, monospace" font-size="12">cortex dream cycle · 2026-09-04 · after Dagen H named the road, name the shutter</text>
</svg>
