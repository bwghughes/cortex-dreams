<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Chladni Sand Orchestra Dream</title>
  <desc id="desc">A dark metal plate bowed at the edge: sand flees the loud antinodes and settles on luminous nodal lines of stillness — silence as ink, the pattern a map of non-motion.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141820"/>
      <stop offset="55%" stop-color="#0c1016"/>
      <stop offset="100%" stop-color="#07090d"/>
    </linearGradient>
    <linearGradient id="plateMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a3340"/>
      <stop offset="45%" stop-color="#1a222c"/>
      <stop offset="100%" stop-color="#121820"/>
    </linearGradient>
    <radialGradient id="plateGlow" cx="50%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#d8c48a" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#8a7a4a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0c1016" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nodal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0e2a8" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#ffe9a0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f0e2a8" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="bowWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5a32"/>
      <stop offset="100%" stop-color="#4a2e18"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="grainBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>

  <!-- faint room light -->
  <ellipse cx="480" cy="250" rx="340" ry="220" fill="url(#plateGlow)"/>

  <!-- table shadow -->
  <ellipse cx="480" cy="455" rx="280" ry="28" fill="#000" opacity="0.45"/>

  <!-- square plate -->
  <g transform="translate(480 255)">
    <rect x="-210" y="-180" width="420" height="360" rx="8" fill="url(#plateMetal)" stroke="#3a4658" stroke-width="2"/>
    <rect x="-198" y="-168" width="396" height="336" rx="4" fill="#10161e" opacity="0.55"/>

    <!-- nodal lines m=3 n=2-ish geometry (silence ridges) -->
    <g filter="url(#glow)" stroke="url(#nodal)" stroke-width="3.2" fill="none" stroke-linecap="round">
      <!-- vertical thirds -->
      <path d="M -66 -160 Q -70 -40 -66 0 Q -62 40 -66 160" opacity="0.95"/>
      <path d="M 66 -160 Q 70 -40 66 0 Q 62 40 66 160" opacity="0.95"/>
      <!-- horizontal mid + curves -->
      <path d="M -190 0 Q -80 -8 0 0 Q 80 8 190 0" opacity="0.9"/>
      <path d="M -190 -72 Q -40 -88 0 -72 Q 40 -56 190 -72" opacity="0.75"/>
      <path d="M -190 72 Q -40 56 0 72 Q 40 88 190 72" opacity="0.75"/>
      <!-- diagonal quiet ridges -->
      <path d="M -160 -140 Q -20 -20 0 0 Q 20 20 160 140" opacity="0.55"/>
      <path d="M 160 -140 Q 20 -20 0 0 Q -20 20 -160 140" opacity="0.55"/>
      <!-- small center cross of stillness -->
      <circle cx="0" cy="0" r="18" stroke-width="2.4" opacity="0.7"/>
    </g>

    <!-- sand grains denser on nodal lines -->
    <g fill="#e8d9a0" filter="url(#grainBlur)">
      <!-- vertical left nodal sand -->
      <circle cx="-68" cy="-120" r="1.6" opacity="0.85"/><circle cx="-64" cy="-95" r="1.4" opacity="0.75"/>
      <circle cx="-70" cy="-70" r="1.7" opacity="0.9"/><circle cx="-63" cy="-45" r="1.3" opacity="0.7"/>
      <circle cx="-67" cy="-20" r="1.5" opacity="0.8"/><circle cx="-71" cy="5" r="1.6" opacity="0.85"/>
      <circle cx="-65" cy="30" r="1.4" opacity="0.75"/><circle cx="-69" cy="55" r="1.7" opacity="0.9"/>
      <circle cx="-64" cy="80" r="1.3" opacity="0.7"/><circle cx="-68" cy="105" r="1.5" opacity="0.8"/>
      <circle cx="-66" cy="130" r="1.6" opacity="0.85"/><circle cx="-70" cy="150" r="1.2" opacity="0.65"/>
      <!-- vertical right -->
      <circle cx="68" cy="-125" r="1.5" opacity="0.8"/><circle cx="64" cy="-100" r="1.6" opacity="0.85"/>
      <circle cx="70" cy="-75" r="1.3" opacity="0.7"/><circle cx="63" cy="-50" r="1.7" opacity="0.9"/>
      <circle cx="67" cy="-25" r="1.4" opacity="0.75"/><circle cx="71" cy="0" r="1.5" opacity="0.8"/>
      <circle cx="65" cy="25" r="1.6" opacity="0.85"/><circle cx="69" cy="50" r="1.3" opacity="0.7"/>
      <circle cx="64" cy="75" r="1.7" opacity="0.9"/><circle cx="68" cy="100" r="1.4" opacity="0.75"/>
      <circle cx="66" cy="125" r="1.5" opacity="0.8"/><circle cx="70" cy="148" r="1.2" opacity="0.65"/>
      <!-- horizontal mid sand -->
      <circle cx="-160" cy="-2" r="1.5" opacity="0.8"/><circle cx="-130" cy="3" r="1.4" opacity="0.75"/>
      <circle cx="-100" cy="-4" r="1.6" opacity="0.85"/><circle cx="-70" cy="2" r="1.3" opacity="0.7"/>
      <circle cx="-40" cy="-3" r="1.5" opacity="0.8"/><circle cx="-10" cy="1" r="1.7" opacity="0.9"/>
      <circle cx="20" cy="-2" r="1.4" opacity="0.75"/><circle cx="50" cy="3" r="1.5" opacity="0.8"/>
      <circle cx="80" cy="-1" r="1.6" opacity="0.85"/><circle cx="110" cy="2" r="1.3" opacity="0.7"/>
      <circle cx="140" cy="-3" r="1.5" opacity="0.8"/><circle cx="170" cy="1" r="1.4" opacity="0.75"/>
      <!-- upper/lower curves -->
      <circle cx="-140" cy="-78" r="1.4" opacity="0.7"/><circle cx="-90" cy="-82" r="1.5" opacity="0.8"/>
      <circle cx="-40" cy="-70" r="1.3" opacity="0.65"/><circle cx="10" cy="-74" r="1.6" opacity="0.85"/>
      <circle cx="60" cy="-68" r="1.4" opacity="0.7"/><circle cx="120" cy="-76" r="1.5" opacity="0.8"/>
      <circle cx="-140" cy="78" r="1.4" opacity="0.7"/><circle cx="-90" cy="70" r="1.5" opacity="0.8"/>
      <circle cx="-40" cy="76" r="1.3" opacity="0.65"/><circle cx="10" cy="72" r="1.6" opacity="0.85"/>
      <circle cx="60" cy="80" r="1.4" opacity="0.7"/><circle cx="120" cy="74" r="1.5" opacity="0.8"/>
      <!-- diagonals sparse -->
      <circle cx="-120" cy="-100" r="1.2" opacity="0.55"/><circle cx="-80" cy="-60" r="1.3" opacity="0.6"/>
      <circle cx="-30" cy="-20" r="1.2" opacity="0.5"/><circle cx="30" cy="20" r="1.3" opacity="0.6"/>
      <circle cx="80" cy="60" r="1.2" opacity="0.55"/><circle cx="120" cy="100" r="1.3" opacity="0.6"/>
      <circle cx="120" cy="-100" r="1.2" opacity="0.55"/><circle cx="80" cy="-60" r="1.3" opacity="0.6"/>
      <circle cx="30" cy="-20" r="1.2" opacity="0.5"/><circle cx="-30" cy="20" r="1.3" opacity="0.6"/>
      <circle cx="-80" cy="60" r="1.2" opacity="0.55"/><circle cx="-120" cy="100" r="1.3" opacity="0.6"/>
      <!-- center ring grains -->
      <circle cx="0" cy="-18" r="1.4" opacity="0.75"/><circle cx="14" cy="-10" r="1.3" opacity="0.7"/>
      <circle cx="18" cy="4" r="1.5" opacity="0.8"/><circle cx="10" cy="16" r="1.2" opacity="0.65"/>
      <circle cx="-6" cy="18" r="1.4" opacity="0.75"/><circle cx="-16" cy="8" r="1.3" opacity="0.7"/>
      <circle cx="-18" cy="-6" r="1.5" opacity="0.8"/><circle cx="-8" cy="-16" r="1.2" opacity="0.65"/>
    </g>

    <!-- sparse fleeing grains in antinodes (fainter, mid-cells) -->
    <g fill="#c8b878" opacity="0.28">
      <circle cx="-130" cy="-120" r="1.1"/><circle cx="-110" cy="-40" r="1"/><circle cx="-150" cy="40" r="1.1"/>
      <circle cx="-120" cy="120" r="1"/><circle cx="0" cy="-120" r="1.1"/><circle cx="0" cy="120" r="1"/>
      <circle cx="130" cy="-120" r="1.1"/><circle cx="110" cy="-40" r="1"/><circle cx="150" cy="40" r="1.1"/>
      <circle cx="120" cy="120" r="1"/><circle cx="-40" cy="-40" r="0.9"/><circle cx="40" cy="40" r="0.9"/>
    </g>
  </g>

  <!-- bow at right edge -->
  <g transform="translate(700 255) rotate(-18)" filter="url(#soft)">
    <rect x="0" y="-8" width="150" height="10" rx="4" fill="url(#bowWood)"/>
    <rect x="8" y="-3" width="130" height="1.5" fill="#e8dcc8" opacity="0.85"/>
    <circle cx="4" cy="-3" r="5" fill="#6a4224"/>
    <circle cx="146" cy="-3" r="4" fill="#5a3820"/>
  </g>
  <!-- contact spark / vibration hint -->
  <g filter="url(#glow)" opacity="0.75">
    <circle cx="688" cy="238" r="6" fill="#ffe9a0" opacity="0.55"/>
    <path d="M 675 230 Q 688 220 700 232" stroke="#ffe9a0" stroke-width="1.5" fill="none" opacity="0.7"/>
    <path d="M 678 245 Q 690 255 702 242" stroke="#d8c48a" stroke-width="1.2" fill="none" opacity="0.55"/>
  </g>

  <!-- labels -->
  <text x="480" y="500" text-anchor="middle" fill="#c8b878" font-family="Georgia, serif" font-size="18" letter-spacing="1.5">CHLADNI SAND ORCHESTRA</text>
  <text x="480" y="522" text-anchor="middle" fill="#7a6e52" font-family="Georgia, serif" font-size="12" letter-spacing="0.8">sand settles on silence · the pattern is a map of non-motion</text>
</svg>
