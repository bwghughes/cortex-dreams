<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Perseid private theater: Little Prince on a tiny world watching temporary fireballs under a new-moon dark sky while permanent moons wait offstage">
  <defs>
    <linearGradient id="void" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#03040f"/>
      <stop offset="45%" stop-color="#0a1028"/>
      <stop offset="100%" stop-color="#141018"/>
    </linearGradient>
    <linearGradient id="mw" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0%" stop-color="#8aa0d8" stop-opacity="0"/>
      <stop offset="35%" stop-color="#c8d4f8" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#f0f4ff" stop-opacity="0.28"/>
      <stop offset="65%" stop-color="#c8d4f8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8aa0d8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="meteor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8e0" stop-opacity="0"/>
      <stop offset="35%" stop-color="#ffe08a" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#ffb040" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fffef8" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2438"/>
      <stop offset="100%" stop-color="#08060c"/>
    </linearGradient>
    <radialGradient id="princeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff2c0" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#e0a050" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#050412" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonOff" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d8e0f0" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#7080a0" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#050412" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- void -->
  <rect width="960" height="540" fill="url(#void)"/>

  <!-- faint milky way band -->
  <ellipse cx="480" cy="210" rx="520" ry="70" fill="url(#mw)" transform="rotate(-18 480 210)"/>

  <!-- background stars -->
  <g fill="#e8eefc" opacity="0.75">
    <circle cx="60" cy="40" r="1.1"/><circle cx="120" cy="70" r="0.8"/><circle cx="190" cy="35" r="1.3"/>
    <circle cx="250" cy="95" r="0.7"/><circle cx="320" cy="50" r="1.0"/><circle cx="400" cy="28" r="0.9"/>
    <circle cx="470" cy="80" r="0.7"/><circle cx="540" cy="42" r="1.2"/><circle cx="610" cy="88" r="0.8"/>
    <circle cx="690" cy="36" r="1.0"/><circle cx="760" cy="72" r="0.7"/><circle cx="830" cy="48" r="1.1"/>
    <circle cx="900" cy="90" r="0.8"/><circle cx="80" cy="140" r="0.7"/><circle cx="160" cy="170" r="1.0"/>
    <circle cx="280" cy="150" r="0.6"/><circle cx="360" cy="125" r="0.9"/><circle cx="520" cy="160" r="0.7"/>
    <circle cx="640" cy="130" r="1.0"/><circle cx="720" cy="155" r="0.6"/><circle cx="860" cy="140" r="0.9"/>
    <circle cx="940" cy="175" r="0.7"/><circle cx="40" cy="220" r="0.8"/><circle cx="210" cy="200" r="0.6"/>
    <circle cx="430" cy="190" r="0.8"/><circle cx="780" cy="200" r="0.7"/><circle cx="910" cy="230" r="0.9"/>
  </g>

  <!-- permanent moons offstage (right) — quiet mass, not the shower -->
  <g opacity="0.55">
    <circle cx="870" cy="120" r="22" fill="url(#moonOff)"/>
    <circle cx="870" cy="120" r="14" fill="#9aa8c0" opacity="0.35"/>
    <circle cx="905" cy="165" r="11" fill="url(#moonOff)"/>
    <circle cx="840" cy="175" r="8" fill="url(#moonOff)"/>
    <text x="820" y="210" fill="#8a96b0" font-family="Georgia, serif" font-size="11" opacity="0.85">permanent moons</text>
  </g>

  <!-- new moon (dark disk, thin crescent) — contrast maker -->
  <g transform="translate(120,95)">
    <circle cx="0" cy="0" r="26" fill="#0c101c" stroke="#3a4560" stroke-width="1" opacity="0.95"/>
    <path d="M8,-22 A26,26 0 1,0 8,22 A18,18 0 1,1 8,-22" fill="#d8e4f8" opacity="0.22"/>
    <text x="-34" y="48" fill="#7a88a8" font-family="Georgia, serif" font-size="11">new moon</text>
  </g>

  <!-- perseid streaks -->
  <g stroke-linecap="round" filter="url(#soft)">
    <line x1="180" y1="60" x2="290" y2="150" stroke="url(#meteor)" stroke-width="2.2"/>
    <line x1="340" y1="40" x2="420" y2="110" stroke="url(#meteor)" stroke-width="1.6"/>
    <line x1="500" y1="55" x2="610" y2="145" stroke="url(#meteor)" stroke-width="2.5"/>
    <line x1="620" y1="30" x2="700" y2="95" stroke="url(#meteor)" stroke-width="1.4"/>
    <line x1="250" y1="120" x2="330" y2="190" stroke="url(#meteor)" stroke-width="1.3"/>
    <line x1="430" y1="90" x2="505" y2="160" stroke="url(#meteor)" stroke-width="1.8"/>
    <line x1="700" y1="70" x2="790" y2="140" stroke="url(#meteor)" stroke-width="1.5"/>
    <line x1="150" y1="160" x2="220" y2="220" stroke="url(#meteor)" stroke-width="1.1"/>
    <line x1="560" y1="100" x2="640" y2="170" stroke="url(#meteor)" stroke-width="1.7"/>
  </g>
  <!-- bright heads -->
  <g fill="#fff8e8">
    <circle cx="290" cy="150" r="2.4"/><circle cx="420" cy="110" r="1.8"/>
    <circle cx="610" cy="145" r="2.8"/><circle cx="700" cy="95" r="1.6"/>
    <circle cx="330" cy="190" r="1.5"/><circle cx="505" cy="160" r="2.0"/>
    <circle cx="790" cy="140" r="1.7"/><circle cx="220" cy="220" r="1.3"/>
    <circle cx="640" cy="170" r="1.9"/>
  </g>

  <!-- mountain ridge silhouette (Bieszczady) -->
  <path d="M0,390 L40,370 L90,378 L140,350 L200,362 L260,330 L320,348 L380,318 L450,340 L520,310 L590,335 L660,300 L730,325 L800,295 L870,320 L960,305 L960,540 L0,540 Z" fill="url(#ridge)"/>
  <path d="M0,410 L70,395 L130,405 L200,385 L280,400 L360,375 L440,395 L530,365 L620,390 L710,360 L800,385 L900,370 L960,380 L960,540 L0,540 Z" fill="#0a0c14" opacity="0.85"/>

  <!-- little prince on tiny asteroid -->
  <g transform="translate(480,455)">
    <ellipse cx="0" cy="18" rx="54" ry="16" fill="#1c2438"/>
    <ellipse cx="0" cy="14" rx="48" ry="12" fill="#2a3548"/>
    <!-- crater dots -->
    <circle cx="-18" cy="12" r="3" fill="#1a2230" opacity="0.7"/>
    <circle cx="12" cy="16" r="2.2" fill="#1a2230" opacity="0.7"/>
    <circle cx="28" cy="10" r="1.8" fill="#1a2230" opacity="0.6"/>
    <!-- glow -->
    <circle cx="0" cy="-18" r="28" fill="url(#princeGlow)"/>
    <!-- body -->
    <circle cx="0" cy="-22" r="9" fill="#f2d8a0"/>
    <path d="M-7,-14 L-10,8 L10,8 L7,-14 Z" fill="#3d6cb5"/>
    <path d="M-10,8 L-14,22 M10,8 L14,22" stroke="#2a2a38" stroke-width="2.2" stroke-linecap="round"/>
    <!-- scarf -->
    <path d="M6,-18 Q22,-10 28,-22 Q18,-8 8,-12" fill="none" stroke="#e05040" stroke-width="2.4" stroke-linecap="round"/>
    <!-- hair tuft -->
    <path d="M-2,-30 Q0,-38 4,-30" fill="none" stroke="#3a3028" stroke-width="1.6" stroke-linecap="round"/>
    <!-- one rose on asteroid -->
    <g transform="translate(30,2)">
      <line x1="0" y1="0" x2="0" y2="-14" stroke="#3a8a48" stroke-width="1.4"/>
      <circle cx="0" cy="-16" r="3.2" fill="#d04050"/>
      <circle cx="-1.5" cy="-17" r="1.4" fill="#f07080" opacity="0.8"/>
    </g>
  </g>

  <!-- labels -->
  <text x="48" y="500" fill="#a8b4cc" font-family="Georgia, serif" font-size="15" letter-spacing="0.5">Perseid private theater</text>
  <text x="48" y="522" fill="#6a7898" font-family="Georgia, serif" font-size="12">temporary fireballs · dark-sky tickets · sandbagged atmospheres unlocked</text>
  <text x="620" y="522" fill="#8a96b0" font-family="Georgia, serif" font-size="12" text-anchor="start">name the shower before the pin</text>
</svg>
