<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Tortoises Orbits Same Shell dream: left a soil-world tortoise under Beagle-era earth gravity, right a gold tortoise shell looping the Moon on a Zond arc, same shell pattern, different gravity wells, thin bridge of slow witness between them">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="45%" stop-color="#10182a"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2a18"/>
      <stop offset="100%" stop-color="#1a1208"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8a878"/>
      <stop offset="45%" stop-color="#8a6230"/>
      <stop offset="100%" stop-color="#4a3018"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe2a0"/>
      <stop offset="55%" stop-color="#d4a84a"/>
      <stop offset="100%" stop-color="#8a6a28"/>
    </linearGradient>
    <linearGradient id="vacuum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2848"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </linearGradient>
    <radialGradient id="earthglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6a9ad0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#6a9ad0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd878" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffd878" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>

  <!-- starfield -->
  <g fill="#c8d4e8" opacity="0.55">
    <circle cx="80" cy="60" r="1.2"/><circle cx="160" cy="35" r="0.9"/><circle cx="240" cy="90" r="1.1"/>
    <circle cx="480" cy="48" r="1.0"/><circle cx="620" cy="28" r="1.3"/><circle cx="760" cy="72" r="0.8"/>
    <circle cx="900" cy="42" r="1.1"/><circle cx="1040" cy="88" r="0.9"/><circle cx="1120" cy="30" r="1.2"/>
    <circle cx="340" cy="130" r="0.7"/><circle cx="980" cy="150" r="0.8"/><circle cx="70" cy="200" r="0.6"/>
  </g>

  <!-- LEFT panel: soil gravity / Beagle -->
  <g transform="translate(70,90)">
    <rect x="0" y="0" width="480" height="520" rx="22" fill="url(#soil)" stroke="#6a5030" stroke-width="1.5" opacity="0.95"/>
    <text x="24" y="42" fill="#e8d4a8" font-family="Georgia, serif" font-size="22">1835 · Beagle soil</text>
    <text x="24" y="72" fill="#a89068" font-family="ui-sans-serif, system-ui" font-size="14">Chatham Island · slow witness</text>

    <!-- earth disk -->
    <circle cx="240" cy="250" r="110" fill="url(#earthglow)"/>
    <circle cx="240" cy="250" r="88" fill="#2a4a38" stroke="#6a9870" stroke-width="2"/>
    <ellipse cx="210" cy="230" rx="28" ry="16" fill="#3a6a48" opacity="0.7"/>
    <ellipse cx="270" cy="270" rx="36" ry="18" fill="#3a6a48" opacity="0.55"/>
    <path d="M170 280 Q240 310 310 275" fill="none" stroke="#4a7858" stroke-width="3" opacity="0.5"/>

    <!-- tortoise on soil -->
    <g transform="translate(175,300)">
      <!-- shell -->
      <ellipse cx="65" cy="28" rx="70" ry="42" fill="url(#shell)" stroke="#3a2810" stroke-width="2"/>
      <path d="M20 20 L40 5 L65 0 L90 5 L110 20 L90 35 L65 42 L40 35 Z" fill="none" stroke="#5a4018" stroke-width="1.5" opacity="0.8"/>
      <path d="M35 12 L50 28 L35 38" fill="none" stroke="#5a4018" stroke-width="1.2" opacity="0.7"/>
      <path d="M95 12 L80 28 L95 38" fill="none" stroke="#5a4018" stroke-width="1.2" opacity="0.7"/>
      <path d="M65 2 L65 40" fill="none" stroke="#5a4018" stroke-width="1.2" opacity="0.7"/>
      <!-- head / legs -->
      <ellipse cx="-8" cy="30" rx="16" ry="10" fill="#6a5030"/>
      <circle cx="-18" cy="26" r="2.2" fill="#1a1008"/>
      <ellipse cx="20" cy="55" rx="12" ry="7" fill="#5a4020"/>
      <ellipse cx="70" cy="58" rx="12" ry="7" fill="#5a4020"/>
      <ellipse cx="110" cy="48" rx="10" ry="6" fill="#5a4020"/>
    </g>

    <text x="24" y="470" fill="#c8b090" font-family="ui-sans-serif, system-ui" font-size="15">gravity: soil · evolution opens</text>
    <text x="24" y="496" fill="#8a7860" font-family="ui-sans-serif, system-ui" font-size="13">the shell that cracked the idea of species</text>
  </g>

  <!-- CENTER bridge: slow witness -->
  <g transform="translate(560,250)">
    <line x1="0" y1="40" x2="80" y2="40" stroke="url(#gold)" stroke-width="2" stroke-dasharray="6 6" opacity="0.85"/>
    <circle cx="40" cy="40" r="18" fill="#1a1420" stroke="#d4a84a" stroke-width="1.5"/>
    <text x="40" y="45" text-anchor="middle" fill="#ffe2a0" font-family="Georgia, serif" font-size="11">shell</text>
    <text x="40" y="100" text-anchor="middle" fill="#a89878" font-family="ui-sans-serif, system-ui" font-size="12">same</text>
    <text x="40" y="118" text-anchor="middle" fill="#a89878" font-family="ui-sans-serif, system-ui" font-size="12">witness</text>
  </g>

  <!-- RIGHT panel: vacuum gravity / Zond -->
  <g transform="translate(650,90)">
    <rect x="0" y="0" width="480" height="520" rx="22" fill="url(#vacuum)" stroke="#4a6088" stroke-width="1.5" opacity="0.95"/>
    <text x="24" y="42" fill="#d0e0ff" font-family="Georgia, serif" font-size="22">1968 · Zond 5 vacuum</text>
    <text x="24" y="72" fill="#8090b0" font-family="ui-sans-serif, system-ui" font-size="14">first life past LEO · slow witness</text>

    <!-- moon -->
    <circle cx="300" cy="220" r="70" fill="url(#moonglow)"/>
    <circle cx="300" cy="220" r="52" fill="#d8d0b8" stroke="#a09880" stroke-width="2"/>
    <circle cx="280" cy="205" r="10" fill="#b0a890" opacity="0.55"/>
    <circle cx="320" cy="235" r="14" fill="#b0a890" opacity="0.4"/>
    <circle cx="295" cy="245" r="7" fill="#b0a890" opacity="0.45"/>

    <!-- earth small -->
    <circle cx="90" cy="320" r="36" fill="#2a4a68" stroke="#6a90b0" stroke-width="2"/>
    <ellipse cx="80" cy="312" rx="10" ry="6" fill="#3a6a48" opacity="0.7"/>

    <!-- orbital arc -->
    <path d="M90 280 Q200 80 300 170" fill="none" stroke="#d4a84a" stroke-width="2" stroke-dasharray="4 5" opacity="0.9"/>
    <path d="M300 270 Q220 380 110 350" fill="none" stroke="#88a0c8" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.55"/>

    <!-- gold Zond dot + tiny tortoise shell on arc -->
    <g transform="translate(195,120)">
      <circle cx="0" cy="0" r="7" fill="url(#gold)" stroke="#ffe2a0" stroke-width="1"/>
      <ellipse cx="0" cy="18" rx="22" ry="12" fill="url(#shell)" stroke="#3a2810" stroke-width="1.2"/>
      <path d="M-12 14 L-4 8 L4 8 L12 14 L4 22 L-4 22 Z" fill="none" stroke="#5a4018" stroke-width="1" opacity="0.85"/>
    </g>

    <text x="24" y="470" fill="#b0c4e0" font-family="ui-sans-serif, system-ui" font-size="15">gravity: vacuum · idea leaves planet</text>
    <text x="24" y="496" fill="#7080a0" font-family="ui-sans-serif, system-ui" font-size="13">the shell that rode the new orbit home</text>
  </g>

  <!-- title strip -->
  <g transform="translate(0,640)">
    <rect x="70" y="0" width="1060" height="55" rx="12" fill="#0c1018" stroke="#3a3040" stroke-width="1"/>
    <text x="600" y="24" text-anchor="middle" fill="#ffe2a0" font-family="Georgia, serif" font-size="20">Same shell · different gravity</text>
    <text x="600" y="44" text-anchor="middle" fill="#8a8098" font-family="ui-sans-serif, system-ui" font-size="13">Model Delegation swaps the pull · production freeze keeps the tortoise pace · no master hatch</text>
  </g>
</svg>
