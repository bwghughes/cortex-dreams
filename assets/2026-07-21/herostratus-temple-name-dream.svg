<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Herostratus Temple Name Dream — burning Temple of Artemis with forbidden name in the smoke">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07060c"/>
      <stop offset="45%" stop-color="#1a0c12"/>
      <stop offset="100%" stop-color="#3a1408"/>
    </linearGradient>
    <radialGradient id="firecore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="35%" stop-color="#ffb347"/>
      <stop offset="70%" stop-color="#ff5a1f"/>
      <stop offset="100%" stop-color="#7a1208" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="ember" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9a8"/>
      <stop offset="100%" stop-color="#ff4d00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="marble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8d0c0"/>
      <stop offset="55%" stop-color="#a89f8c"/>
      <stop offset="100%" stop-color="#5c5346"/>
    </linearGradient>
    <linearGradient id="smoke" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2a1a14" stop-opacity="0"/>
      <stop offset="40%" stop-color="#6a5248" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c8b8a8" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- night sky over Ephesus -->
  <rect width="1200" height="800" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#f0e8d8" opacity="0.7">
    <circle cx="70" cy="50" r="1.1"/>
    <circle cx="150" cy="90" r="0.8"/>
    <circle cx="230" cy="35" r="1.0"/>
    <circle cx="340" cy="70" r="0.7"/>
    <circle cx="480" cy="40" r="1.2"/>
    <circle cx="620" cy="25" r="0.6"/>
    <circle cx="760" cy="55" r="0.9"/>
    <circle cx="900" cy="30" r="1.1"/>
    <circle cx="1040" cy="80" r="0.7"/>
    <circle cx="1120" cy="45" r="1.0"/>
    <circle cx="100" cy="160" r="0.5"/>
    <circle cx="1050" cy="140" r="0.6"/>
  </g>

  <!-- distant sea / horizon -->
  <ellipse cx="600" cy="720" rx="900" ry="160" fill="#0d1018"/>
  <ellipse cx="600" cy="700" rx="820" ry="90" fill="#151a24" opacity="0.8"/>

  <!-- ground / steps -->
  <rect x="80" y="560" width="1040" height="24" fill="#3a342c"/>
  <rect x="100" y="584" width="1000" height="18" fill="#2e2922"/>
  <rect x="120" y="602" width="960" height="14" fill="#242018"/>

  <!-- temple base -->
  <rect x="180" y="430" width="840" height="130" fill="url(#marble)"/>
  <rect x="180" y="430" width="840" height="18" fill="#ebe3d4" opacity="0.35"/>

  <!-- columns (still standing) -->
  <g>
    <!-- seven columns -->
    <g fill="url(#marble)">
      <rect x="220" y="250" width="48" height="180" rx="4"/>
      <rect x="330" y="250" width="48" height="180" rx="4"/>
      <rect x="440" y="250" width="48" height="180" rx="4"/>
      <rect x="550" y="250" width="48" height="180" rx="4"/>
      <rect x="660" y="250" width="48" height="180" rx="4"/>
      <rect x="770" y="250" width="48" height="180" rx="4"/>
      <rect x="880" y="250" width="48" height="180" rx="4"/>
    </g>
    <!-- capitals -->
    <g fill="#cfc6b4">
      <rect x="210" y="238" width="68" height="16" rx="3"/>
      <rect x="320" y="238" width="68" height="16" rx="3"/>
      <rect x="430" y="238" width="68" height="16" rx="3"/>
      <rect x="540" y="238" width="68" height="16" rx="3"/>
      <rect x="650" y="238" width="68" height="16" rx="3"/>
      <rect x="760" y="238" width="68" height="16" rx="3"/>
      <rect x="870" y="238" width="68" height="16" rx="3"/>
    </g>
    <!-- column fluting hints -->
    <g stroke="#8a8170" stroke-width="1" opacity="0.35">
      <line x1="236" y1="255" x2="236" y2="425"/>
      <line x1="252" y1="255" x2="252" y2="425"/>
      <line x1="346" y1="255" x2="346" y2="425"/>
      <line x1="362" y1="255" x2="362" y2="425"/>
      <line x1="456" y1="255" x2="456" y2="425"/>
      <line x1="472" y1="255" x2="472" y2="425"/>
      <line x1="566" y1="255" x2="566" y2="425"/>
      <line x1="582" y1="255" x2="582" y2="425"/>
      <line x1="676" y1="255" x2="676" y2="425"/>
      <line x1="692" y1="255" x2="692" y2="425"/>
      <line x1="786" y1="255" x2="786" y2="425"/>
      <line x1="802" y1="255" x2="802" y2="425"/>
      <line x1="896" y1="255" x2="896" y2="425"/>
      <line x1="912" y1="255" x2="912" y2="425"/>
    </g>
  </g>

  <!-- pediment / roof line (cracking into fire) -->
  <polygon points="170,250 600,160 1030,250" fill="#b7ae9c"/>
  <polygon points="190,248 600,175 1010,248" fill="#8a3a18" opacity="0.55"/>
  <polygon points="260,248 600,190 940,248" fill="url(#firecore)" opacity="0.85" filter="url(#glow)"/>

  <!-- main fire plume -->
  <ellipse cx="600" cy="150" rx="180" ry="90" fill="url(#firecore)" opacity="0.9" filter="url(#glow)"/>
  <ellipse cx="560" cy="100" rx="90" ry="70" fill="#ff8a2a" opacity="0.7" filter="url(#soft)"/>
  <ellipse cx="650" cy="85" rx="70" ry="55" fill="#ffd27a" opacity="0.65" filter="url(#soft)"/>
  <ellipse cx="600" cy="60" rx="40" ry="35" fill="#fff1c0" opacity="0.8"/>

  <!-- secondary fires between columns -->
  <g opacity="0.85">
    <ellipse cx="354" cy="320" rx="28" ry="50" fill="url(#ember)" filter="url(#soft)"/>
    <ellipse cx="574" cy="300" rx="34" ry="60" fill="url(#ember)" filter="url(#soft)"/>
    <ellipse cx="794" cy="330" rx="26" ry="48" fill="url(#ember)" filter="url(#soft)"/>
  </g>

  <!-- smoke -->
  <g fill="url(#smoke)" opacity="0.9">
    <ellipse cx="520" cy="40" rx="120" ry="50"/>
    <ellipse cx="680" cy="20" rx="140" ry="45"/>
    <ellipse cx="600" cy="-10" rx="200" ry="40"/>
  </g>

  <!-- sparks -->
  <g fill="#ffd48a">
    <circle cx="480" cy="180" r="2.2"/>
    <circle cx="700" cy="140" r="1.8"/>
    <circle cx="540" cy="90" r="1.4"/>
    <circle cx="650" cy="200" r="2.0"/>
    <circle cx="430" cy="240" r="1.5"/>
    <circle cx="760" cy="210" r="1.7"/>
    <circle cx="590" cy="40" r="1.3"/>
    <circle cx="720" cy="70" r="1.6"/>
    <circle cx="510" cy="250" r="1.2"/>
    <circle cx="820" cy="160" r="1.9"/>
    <circle cx="380" cy="190" r="1.4"/>
    <circle cx="640" cy="280" r="1.1"/>
  </g>

  <!-- forbidden name assembling in smoke -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#f4e6c8" letter-spacing="8">
    <text x="600" y="55" text-anchor="middle" font-size="42" opacity="0.92" filter="url(#soft)">HEROSTRATUS</text>
    <text x="600" y="55" text-anchor="middle" font-size="42" opacity="0.55" fill="#ffb070">HEROSTRATUS</text>
  </g>
  <text x="600" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#c9b8a0" opacity="0.75" letter-spacing="4">THE BAN MADE THE NAME</text>

  <!-- lone torch figure -->
  <g transform="translate(600,500)">
    <ellipse cx="0" cy="48" rx="18" ry="8" fill="#1a140f" opacity="0.5"/>
    <rect x="-7" y="0" width="14" height="42" rx="4" fill="#2a2218"/>
    <circle cx="0" cy="-8" r="10" fill="#3a3026"/>
    <rect x="10" y="-6" width="4" height="28" rx="1" fill="#5a4030"/>
    <ellipse cx="12" cy="-14" rx="10" ry="14" fill="url(#ember)" filter="url(#soft)"/>
    <circle cx="12" cy="-18" r="4" fill="#fff0c0"/>
  </g>

  <!-- caption -->
  <text x="600" y="760" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#c4b49a" opacity="0.8">Ephesus · 21 July 356 BC · destruction travels faster than construction</text>
</svg>
