<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">Painted Moon Dispatcher Card</title>
  <desc id="desc">A two-tone Iapetus-like moon over a routing console. Caption: every AI system is painted by its orbit.</desc>
  <defs>
    <radialGradient id="cream" cx="38%" cy="35%" r="65%">
      <stop offset="0" stop-color="#fff4cf"/>
      <stop offset="0.65" stop-color="#d9c28f"/>
      <stop offset="1" stop-color="#8c744e"/>
    </radialGradient>
    <radialGradient id="ash" cx="62%" cy="40%" r="70%">
      <stop offset="0" stop-color="#6b5b4b"/>
      <stop offset="0.72" stop-color="#302721"/>
      <stop offset="1" stop-color="#100d0b"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="540" fill="#0b1020"/>
  <path d="M0 405 C180 350 300 438 456 392 C650 335 760 363 900 312 L900 540 L0 540 Z" fill="#10182d"/>
  <path d="M72 432 C250 389 389 462 556 411 C707 365 804 387 900 356" fill="none" stroke="#243a63" stroke-width="3" opacity="0.75"/>

  <g transform="translate(450 178)">
    <circle r="116" fill="#1c1d22" opacity="0.55" filter="url(#glow)"/>
    <clipPath id="moonClip"><circle r="108"/></clipPath>
    <g clip-path="url(#moonClip)">
      <rect x="-120" y="-120" width="124" height="240" fill="url(#cream)"/>
      <rect x="0" y="-120" width="120" height="240" fill="url(#ash)"/>
      <path d="M-7 -112 C20 -70 -22 -35 4 3 C25 34 -18 69 10 112" fill="none" stroke="#19120f" stroke-width="16" opacity="0.65"/>
      <circle cx="-50" cy="-38" r="9" fill="#9f8456" opacity="0.5"/>
      <circle cx="42" cy="16" r="13" fill="#1a1512" opacity="0.65"/>
      <circle cx="65" cy="-48" r="6" fill="#89745e" opacity="0.45"/>
      <circle cx="-28" cy="52" r="12" fill="#b89f6d" opacity="0.42"/>
    </g>
    <circle r="108" fill="none" stroke="#f6d88a" stroke-width="2" opacity="0.45"/>
  </g>

  <g transform="translate(130 330)">
    <rect x="0" y="0" width="640" height="96" rx="16" fill="#121b30" stroke="#35517f"/>
    <text x="24" y="31" fill="#9cc7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">orbit-aware dispatcher</text>
    <g stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M48 66 H180" stroke="#f6d88a"/>
      <path d="M180 66 C235 66 235 35 294 35" stroke="#78d0ff"/>
      <path d="M180 66 C243 66 250 66 314 66" stroke="#9ff29f"/>
      <path d="M180 66 C238 66 238 92 300 92" stroke="#ff8f70"/>
    </g>
    <circle cx="48" cy="66" r="7" fill="#f6d88a"/>
    <circle cx="315" cy="35" r="7" fill="#78d0ff"/>
    <circle cx="335" cy="66" r="7" fill="#9ff29f"/>
    <circle cx="321" cy="92" r="7" fill="#ff8f70"/>
    <text x="355" y="40" fill="#c7d7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">local lane: residue ≠ purity</text>
    <text x="355" y="72" fill="#c7d7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">cloud lane: scale ≠ sovereignty</text>
    <text x="355" y="102" fill="#c7d7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">human exception owner</text>
  </g>

  <text x="450" y="490" text-anchor="middle" fill="#f6d88a" font-family="Georgia, serif" font-size="28">every AI system is painted by its orbit</text>
</svg>
