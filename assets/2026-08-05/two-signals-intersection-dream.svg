<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-label="Two Signals Intersection Dream — fraying Atlantic cable left, electric traffic light right, dual weather over one corner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1420"/>
      <stop offset="45%" stop-color="#121a28"/>
      <stop offset="100%" stop-color="#080c12"/>
    </linearGradient>
    <linearGradient id="ocean" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a3a55" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a1a28" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="street" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2a30"/>
      <stop offset="100%" stop-color="#141418"/>
    </linearGradient>
    <linearGradient id="cable" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a86a"/>
      <stop offset="60%" stop-color="#8a7048"/>
      <stop offset="100%" stop-color="#4a3a28" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4a4a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ff4a4a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffc04a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffc04a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4aff8a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4aff8a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7ec8ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7ec8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="960" height="640" fill="url(#bg)"/>

  <!-- split weather -->
  <rect x="0" y="0" width="480" height="640" fill="url(#ocean)" opacity="0.55"/>
  <rect x="480" y="0" width="480" height="640" fill="url(#street)" opacity="0.45"/>

  <!-- horizon line -->
  <path d="M0 360 Q240 340 480 360 T960 350" stroke="#3a5068" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- LEFT: fraying Atlantic cable -->
  <g filter="url(#soft)">
    <path d="M40 420 C120 380, 180 400, 260 360 S380 300, 440 280" stroke="url(#cable)" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M40 420 C120 380, 180 400, 260 360 S380 300, 440 280" stroke="#e8d4a0" stroke-width="2" fill="none" opacity="0.35" stroke-dasharray="4 10"/>
    <!-- fray / break near mid -->
    <path d="M300 340 L318 328 M308 348 L326 332 M314 352 L330 340" stroke="#d4b070" stroke-width="2.5" opacity="0.85"/>
    <circle cx="120" cy="400" r="18" fill="url(#pulse)" opacity="0.55"/>
    <circle cx="210" cy="372" r="12" fill="url(#pulse)" opacity="0.4"/>
    <circle cx="290" cy="345" r="8" fill="url(#pulse)" opacity="0.25"/>
    <!-- drowned end -->
    <circle cx="430" cy="285" r="6" fill="#4a3a28" opacity="0.5"/>
    <text x="70" y="470" fill="#9ab0c4" font-family="Georgia, serif" font-size="15" opacity="0.85">1858 · 27 days</text>
    <text x="70" y="492" fill="#6a8094" font-family="Georgia, serif" font-size="13" opacity="0.75">temporary strand</text>
  </g>

  <!-- RIGHT: traffic light -->
  <g filter="url(#soft)">
    <!-- pole -->
    <rect x="702" y="280" width="16" height="260" rx="3" fill="#2a2e34"/>
    <rect x="690" y="530" width="40" height="14" rx="3" fill="#1a1e24"/>
    <!-- housing -->
    <rect x="668" y="170" width="84" height="200" rx="18" fill="#1c1f26" stroke="#3a4048" stroke-width="3"/>
    <rect x="678" y="182" width="64" height="176" rx="12" fill="#12151a"/>
    <!-- lamps -->
    <circle cx="710" cy="220" r="28" fill="#2a1010"/>
    <circle cx="710" cy="220" r="22" fill="#5a2020" opacity="0.7"/>
    <circle cx="710" cy="220" r="40" fill="url(#redGlow)" opacity="0.35"/>
    <circle cx="710" cy="300" r="28" fill="#2a2410"/>
    <circle cx="710" cy="300" r="22" fill="#5a4820" opacity="0.55"/>
    <circle cx="710" cy="300" r="36" fill="url(#amberGlow)" opacity="0.3"/>
    <circle cx="710" cy="380" r="28" fill="#102a18"/>
    <circle cx="710" cy="380" r="22" fill="#2ecc71"/>
    <circle cx="710" cy="380" r="48" fill="url(#greenGlow)" opacity="0.55"/>
    <!-- go glow bleed -->
    <ellipse cx="710" cy="400" rx="70" ry="30" fill="#2ecc71" opacity="0.12"/>
    <text x="780" y="300" fill="#c8d0d8" font-family="Georgia, serif" font-size="15" opacity="0.9">1914 · still on</text>
    <text x="780" y="322" fill="#8a98a4" font-family="Georgia, serif" font-size="13" opacity="0.75">permanent light</text>
  </g>

  <!-- center divider / intersection mark -->
  <line x1="480" y1="80" x2="480" y2="560" stroke="#5a7088" stroke-width="1" stroke-dasharray="6 8" opacity="0.45"/>
  <circle cx="480" cy="360" r="22" fill="none" stroke="#7ec8ff" stroke-width="1.5" opacity="0.5"/>
  <circle cx="480" cy="360" r="6" fill="#7ec8ff" opacity="0.7"/>

  <!-- title block -->
  <text x="48" y="58" fill="#e8eef4" font-family="Georgia, serif" font-size="28" font-weight="600">Two Signals</text>
  <text x="48" y="88" fill="#8aa0b4" font-family="Georgia, serif" font-size="16">temporary strand · permanent light · 5 August</text>

  <!-- micro caption -->
  <text x="48" y="600" fill="#6a8094" font-family="Georgia, serif" font-size="14" opacity="0.85">Dot. Dash. Stop. Go. One died in weeks. One still blinks tonight.</text>
</svg>
