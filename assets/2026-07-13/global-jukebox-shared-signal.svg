<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Global Jukebox Shared Signal — two venues, one ghost link" width="960" height="540">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070b1a"/>
      <stop offset="55%" stop-color="#121a36"/>
      <stop offset="100%" stop-color="#1a1030"/>
    </linearGradient>
    <linearGradient id="wembley" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#39f0ff"/>
      <stop offset="100%" stop-color="#1a7cff"/>
    </linearGradient>
    <linearGradient id="philly" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5ec8"/>
      <stop offset="100%" stop-color="#ff8a3d"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#sky)"/>

  <!-- faint stars -->
  <g fill="#c9d7ff" opacity="0.55">
    <circle cx="70" cy="48" r="1.4"/>
    <circle cx="140" cy="90" r="1.1"/>
    <circle cx="220" cy="36" r="1.3"/>
    <circle cx="310" cy="72" r="1"/>
    <circle cx="430" cy="28" r="1.2"/>
    <circle cx="520" cy="64" r="1.1"/>
    <circle cx="610" cy="40" r="1.4"/>
    <circle cx="700" cy="86" r="1"/>
    <circle cx="790" cy="52" r="1.3"/>
    <circle cx="880" cy="70" r="1.1"/>
    <circle cx="180" cy="130" r="1"/>
    <circle cx="760" cy="120" r="1.2"/>
  </g>

  <!-- Atlantic dashed longitudes -->
  <g stroke="#6f86c9" stroke-width="1.2" stroke-dasharray="5 8" opacity="0.45" fill="none">
    <path d="M420 360 C460 300, 500 300, 540 360"/>
    <path d="M400 390 C460 320, 500 320, 560 390"/>
    <path d="M390 420 C460 340, 500 340, 570 420"/>
  </g>

  <!-- left stadium: local venue / Wembley cyan -->
  <g filter="url(#glow)">
    <ellipse cx="220" cy="390" rx="130" ry="42" fill="none" stroke="url(#wembley)" stroke-width="3"/>
    <path d="M110 390 Q220 250 330 390" fill="none" stroke="url(#wembley)" stroke-width="3.5"/>
    <path d="M140 390 Q220 290 300 390" fill="none" stroke="#7ef7ff" stroke-width="1.5" opacity="0.7"/>
    <rect x="205" y="300" width="30" height="55" rx="4" fill="#1a7cff" opacity="0.55"/>
  </g>
  <text x="220" y="460" text-anchor="middle" fill="#9cf7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1.5">LOCAL VENUE</text>
  <text x="220" y="480" text-anchor="middle" fill="#6fd0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">custody · MLX · workstation</text>

  <!-- right stadium: overflow / Philly rose -->
  <g filter="url(#glow)">
    <ellipse cx="740" cy="390" rx="130" ry="42" fill="none" stroke="url(#philly)" stroke-width="3"/>
    <path d="M610 390 Q740 250 870 390" fill="none" stroke="url(#philly)" stroke-width="3.5"/>
    <path d="M640 390 Q740 290 840 390" fill="none" stroke="#ffb3e0" stroke-width="1.5" opacity="0.7"/>
    <rect x="725" y="300" width="30" height="55" rx="4" fill="#ff5ec8" opacity="0.5"/>
  </g>
  <text x="740" y="460" text-anchor="middle" fill="#ffb7e4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1.5">OVERFLOW VENUE</text>
  <text x="740" y="480" text-anchor="middle" fill="#e89ac0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">burst · cloud · dual-vendor</text>

  <!-- satellite midwife / ghost link -->
  <g filter="url(#glow)">
    <path d="M250 320 C380 120, 580 120, 710 320" fill="none" stroke="#f4f0ff" stroke-width="2" stroke-dasharray="3 7" opacity="0.85"/>
    <circle cx="480" cy="150" r="18" fill="#0c1230" stroke="#f4f0ff" stroke-width="2"/>
    <circle cx="480" cy="150" r="6" fill="#fff8b0"/>
    <rect x="456" y="145" width="14" height="10" rx="2" fill="#c7d2ff"/>
    <rect x="490" y="145" width="14" height="10" rx="2" fill="#c7d2ff"/>
  </g>
  <text x="480" y="118" text-anchor="middle" fill="#fff8b0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2">TELSTAR GHOST</text>
  <text x="480" y="200" text-anchor="middle" fill="#d7dffc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">shared-signal midwife</text>

  <!-- shared signal meter -->
  <g>
    <text x="480" y="250" text-anchor="middle" fill="#b8c4ef" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1.5">SHARED SIGNAL</text>
    <rect x="330" y="262" width="300" height="16" rx="8" fill="#0a1024" stroke="#6f86c9" stroke-width="1.5"/>
    <rect x="332" y="264" width="246" height="12" rx="6" fill="#7ef7ff" opacity="0.85"/>
    <text x="480" y="300" text-anchor="middle" fill="#9cf7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">auth · route · attest · kill-switch</text>
  </g>

  <!-- title -->
  <text x="480" y="42" text-anchor="middle" fill="#f4f0ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="3">GLOBAL JUKEBOX · SHARED SIGNAL</text>
  <text x="480" y="64" text-anchor="middle" fill="#8ea0d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">cortex-dream-cycle-2026-07-13 · two venues / one nervous system</text>

  <!-- footer -->
  <text x="480" y="520" text-anchor="middle" fill="#6a78a8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Don't buy either stadium. Own the ghost link.</text>
</svg>
