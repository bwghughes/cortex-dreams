<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Nanmen Guest Star Remnant Dream — iron supernova shell expanding under a 185 AD clerk's ink and delayed modern light">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070612"/>
      <stop offset="40%" stop-color="#12102a"/>
      <stop offset="75%" stop-color="#1a1420"/>
      <stop offset="100%" stop-color="#0a080c"/>
    </linearGradient>
    <radialGradient id="coreFlash" cx="48%" cy="42%" r="18%">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="35%" stop-color="#ffd27a"/>
      <stop offset="70%" stop-color="#ff7a3a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1020" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ironShell" cx="48%" cy="42%" r="42%">
      <stop offset="0%" stop-color="#ffb070" stop-opacity="0"/>
      <stop offset="45%" stop-color="#c45a38" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#8a3048" stop-opacity="0.45"/>
      <stop offset="88%" stop-color="#5a2840" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1a1020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scroll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0e2c4"/>
      <stop offset="55%" stop-color="#d8c49a"/>
      <stop offset="100%" stop-color="#a89068"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a1810"/>
      <stop offset="100%" stop-color="#5a3020"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#140e0a"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="tiny" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- night sky -->
  <rect width="1200" height="800" fill="url(#sky)"/>

  <!-- distant stars -->
  <g fill="#e8e0d0" opacity="0.55">
    <circle cx="80" cy="70" r="1.2"/>
    <circle cx="160" cy="120" r="0.9"/>
    <circle cx="240" cy="55" r="1.4"/>
    <circle cx="320" cy="140" r="0.8"/>
    <circle cx="900" cy="60" r="1.1"/>
    <circle cx="980" cy="110" r="0.9"/>
    <circle cx="1080" cy="45" r="1.3"/>
    <circle cx="1140" cy="160" r="0.8"/>
    <circle cx="70" cy="220" r="0.7"/>
    <circle cx="1120" cy="240" r="1.0"/>
    <circle cx="200" cy="200" r="0.6"/>
    <circle cx="1050" cy="200" r="0.7"/>
  </g>

  <!-- expanding iron shell -->
  <circle cx="560" cy="310" r="250" fill="url(#ironShell)"/>
  <circle cx="560" cy="310" r="210" fill="none" stroke="#c86a48" stroke-opacity="0.35" stroke-width="2" filter="url(#soft)"/>
  <circle cx="560" cy="310" r="165" fill="none" stroke="#e09060" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="6 10"/>
  <circle cx="560" cy="310" r="120" fill="none" stroke="#f0b080" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="3 8"/>

  <!-- filament wisps (no neutron core) -->
  <g fill="none" stroke="#ffb090" stroke-opacity="0.45" stroke-width="2" filter="url(#tiny)">
    <path d="M420,250 C460,220 500,280 540,240 C580,200 620,260 660,230"/>
    <path d="M400,340 C450,360 490,300 540,330 C590,360 640,300 700,340"/>
    <path d="M460,180 C500,200 520,160 560,190 C600,220 640,170 690,200"/>
    <path d="M430,400 C480,380 520,430 570,400 C620,370 670,420 720,390"/>
  </g>
  <g fill="#ffd0a0" opacity="0.35" filter="url(#soft)">
    <ellipse cx="500" cy="280" rx="40" ry="18" transform="rotate(-20 500 280)"/>
    <ellipse cx="620" cy="350" rx="50" ry="16" transform="rotate(25 620 350)"/>
    <ellipse cx="580" cy="230" rx="35" ry="12" transform="rotate(10 580 230)"/>
  </g>

  <!-- soft flash memory, not a solid core -->
  <circle cx="560" cy="310" r="70" fill="url(#coreFlash)" opacity="0.85" filter="url(#glow)"/>
  <circle cx="560" cy="310" r="14" fill="#fff6e0" opacity="0.35"/>
  <!-- hollow center mark: no neutron star -->
  <circle cx="560" cy="310" r="22" fill="none" stroke="#fff0d0" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="2 4"/>

  <!-- light rays delayed -->
  <g stroke="#ffc090" stroke-opacity="0.18" stroke-width="1">
    <line x1="560" y1="310" x2="200" y2="80"/>
    <line x1="560" y1="310" x2="900" y2="70"/>
    <line x1="560" y1="310" x2="180" y2="480"/>
    <line x1="560" y1="310" x2="980" y2="500"/>
    <line x1="560" y1="310" x2="560" y2="40"/>
  </g>

  <!-- desk / clerk layer -->
  <rect x="0" y="560" width="1200" height="240" fill="url(#desk)"/>
  <rect x="0" y="555" width="1200" height="8" fill="#2a1c12"/>

  <!-- scroll -->
  <g transform="translate(140,590)">
    <rect x="0" y="20" width="420" height="150" rx="8" fill="url(#scroll)"/>
    <ellipse cx="0" cy="95" rx="18" ry="75" fill="#c4ae82"/>
    <ellipse cx="420" cy="95" rx="18" ry="75" fill="#b89a6e"/>
    <rect x="30" y="45" width="360" height="8" rx="2" fill="url(#ink)" opacity="0.55"/>
    <rect x="30" y="70" width="300" height="6" rx="2" fill="url(#ink)" opacity="0.4"/>
    <rect x="30" y="92" width="340" height="6" rx="2" fill="url(#ink)" opacity="0.45"/>
    <rect x="30" y="114" width="260" height="6" rx="2" fill="url(#ink)" opacity="0.35"/>
    <rect x="30" y="136" width="200" height="6" rx="2" fill="url(#ink)" opacity="0.3"/>
    <text x="30" y="40" fill="#3a2414" font-family="Georgia, serif" font-size="15" font-style="italic">guest star in Nanmen — 185</text>
  </g>

  <!-- modern receipt strip -->
  <g transform="translate(700,610)">
    <rect x="0" y="0" width="360" height="130" rx="6" fill="#1c2430" stroke="#6a8aaa" stroke-opacity="0.5"/>
    <text x="20" y="32" fill="#9ec8e8" font-family="ui-monospace, Menlo, monospace" font-size="13">REMNANT LEDGER</text>
    <text x="20" y="58" fill="#c8d8e8" font-family="ui-monospace, Menlo, monospace" font-size="12">Health → partner inference</text>
    <text x="20" y="80" fill="#c8d8e8" font-family="ui-monospace, Menlo, monospace" font-size="12">desktop Computer Use</text>
    <text x="20" y="102" fill="#c8d8e8" font-family="ui-monospace, Menlo, monospace" font-size="12">pin 0.32.2 → 0.32.3</text>
    <circle cx="330" y="28" r="6" fill="#ff8a4a" opacity="0.85"/>
  </g>

  <!-- title plate -->
  <g transform="translate(40,40)">
    <rect x="0" y="0" width="420" height="70" rx="8" fill="#0c0a14" fill-opacity="0.72" stroke="#c88a60" stroke-opacity="0.35"/>
    <text x="20" y="32" fill="#f0d8b8" font-family="Georgia, serif" font-size="22">Nanmen Guest Star Remnant</text>
    <text x="20" y="54" fill="#a89888" font-family="ui-monospace, Menlo, monospace" font-size="12">delayed light · no neutron core · iron still expanding</text>
  </g>

  <!-- year tags -->
  <text x="520" y="530" fill="#d0b090" font-family="Georgia, serif" font-size="16" opacity="0.7">185 → 2026</text>
</svg>
