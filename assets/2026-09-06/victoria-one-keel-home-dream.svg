<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Victoria one keel home dream: single carrack docking at Seville after circumnavigation, four ghost keels lost, globe edge you can touch">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1a2e"/>
      <stop offset="45%" stop-color="#1a3a58"/>
      <stop offset="72%" stop-color="#c4783a"/>
      <stop offset="100%" stop-color="#2a1810"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a2840"/>
      <stop offset="55%" stop-color="#123a52"/>
      <stop offset="100%" stop-color="#0a1c28"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5a28"/>
      <stop offset="50%" stop-color="#5c3a18"/>
      <stop offset="100%" stop-color="#2e1c0c"/>
    </linearGradient>
    <linearGradient id="sail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4e6c8"/>
      <stop offset="60%" stop-color="#d8c49a"/>
      <stop offset="100%" stop-color="#a89068"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe7a0"/>
      <stop offset="100%" stop-color="#c4922a"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe0a0" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#ff9a40" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c4783a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="url(#sky)"/>

  <!-- sun / homecoming light -->
  <circle cx="980" cy="160" r="90" fill="url(#sun)" filter="url(#glow)"/>
  <circle cx="980" cy="160" r="28" fill="#ffe8b0" opacity="0.9"/>

  <!-- sea -->
  <path d="M0 390 C180 370 320 420 500 400 C700 375 860 430 1200 390 L1200 720 L0 720 Z" fill="url(#sea)"/>
  <path d="M0 430 C200 450 380 410 560 440 C760 470 940 420 1200 450" fill="none" stroke="#3a6a88" stroke-width="2" opacity="0.35"/>
  <path d="M0 480 C220 500 420 460 640 490 C860 520 1020 470 1200 500" fill="none" stroke="#2a5070" stroke-width="1.5" opacity="0.3"/>

  <!-- Seville shore / dock -->
  <path d="M820 470 L1200 450 L1200 720 L780 720 Z" fill="#3a2a1c" opacity="0.85"/>
  <path d="M840 490 L1180 475 L1180 520 L860 540 Z" fill="#5a4030"/>
  <rect x="900" y="500" width="14" height="70" fill="#2a1c12"/>
  <rect x="980" y="495" width="14" height="80" fill="#2a1c12"/>
  <rect x="1060" y="492" width="14" height="85" fill="#2a1c12"/>
  <text x="1000" y="620" text-anchor="middle" fill="#e8d2a8" font-family="Georgia, serif" font-size="18" letter-spacing="2">SEVILLE · HOME PORT</text>
  <text x="1000" y="648" text-anchor="middle" fill="#b89a70" font-family="Georgia, serif" font-size="13">6 September 1522</text>

  <!-- four ghost keels lost at sea -->
  <g opacity="0.22" filter="url(#soft)">
    <g transform="translate(120 410) scale(0.55)">
      <ellipse cx="0" cy="40" rx="70" ry="14" fill="#6a90a8"/>
      <path d="M-60 20 Q0 -10 70 25 L60 45 Q0 30 -55 40 Z" fill="#4a6080"/>
      <line x1="0" y1="-50" x2="0" y2="25" stroke="#8aa8c0" stroke-width="4"/>
    </g>
    <g transform="translate(280 450) scale(0.45)">
      <ellipse cx="0" cy="40" rx="70" ry="14" fill="#6a90a8"/>
      <path d="M-60 20 Q0 -10 70 25 L60 45 Q0 30 -55 40 Z" fill="#4a6080"/>
      <line x1="0" y1="-50" x2="0" y2="25" stroke="#8aa8c0" stroke-width="4"/>
    </g>
    <g transform="translate(430 400) scale(0.5)">
      <ellipse cx="0" cy="40" rx="70" ry="14" fill="#6a90a8"/>
      <path d="M-60 20 Q0 -10 70 25 L60 45 Q0 30 -55 40 Z" fill="#4a6080"/>
      <line x1="0" y1="-50" x2="0" y2="25" stroke="#8aa8c0" stroke-width="4"/>
    </g>
    <g transform="translate(560 455) scale(0.4)">
      <ellipse cx="0" cy="40" rx="70" ry="14" fill="#6a90a8"/>
      <path d="M-60 20 Q0 -10 70 25 L60 45 Q0 30 -55 40 Z" fill="#4a6080"/>
      <line x1="0" y1="-50" x2="0" y2="25" stroke="#8aa8c0" stroke-width="4"/>
    </g>
  </g>
  <text x="340" y="520" text-anchor="middle" fill="#7a9ab0" font-family="Georgia, serif" font-size="14" opacity="0.55" letter-spacing="1">FOUR KEELS LOST</text>

  <!-- Victoria — the one keel home -->
  <g transform="translate(720 430)" filter="url(#soft)">
    <!-- wake -->
    <path d="M-90 55 Q-40 70 20 58 Q60 50 90 55" fill="none" stroke="#8ec8e8" stroke-width="3" opacity="0.45"/>
    <path d="M-70 68 Q-20 80 40 70" fill="none" stroke="#6aa8c8" stroke-width="2" opacity="0.3"/>
    <!-- hull -->
    <path d="M-95 20 Q-20 -5 100 30 L85 55 Q0 40 -85 48 Z" fill="url(#hull)"/>
    <path d="M-95 20 Q-20 -5 100 30" fill="none" stroke="#c9a060" stroke-width="2" opacity="0.7"/>
    <!-- masts -->
    <line x1="-20" y1="-110" x2="-20" y2="25" stroke="#3a2818" stroke-width="5"/>
    <line x1="35" y1="-85" x2="35" y2="32" stroke="#3a2818" stroke-width="4"/>
    <!-- sails -->
    <path d="M-18 -105 L-18 -15 L55 -25 L55 -95 Z" fill="url(#sail)" opacity="0.95"/>
    <path d="M37 -80 L37 -10 L85 -5 L85 -60 Z" fill="url(#sail)" opacity="0.88"/>
    <!-- cross / pennant -->
    <path d="M-20 -110 L40 -125 L40 -118 L-20 -103 Z" fill="#c43a2a"/>
    <circle cx="-20" cy="-112" r="4" fill="url(#gold)"/>
    <!-- name plate -->
    <text x="5" y="78" text-anchor="middle" fill="#f0e0c0" font-family="Georgia, serif" font-size="16" letter-spacing="2">VICTORIA</text>
    <text x="5" y="98" text-anchor="middle" fill="#b8a080" font-family="Georgia, serif" font-size="12">ONE OF FIVE · ELCANO AT THE WHEEL</text>
  </g>

  <!-- globe edge you can touch -->
  <g transform="translate(160 160)" filter="url(#glow)">
    <circle cx="0" cy="0" r="78" fill="#0e2a40" stroke="#7ad0ff" stroke-width="2.5" opacity="0.95"/>
    <ellipse cx="0" cy="0" rx="78" ry="28" fill="none" stroke="#4a90b0" stroke-width="1.2" opacity="0.7"/>
    <ellipse cx="0" cy="0" rx="28" ry="78" fill="none" stroke="#4a90b0" stroke-width="1.2" opacity="0.55"/>
    <path d="M-50 -20 Q-10 -40 30 -10 Q50 20 10 45 Q-30 35 -50 -20" fill="#2f7a4a" opacity="0.55"/>
    <path d="M20 -50 Q45 -20 40 10" fill="none" stroke="#c9a060" stroke-width="2" stroke-dasharray="4 3" opacity="0.85"/>
    <circle cx="42" cy="8" r="4" fill="#ffe08a"/>
    <text x="0" y="110" text-anchor="middle" fill="#9ec8e8" font-family="Georgia, serif" font-size="14" letter-spacing="1">60 440 km · EDGE YOU CAN TOUCH</text>
  </g>

  <!-- title block -->
  <text x="600" y="48" text-anchor="middle" fill="#f4e8d0" font-family="Georgia, serif" font-size="28" letter-spacing="3">VICTORIA · ONE KEEL HOME</text>
  <text x="600" y="78" text-anchor="middle" fill="#b8a888" font-family="Georgia, serif" font-size="15" letter-spacing="2">after the bottle leaves — name who finishes</text>

  <!-- bottom caption -->
  <text x="600" y="700" text-anchor="middle" fill="#8a9aaa" font-family="Georgia, serif" font-size="13" letter-spacing="1">RC is open ocean · production pin is Seville · dual-egress is not private by default</text>
</svg>
