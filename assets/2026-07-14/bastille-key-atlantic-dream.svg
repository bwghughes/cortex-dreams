<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Bastille Key Atlantic — fortress falls, key crosses the ocean, porch lamp waits">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1f"/>
      <stop offset="50%" stop-color="#151a35"/>
      <stop offset="100%" stop-color="#1c1428"/>
    </linearGradient>
    <linearGradient id="paris" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0c36a"/>
      <stop offset="100%" stop-color="#c45a2a"/>
    </linearGradient>
    <linearGradient id="vernon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dffb3"/>
      <stop offset="100%" stop-color="#2a9fd6"/>
    </linearGradient>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a3a6a"/>
      <stop offset="50%" stop-color="#0f2748"/>
      <stop offset="100%" stop-color="#1a3a6a"/>
    </linearGradient>
    <linearGradient id="keyGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe08a"/>
      <stop offset="100%" stop-color="#d4a017"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#c9d7ff" opacity="0.55">
    <circle cx="80" cy="40" r="1.3"/>
    <circle cx="160" cy="70" r="1.1"/>
    <circle cx="250" cy="30" r="1.4"/>
    <circle cx="340" cy="90" r="1"/>
    <circle cx="480" cy="45" r="1.2"/>
    <circle cx="600" cy="75" r="1.1"/>
    <circle cx="720" cy="35" r="1.3"/>
    <circle cx="840" cy="80" r="1"/>
    <circle cx="900" cy="50" r="1.2"/>
    <circle cx="120" cy="120" r="1"/>
    <circle cx="780" cy="110" r="1.1"/>
  </g>

  <!-- ocean band -->
  <path d="M40 360 Q240 320 480 350 T920 340 L920 500 L40 500 Z" fill="url(#ocean)" opacity="0.85"/>
  <path d="M50 390 Q260 360 480 385 T910 370" fill="none" stroke="#4aa0ff" stroke-width="1.2" opacity="0.35" stroke-dasharray="6 8"/>
  <path d="M60 430 Q280 400 480 425 T900 410" fill="none" stroke="#6ec8ff" stroke-width="1" opacity="0.25" stroke-dasharray="4 10"/>

  <!-- left: Bastille rubble / keep silhouette -->
  <g transform="translate(70,210)" filter="url(#glow)">
    <rect x="20" y="40" width="26" height="110" rx="2" fill="url(#paris)" opacity="0.95"/>
    <rect x="54" y="20" width="34" height="130" rx="2" fill="url(#paris)"/>
    <rect x="96" y="50" width="24" height="100" rx="2" fill="url(#paris)" opacity="0.9"/>
    <rect x="40" y="0" width="18" height="28" fill="#e8b45a"/>
    <rect x="72" y="-10" width="18" height="38" fill="#e8b45a"/>
    <!-- fallen stones -->
    <rect x="0" y="145" width="16" height="10" rx="1" fill="#c48a4a" transform="rotate(-18 0 145)"/>
    <rect x="110" y="150" width="18" height="9" rx="1" fill="#d4a05a" transform="rotate(12 110 150)"/>
    <rect x="30" y="160" width="14" height="8" rx="1" fill="#b87a40" transform="rotate(-8 30 160)"/>
    <text x="70" y="190" text-anchor="middle" fill="#f0c36a" font-family="Georgia, serif" font-size="14" opacity="0.9">Paris keep</text>
  </g>

  <!-- right: Mount Vernon porch glow -->
  <g transform="translate(720,240)" filter="url(#glow)">
    <rect x="20" y="40" width="120" height="70" rx="3" fill="#1a2a28" stroke="url(#vernon)" stroke-width="2"/>
    <polygon points="10,40 80,5 150,40" fill="#16332e" stroke="url(#vernon)" stroke-width="1.5"/>
    <!-- columns -->
    <rect x="35" y="50" width="8" height="50" fill="#7dffb3" opacity="0.55"/>
    <rect x="60" y="50" width="8" height="50" fill="#7dffb3" opacity="0.55"/>
    <rect x="90" y="50" width="8" height="50" fill="#7dffb3" opacity="0.55"/>
    <rect x="115" y="50" width="8" height="50" fill="#7dffb3" opacity="0.55"/>
    <!-- porch lamp -->
    <circle cx="80" cy="48" r="8" fill="#ffe08a" opacity="0.95"/>
    <circle cx="80" cy="48" r="16" fill="#ffe08a" opacity="0.18"/>
    <text x="80" y="140" text-anchor="middle" fill="#7dffb3" font-family="Georgia, serif" font-size="14" opacity="0.9">Mount Vernon</text>
  </g>

  <!-- Atlantic arc -->
  <path d="M210 280 Q480 120 760 270" fill="none" stroke="#ffe08a" stroke-width="2.2" stroke-dasharray="10 9" opacity="0.85" filter="url(#glow)"/>
  <text x="480" y="145" text-anchor="middle" fill="#ffe08a" font-family="Georgia, serif" font-size="13" opacity="0.8">soft-power arc</text>

  <!-- flying key mid-Atlantic -->
  <g transform="translate(460,175) rotate(-18)" filter="url(#glow)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="url(#keyGold)" stroke-width="5"/>
    <rect x="12" y="-4" width="42" height="8" rx="2" fill="url(#keyGold)"/>
    <rect x="40" y="4" width="6" height="12" rx="1" fill="url(#keyGold)"/>
    <rect x="50" y="4" width="6" height="9" rx="1" fill="url(#keyGold)"/>
  </g>

  <!-- title plate -->
  <g>
    <rect x="240" y="470" width="480" height="46" rx="8" fill="#0c1224" opacity="0.85" stroke="#ffe08a" stroke-width="1"/>
    <text x="480" y="490" text-anchor="middle" fill="#ffe08a" font-family="Georgia, serif" font-size="16">After the walls fall — own the key, not the rubble</text>
    <text x="480" y="508" text-anchor="middle" fill="#9ab0d8" font-family="Georgia, serif" font-size="12">Bastille Key · Atlantic · 2026-07-14</text>
  </g>
<!-- hero-wire -->
</svg>
