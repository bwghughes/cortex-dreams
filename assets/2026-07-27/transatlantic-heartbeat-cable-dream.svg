<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Transatlantic Heartbeat Cable Dream — permanent copper wire across the Atlantic with a living pulse between two continents">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050a14"/>
      <stop offset="45%" stop-color="#0a1528"/>
      <stop offset="78%" stop-color="#0c1e36"/>
      <stop offset="100%" stop-color="#061018"/>
    </linearGradient>
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b2744" stop-opacity="0.2"/>
      <stop offset="40%" stop-color="#0d3a5c"/>
      <stop offset="100%" stop-color="#061820"/>
    </linearGradient>
    <linearGradient id="cable" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a227"/>
      <stop offset="20%" stop-color="#ffe08a"/>
      <stop offset="50%" stop-color="#a8d4ff"/>
      <stop offset="80%" stop-color="#ffe08a"/>
      <stop offset="100%" stop-color="#c9a227"/>
    </linearGradient>
    <radialGradient id="heartCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd0d8"/>
      <stop offset="35%" stop-color="#ff3b5c"/>
      <stop offset="75%" stop-color="#a01030"/>
      <stop offset="100%" stop-color="#400818" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heartGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b88" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#ff3b5c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#200810" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7ec8ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a2030" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="pulseGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Sky / ocean -->
  <rect width="1200" height="800" fill="url(#sky)"/>
  <rect y="420" width="1200" height="380" fill="url(#ocean)"/>

  <!-- Stars -->
  <g fill="#cfe6ff" opacity="0.55">
    <circle cx="110" cy="70" r="1.4"/>
    <circle cx="210" cy="120" r="1.1"/>
    <circle cx="340" cy="55" r="1.6"/>
    <circle cx="480" cy="95" r="1.2"/>
    <circle cx="620" cy="40" r="1.5"/>
    <circle cx="760" cy="110" r="1.1"/>
    <circle cx="890" cy="60" r="1.7"/>
    <circle cx="1020" cy="95" r="1.2"/>
    <circle cx="1120" cy="45" r="1.4"/>
    <circle cx="160" cy="200" r="1.0"/>
    <circle cx="980" cy="180" r="1.3"/>
  </g>

  <!-- Distant continent silhouettes -->
  <path d="M0 430 C40 400 90 390 140 405 C180 418 210 400 250 415 L250 800 L0 800 Z" fill="#0a1624" opacity="0.95"/>
  <path d="M950 420 C990 395 1040 400 1080 412 C1120 425 1160 405 1200 420 L1200 800 L950 800 Z" fill="#0a1624" opacity="0.95"/>

  <!-- Shore glows: Valentia (left) / Heart's Content (right) -->
  <circle cx="180" cy="430" r="70" fill="url(#shoreGlow)" filter="url(#glow)"/>
  <circle cx="1020" cy="430" r="70" fill="url(#shoreGlow)" filter="url(#glow)"/>

  <!-- Seabed cable shadow -->
  <path d="M180 445 C320 520 480 560 600 555 C740 548 880 500 1020 445" fill="none" stroke="#031018" stroke-width="10" opacity="0.55"/>

  <!-- Permanent copper cable -->
  <path d="M180 430 C320 505 480 545 600 540 C740 533 880 485 1020 430" fill="none" stroke="url(#cable)" stroke-width="5" stroke-linecap="round" filter="url(#soft)"/>
  <path d="M180 430 C320 505 480 545 600 540 C740 533 880 485 1020 430" fill="none" stroke="#ffe9a8" stroke-width="1.5" opacity="0.85"/>

  <!-- Pulse beads along the cable -->
  <g filter="url(#pulseGlow)">
    <circle cx="320" cy="480" r="5" fill="#ffd76a"/>
    <circle cx="480" cy="530" r="4.5" fill="#a8d4ff"/>
    <circle cx="600" cy="540" r="6" fill="#ffd76a"/>
    <circle cx="760" cy="515" r="4.5" fill="#a8d4ff"/>
    <circle cx="900" cy="470" r="5" fill="#ffd76a"/>
  </g>

  <!-- Living heart at mid-ocean -->
  <circle cx="600" cy="520" r="54" fill="url(#heartGlow)" filter="url(#glow)"/>
  <circle cx="600" cy="520" r="26" fill="url(#heartCore)"/>
  <path d="M600 512 C596 504 586 504 582 512 C578 520 590 532 600 540 C610 532 622 520 618 512 C614 504 604 504 600 512 Z" fill="#fff0f3" opacity="0.95"/>

  <!-- Station markers -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#d7e9ff">
    <circle cx="180" cy="430" r="7" fill="#7ec8ff"/>
    <circle cx="180" cy="430" r="3" fill="#0a1528"/>
    <text x="180" y="390" text-anchor="middle" font-size="18" letter-spacing="1.5">VALENTIA</text>
    <text x="180" y="412" text-anchor="middle" font-size="12" fill="#8fb4d8" letter-spacing="2">IRELAND · 1866</text>

    <circle cx="1020" cy="430" r="7" fill="#7ec8ff"/>
    <circle cx="1020" cy="430" r="3" fill="#0a1528"/>
    <text x="1020" y="390" text-anchor="middle" font-size="18" letter-spacing="1.5">HEART'S CONTENT</text>
    <text x="1020" y="412" text-anchor="middle" font-size="12" fill="#8fb4d8" letter-spacing="2">NEWFOUNDLAND · LANDING</text>
  </g>

  <!-- Caption -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#e8f2ff">
    <text x="600" y="680" text-anchor="middle" font-size="34" letter-spacing="3">TRANSATLANTIC HEARTBEAT</text>
    <text x="600" y="718" text-anchor="middle" font-size="16" fill="#9ec0e0" letter-spacing="2.5">PERMANENT CABLE · LATENCY AS POLITE DELAY · FIRST GLOBAL NERVOUS SYSTEM</text>
    <text x="600" y="752" text-anchor="middle" font-size="14" fill="#6f92b4" letter-spacing="1.5">July 27, 1866 → 2026 · the copper still holds</text>
  </g>
</svg>
