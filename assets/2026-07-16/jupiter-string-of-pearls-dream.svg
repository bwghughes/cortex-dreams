<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Jupiter String of Pearls — glowing necklace of comet fragments arcs into a banded gas giant; fragment G oversized; scar ledger on southern bands">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="55%" stop-color="#0c1228"/>
      <stop offset="100%" stop-color="#14101c"/>
    </linearGradient>
    <radialGradient id="jupCore" cx="62%" cy="48%" r="38%">
      <stop offset="0%" stop-color="#f0c27a"/>
      <stop offset="35%" stop-color="#c4782a"/>
      <stop offset="70%" stop-color="#8a3a18"/>
      <stop offset="100%" stop-color="#3a1a10"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8b86a" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#9a4a22" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5a2814" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="pearl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="55%" stop-color="#c9e4ff"/>
      <stop offset="100%" stop-color="#7aa8d4"/>
    </linearGradient>
    <linearGradient id="pearlG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff6d0"/>
      <stop offset="50%" stop-color="#ffd36a"/>
      <stop offset="100%" stop-color="#e08a20"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff2a8"/>
      <stop offset="40%" stop-color="#ff9a3a"/>
      <stop offset="100%" stop-color="#c42810"/>
    </linearGradient>
    <linearGradient id="scar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a0a08" stop-opacity="0"/>
      <stop offset="40%" stop-color="#2a100c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1a0a08" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <filter id="bigGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- night sky -->
  <rect width="960" height="540" fill="url(#sky)"/>
  <!-- sparse stars -->
  <g fill="#dce8ff" opacity="0.7">
    <circle cx="48" cy="42" r="1.2"/>
    <circle cx="120" cy="88" r="0.9"/>
    <circle cx="210" cy="36" r="1.1"/>
    <circle cx="300" cy="70" r="0.8"/>
    <circle cx="380" cy="28" r="1.0"/>
    <circle cx="460" cy="95" r="0.7"/>
    <circle cx="540" cy="40" r="1.1"/>
    <circle cx="620" cy="78" r="0.8"/>
    <circle cx="720" cy="32" r="1.0"/>
    <circle cx="820" cy="64" r="0.9"/>
    <circle cx="900" cy="48" r="1.2"/>
    <circle cx="80" cy="160" r="0.7"/>
    <circle cx="180" cy="200" r="0.8"/>
    <circle cx="860" cy="180" r="0.7"/>
    <circle cx="920" cy="220" r="0.9"/>
  </g>

  <!-- Jupiter body -->
  <g transform="translate(620,270)">
    <circle r="168" fill="url(#jupCore)" filter="url(#soft)"/>
    <!-- bands -->
    <ellipse cx="0" cy="-90" rx="155" ry="18" fill="url(#band)" opacity="0.55"/>
    <ellipse cx="0" cy="-50" rx="162" ry="16" fill="#d4a060" opacity="0.25"/>
    <ellipse cx="0" cy="-10" rx="166" ry="20" fill="url(#band)" opacity="0.5"/>
    <ellipse cx="0" cy="35" rx="160" ry="18" fill="#a85828" opacity="0.35"/>
    <ellipse cx="0" cy="75" rx="148" ry="22" fill="url(#band)" opacity="0.55"/>
    <ellipse cx="0" cy="115" rx="125" ry="16" fill="#6a3018" opacity="0.4"/>
    <!-- Great Red Spot-ish -->
    <ellipse cx="55" cy="20" rx="28" ry="18" fill="#c04028" opacity="0.55" filter="url(#soft)"/>
    <!-- scar ledger on southern bands -->
    <g opacity="0.9">
      <ellipse cx="-40" cy="78" rx="22" ry="9" fill="url(#scar)"/>
      <ellipse cx="10" cy="88" rx="18" ry="7" fill="#1a0806" opacity="0.75"/>
      <ellipse cx="55" cy="96" rx="26" ry="10" fill="url(#scar)"/>
      <ellipse cx="-15" cy="108" rx="14" ry="6" fill="#120604" opacity="0.7"/>
      <ellipse cx="35" cy="118" rx="20" ry="8" fill="#1c0a08" opacity="0.8"/>
    </g>
    <!-- limb shadow -->
    <circle r="168" fill="none" stroke="#0a0610" stroke-width="8" opacity="0.35"/>
  </g>

  <!-- impact fireball on limb -->
  <g filter="url(#bigGlow)" transform="translate(500,340)">
    <ellipse cx="0" cy="0" rx="28" ry="18" fill="url(#fire)" opacity="0.95" transform="rotate(-25)"/>
    <ellipse cx="-8" cy="-6" rx="12" ry="8" fill="#fff4c0" opacity="0.9"/>
  </g>

  <!-- string path (invisible guide drawn as faint arc) -->
  <path d="M 70 120 C 180 90, 280 130, 360 180 S 470 280, 500 340"
        fill="none" stroke="#8ab4ff" stroke-width="1.2" stroke-dasharray="3 7" opacity="0.35"/>

  <!-- pearls A–F small, G large, then H–L smaller trailing -->
  <!-- A -->
  <g filter="url(#glow)" transform="translate(78,118)">
    <circle r="7" fill="url(#pearl)"/>
    <text x="0" y="-14" text-anchor="middle" fill="#cfe0ff" font-family="Georgia, serif" font-size="11" opacity="0.85">A</text>
  </g>
  <!-- B -->
  <g filter="url(#glow)" transform="translate(130,108)">
    <circle r="6.5" fill="url(#pearl)"/>
    <text x="0" y="-13" text-anchor="middle" fill="#cfe0ff" font-family="Georgia, serif" font-size="11" opacity="0.85">B</text>
  </g>
  <!-- C -->
  <g filter="url(#glow)" transform="translate(180,112)">
    <circle r="7" fill="url(#pearl)"/>
    <text x="0" y="-14" text-anchor="middle" fill="#cfe0ff" font-family="Georgia, serif" font-size="11" opacity="0.85">C</text>
  </g>
  <!-- D -->
  <g filter="url(#glow)" transform="translate(230,128)">
    <circle r="6" fill="url(#pearl)"/>
    <text x="0" y="-13" text-anchor="middle" fill="#cfe0ff" font-family="Georgia, serif" font-size="11" opacity="0.85">D</text>
  </g>
  <!-- E -->
  <g filter="url(#glow)" transform="translate(275,148)">
    <circle r="7.5" fill="url(#pearl)"/>
    <text x="0" y="-14" text-anchor="middle" fill="#cfe0ff" font-family="Georgia, serif" font-size="11" opacity="0.85">E</text>
  </g>
  <!-- F -->
  <g filter="url(#glow)" transform="translate(318,172)">
    <circle r="6.5" fill="url(#pearl)"/>
    <text x="0" y="-13" text-anchor="middle" fill="#cfe0ff" font-family="Georgia, serif" font-size="11" opacity="0.85">F</text>
  </g>
  <!-- G oversized show-stopper -->
  <g filter="url(#bigGlow)" transform="translate(365,205)">
    <circle r="16" fill="url(#pearlG)"/>
    <circle r="16" fill="none" stroke="#fff0a0" stroke-width="1.5" opacity="0.8"/>
    <text x="0" y="-24" text-anchor="middle" fill="#ffe08a" font-family="Georgia, serif" font-size="15" font-weight="700">G</text>
  </g>
  <!-- H -->
  <g filter="url(#glow)" transform="translate(410,245)">
    <circle r="6" fill="url(#pearl)"/>
    <text x="0" y="-12" text-anchor="middle" fill="#cfe0ff" font-family="Georgia, serif" font-size="10" opacity="0.8">H</text>
  </g>
  <!-- I -->
  <g filter="url(#glow)" transform="translate(445,280)">
    <circle r="5.5" fill="url(#pearl)"/>
    <text x="0" y="-11" text-anchor="middle" fill="#cfe0ff" font-family="Georgia, serif" font-size="10" opacity="0.75">I</text>
  </g>
  <!-- J mid-fall -->
  <g filter="url(#glow)" transform="translate(472,312)">
    <circle r="5" fill="url(#pearl)" opacity="0.9"/>
  </g>

  <!-- title cartouche -->
  <g transform="translate(48,430)">
    <rect x="0" y="0" width="420" height="72" rx="10" fill="#0a0e1c" stroke="#3a4a6a" stroke-width="1.2" opacity="0.88"/>
    <text x="20" y="30" fill="#f0e6c8" font-family="Georgia, serif" font-size="20" font-weight="700">Jupiter · String of Pearls</text>
    <text x="20" y="54" fill="#9ab0d0" font-family="Georgia, serif" font-size="13">One body. Many fragments. Name your G.</text>
  </g>

  <!-- date whisper -->
  <text x="900" y="520" text-anchor="end" fill="#5a6a88" font-family="Georgia, serif" font-size="12" opacity="0.8">16 July 1994 → 2026</text>
</svg>
