<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Finnish Lanes Governance Track</title>
  <desc id="desc">Eight blue lanes, ten medal moons, and a baton path from origin to proof.</desc>
  <rect width="900" height="520" fill="#f7fbff"/>
  <rect x="0" y="210" width="900" height="74" fill="#1f5aa6" opacity="0.16"/>
  <rect x="270" y="0" width="74" height="520" fill="#1f5aa6" opacity="0.16"/>

  <g transform="translate(90 72)">
    <text x="0" y="-28" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#18304f">cortex-dream-cycle-2026-07-09-finnish-lanes-governance-track</text>
    <text x="0" y="0" font-family="Georgia, serif" font-size="34" fill="#10233f">relay discipline, not privacy perfume</text>
    <text x="0" y="34" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#4a607a">lane → baton → handoff → proof</text>
  </g>

  <g transform="translate(90 150)">
    <rect x="0" y="0" width="720" height="280" rx="28" fill="#ffffff" stroke="#1f5aa6" stroke-width="5"/>
    <g stroke="#1f5aa6" stroke-width="2" opacity="0.62">
      <line x1="0" y1="35" x2="720" y2="35"/>
      <line x1="0" y1="70" x2="720" y2="70"/>
      <line x1="0" y1="105" x2="720" y2="105"/>
      <line x1="0" y1="140" x2="720" y2="140"/>
      <line x1="0" y1="175" x2="720" y2="175"/>
      <line x1="0" y1="210" x2="720" y2="210"/>
      <line x1="0" y1="245" x2="720" y2="245"/>
    </g>

    <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#5d728c" opacity="0.85">
      <text x="12" y="25">device</text>
      <text x="12" y="60">mac fleet</text>
      <text x="12" y="95">on-prem</text>
      <text x="12" y="130">enclave</text>
      <text x="12" y="165">vendor</text>
      <text x="12" y="200">apple path</text>
      <text x="12" y="235">human</text>
      <text x="12" y="270">archive</text>
    </g>

    <path d="M70 238 C165 190, 200 88, 310 102 S455 225, 560 150 S665 70, 700 42" fill="none" stroke="#d64045" stroke-width="7" stroke-linecap="round"/>
    <circle cx="70" cy="238" r="13" fill="#d64045"/>
    <circle cx="700" cy="42" r="13" fill="#d64045"/>
    <text x="44" y="263" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#10233f">origin</text>
    <text x="666" y="27" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#10233f">proof</text>

    <g fill="#d9a441" stroke="#8e6b21" stroke-width="2">
      <circle cx="170" cy="28" r="12"/><circle cx="236" cy="68" r="12"/>
      <circle cx="310" cy="104" r="12"/><circle cx="382" cy="142" r="12"/>
      <circle cx="455" cy="178" r="12"/><circle cx="522" cy="215" r="12"/>
      <circle cx="592" cy="246" r="12"/><circle cx="650" cy="115" r="12"/>
      <circle cx="125" cy="140" r="12"/><circle cx="275" cy="245" r="12"/>
    </g>
  </g>

  <g transform="translate(90 470)" font-family="Georgia, serif" fill="#10233f">
    <text x="0" y="0" font-size="20">Dropped baton wearing a privacy sticker = not governed.</text>
    <text x="0" y="28" font-size="16" fill="#4a607a">Name the baton. Name every handoff. Keep the living signal warm.</text>
  </g>
</svg>
