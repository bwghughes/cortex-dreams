<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Contemplating the Sun: Glen Canyon eclipse, Moon biting solar disk, silhouettes and dog, Perseid streaks, eclipse glasses">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0b18"/>
      <stop offset="45%" stop-color="#3a1520"/>
      <stop offset="78%" stop-color="#6b2a1c"/>
      <stop offset="100%" stop-color="#c45a28"/>
    </linearGradient>
    <radialGradient id="sunCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6c8"/>
      <stop offset="40%" stop-color="#ffd15a"/>
      <stop offset="75%" stop-color="#ff8a2b"/>
      <stop offset="100%" stop-color="#ff5a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="corona" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9a0" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#ffb347" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff7a20" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="canyon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a2416"/>
      <stop offset="100%" stop-color="#2a120c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a22" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#2c3340" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#11151c" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- sky -->
  <rect width="960" height="540" fill="url(#sky)"/>

  <!-- faint stars -->
  <g fill="#ffe8c8" opacity="0.55">
    <circle cx="70" cy="48" r="1.1"/>
    <circle cx="130" cy="90" r="0.8"/>
    <circle cx="210" cy="36" r="1.2"/>
    <circle cx="290" cy="72" r="0.7"/>
    <circle cx="370" cy="44" r="1.0"/>
    <circle cx="450" cy="28" r="0.9"/>
    <circle cx="820" cy="60" r="1.1"/>
    <circle cx="880" cy="100" r="0.8"/>
    <circle cx="760" cy="40" r="1.0"/>
    <circle cx="700" cy="85" r="0.7"/>
  </g>

  <!-- Perseid streaks -->
  <g stroke="#ffe6b0" stroke-linecap="round" opacity="0.75">
    <line x1="120" y1="40" x2="190" y2="95" stroke-width="1.6"/>
    <line x1="250" y1="30" x2="300" y2="70" stroke-width="1.2"/>
    <line x1="780" y1="50" x2="840" y2="95" stroke-width="1.5"/>
    <line x1="680" y1="25" x2="720" y2="55" stroke-width="1.1"/>
  </g>
  <g fill="#fff2c8">
    <circle cx="120" cy="40" r="1.6"/>
    <circle cx="250" cy="30" r="1.3"/>
    <circle cx="780" cy="50" r="1.5"/>
    <circle cx="680" cy="25" r="1.2"/>
  </g>

  <!-- corona behind eclipse -->
  <circle cx="480" cy="175" r="118" fill="url(#corona)" filter="url(#glow)" opacity="0.85"/>

  <!-- sun disk -->
  <circle cx="480" cy="175" r="78" fill="url(#sunCore)"/>

  <!-- moon occlusion -->
  <circle cx="505" cy="168" r="76" fill="#12080f"/>
  <!-- thin crescent fire leftover -->
  <path d="M430 140 C445 110, 500 100, 545 135 C520 118, 470 118, 430 140 Z" fill="#ffd76a" opacity="0.9" filter="url(#soft)"/>
  <path d="M425 210 C450 245, 520 248, 555 210 C525 238, 455 238, 425 210 Z" fill="#ff9a3a" opacity="0.55" filter="url(#soft)"/>

  <!-- canyon rim -->
  <path d="M0 360 L80 340 L160 355 L250 330 L340 350 L430 325 L520 345 L610 320 L700 348 L790 328 L880 350 L960 335 L960 540 L0 540 Z" fill="url(#canyon)"/>
  <path d="M0 390 L120 375 L230 395 L350 370 L470 400 L590 375 L710 398 L830 372 L960 390 L960 540 L0 540 Z" fill="#1a0e0a" opacity="0.85"/>

  <!-- silhouettes: ranger, astronomer, dog -->
  <g fill="#0a0608">
    <!-- ranger left -->
    <ellipse cx="300" cy="392" rx="18" ry="8"/>
    <rect x="289" y="330" width="22" height="62" rx="8"/>
    <circle cx="300" cy="312" r="14"/>
    <rect x="286" y="300" width="28" height="8" rx="3"/>
    <!-- pointing arm -->
    <path d="M310 350 L360 300 L366 305 L318 356 Z"/>

    <!-- astronomer center-right -->
    <ellipse cx="560" cy="400" rx="20" ry="8"/>
    <rect x="548" y="335" width="24" height="66" rx="9"/>
    <circle cx="560" cy="316" r="15"/>
    <!-- telescope -->
    <rect x="575" y="300" width="70" height="10" rx="4" transform="rotate(-18 575 300)"/>
    <circle cx="640" cy="278" r="8"/>

    <!-- dog -->
    <ellipse cx="420" cy="412" rx="22" ry="10"/>
    <ellipse cx="402" cy="400" rx="10" ry="8"/>
    <path d="M392 396 L385 385 L390 384 L398 394 Z"/>
    <path d="M438 408 L452 400 L454 405 L440 412 Z"/>
    <circle cx="398" cy="397" r="1.4" fill="#3a2018"/>
  </g>

  <!-- eclipse glasses card bottom-right -->
  <g transform="translate(700,400)">
    <rect x="0" y="0" width="210" height="100" rx="12" fill="url(#glass)" stroke="#d8c39a" stroke-width="2"/>
    <text x="105" y="28" text-anchor="middle" fill="#f3e6c8" font-family="Georgia, serif" font-size="14" font-weight="700">ECLIPSE GLASSES</text>
    <text x="105" y="48" text-anchor="middle" fill="#c9b48a" font-family="Georgia, serif" font-size="11">controlled occlusion</text>
    <!-- two dark lenses -->
    <rect x="28" y="58" width="60" height="28" rx="10" fill="#05070c" stroke="#8a7a55" stroke-width="1.5"/>
    <rect x="122" y="58" width="60" height="28" rx="10" fill="#05070c" stroke="#8a7a55" stroke-width="1.5"/>
    <rect x="88" y="66" width="34" height="10" rx="3" fill="#8a7a55"/>
    <!-- tiny sun reflection in left lens -->
    <circle cx="52" cy="70" r="5" fill="#ffb347" opacity="0.55"/>
    <circle cx="58" cy="68" r="3.5" fill="#12080f"/>
  </g>

  <!-- title plaque -->
  <g transform="translate(36,430)">
    <rect x="0" y="0" width="280" height="78" rx="10" fill="#12080f" opacity="0.82" stroke="#c45a28" stroke-width="1.5"/>
    <text x="20" y="30" fill="#ffe9a0" font-family="Georgia, serif" font-size="18">Contemplating the Sun</text>
    <text x="20" y="52" fill="#f0c090" font-family="Georgia, serif" font-size="13">9 August · filter before stare</text>
  </g>
</svg>
